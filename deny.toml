# cargo-deny supply-chain policy. See docs/15-CI-AND-RELEASE-GATES.md.

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies have no version; that is not a real wildcard.
allow-wildcard-paths = true

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
