# The standalone stack's front door: one origin over plain HTTP.
#
# `nginx.conf` beside this is the same shape with TLS, for a real deployment.
# This one exists because the two-minute demo could not do the thing it exists
# to demonstrate: the host handed the browser `ws://127.0.0.1:8443/collab`,
# which is the *browser's* loopback and a different port from the page, so a
# second participant on another machine dialled themselves (PROD-12).
#
# With one origin the host derives the socket address from the request it just
# answered, and a share link works wherever it is opened — which is the whole
# point of a share link.

upstream opencalc_host   { server host:8080;   }
upstream opencalc_collab { server collab:8443; }

server {
  listen 80;
  server_name _;

  # A spreadsheet is uploaded whole. nginx's 1 MB default rejects most real
  # ones with a 413 that reads as a bug in the editor rather than a limit here.
  client_max_body_size 64m;

  location /collab {
    proxy_pass http://opencalc_collab;

    # The WebSocket upgrade. Without these three the handshake is answered with
    # a plain 200 and the editor reconnects forever, saying nothing useful.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Longer than the server's own idle timeout: a co-editing socket is quiet
    # whenever nobody is typing, and the server should decide when a participant
    # has gone rather than the proxy deciding for it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host              $host;
    # **`$http_host`, not `$host`.** nginx's `$host` strips the port, so a demo
    # reached on `127.0.0.1:8080` would tell the host it was reached on
    # `127.0.0.1` — and the collaboration endpoint it derives from that names
    # port 80, where nothing is listening. The browser then fails to connect
    # with nothing in any log to say why, which is the same silence PROD-12 was
    # about (`PROD-15`).
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://opencalc_host;
    proxy_set_header Host              $host;
    # **`$http_host`, not `$host`.** nginx's `$host` strips the port, so a demo
    # reached on `127.0.0.1:8080` would tell the host it was reached on
    # `127.0.0.1` — and the collaboration endpoint it derives from that names
    # port 80, where nothing is listening. The browser then fails to connect
    # with nothing in any log to say why, which is the same silence PROD-12 was
    # about (`PROD-15`).
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # What tells the host to hand out `wss://` rather than `ws://` when this
    # sits behind TLS termination further out.
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
