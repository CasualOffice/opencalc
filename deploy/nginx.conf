# OpenCalc behind nginx. The two things that are not obvious are marked.
#
# One origin for everything: the editor, the API and the WebSocket. A share link
# is then a single URL with no CORS to configure and no second certificate.

upstream opencalc_host   { server host:8080;   }
upstream opencalc_collab { server collab:8443; }

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name opencalc.example.com;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;

  # A spreadsheet is uploaded whole. The default of 1 MB rejects most real ones
  # with a 413 that looks like a bug in the editor rather than a limit here.
  client_max_body_size 64m;

  location /collab {
    proxy_pass http://opencalc_collab;

    # (1) The WebSocket upgrade. Without these three the handshake is answered
    # with a plain 200 and the editor reconnects forever, which is the single
    # most common way this deployment is got wrong.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # (2) A co-editing socket is idle whenever nobody is typing, and nginx closes
    # an idle proxied connection after 60s by default. Longer than the server's
    # own client ping, so the server decides when a participant is gone rather
    # than the proxy deciding for it.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://opencalc_host;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
