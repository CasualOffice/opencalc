# The cluster's proxy. One origin for the editor, the API and the WebSocket,
# with collaboration traffic spread across the nodes.

upstream opencalc_host { server host:8080; }

upstream opencalc_collab {
  # Plain round-robin, deliberately. A client may land on any node: one node
  # leads a given document and the others relay to it, so affinity buys nothing
  # and is the sticky session ADR-012 rules out. If a node dies, its documents
  # are led by whoever claims the lease next.
  server collab-a:8443;
  server collab-b:8443;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 64m;

  location /collab {
    proxy_pass http://opencalc_collab;

    # The WebSocket upgrade. Without these the handshake is answered with a
    # plain 200 and the editor reconnects forever.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Longer than the server's own idle timeout: a co-editing socket is quiet
    # whenever nobody is typing, and the server should decide when a participant
    # is gone rather than the proxy deciding for it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host              $host;
    # **`$http_host`, not `$host`.** nginx's `$host` strips the port, so a demo
    # reached on `127.0.0.1:8080` would tell the host it was reached on
    # `127.0.0.1` — and the collaboration endpoint it derives from that names
    # port 80, where nothing is listening. The browser then fails to connect
    # with nothing in any log to say why, which is the same silence PROD-12 was
    # about (`PROD-15`).
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://opencalc_host;
    proxy_set_header Host            $host;
    # **`$http_host`, not `$host`.** nginx's `$host` strips the port, so a demo
    # reached on `127.0.0.1:8080` would tell the host it was reached on
    # `127.0.0.1` — and the collaboration endpoint it derives from that names
    # port 80, where nothing is listening. The browser then fails to connect
    # with nothing in any log to say why, which is the same silence PROD-12 was
    # about (`PROD-15`).
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
