<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCalc — editor demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6df6'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4'%3E%3Crect x='7' y='7' width='18' height='18' rx='2'/%3E%3Cpath d='M7 13h18M13 7v18'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./editor.css?v=16" />
  </head>
  <body class="editor-body">
    <header class="app-header">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
      </span>
      <a class="tb-brand" href="./index.html">OpenCalc</a>
      <span class="badge"><span class="dot"></span>Alpha</span>
      <div class="header-right">
      <span class="tb-status" id="tb-status">loading engine…</span>
      <div class="settings">
        <button id="tb-settings" class="tb-icon" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div id="settings-panel" class="settings-panel" hidden>
          <label class="set-row">
            <span>Theme</span>
            <select id="set-theme">
              <option value="auto">Auto</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="set-row">
            <span>Scroll speed</span>
            <span class="range-wrap">
              <input id="set-scroll" type="range" min="0.1" max="1.5" step="0.05" value="0.8" />
              <span class="range-val" id="set-scroll-val">0.80</span>
            </span>
          </label>
          <div class="set-row">
            <span>Accent</span>
            <span class="swatches" id="set-accent">
              <button data-c="#2f6df6" style="background:#2f6df6" aria-label="Blue"></button>
              <button data-c="#16a34a" style="background:#16a34a" aria-label="Green"></button>
              <button data-c="#db2777" style="background:#db2777" aria-label="Pink"></button>
              <button data-c="#f59e0b" style="background:#f59e0b" aria-label="Amber"></button>
              <button data-c="#8b5cf6" style="background:#8b5cf6" aria-label="Violet"></button>
            </span>
          </div>
        </div>
      </div>
      </div>
    </header>

    <div class="toolbar" role="toolbar" aria-label="Formatting">
      <div class="tb-group">
        <button id="tb-new" class="tb-btn" title="New" aria-label="New">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </button>
        <label class="tb-btn tb-file" title="Open (.xlsx, .csv, .tsv, .psv)" aria-label="Open">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <input id="tb-open" type="file" accept=".xlsx,.csv,.tsv,.psv" />
        </label>
        <div class="menu-wrap">
          <button id="tb-save" class="tb-btn" title="Download" aria-label="Download" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <div id="save-menu" class="popmenu" hidden>
            <button data-fmt="xlsx">Excel (.xlsx)</button>
            <button data-fmt="csv">CSV (.csv)</button>
            <button data-fmt="tsv">Tab-separated (.tsv)</button>
            <button data-fmt="psv">Pipe-separated (.psv)</button>
          </div>
        </div>
      </div>
      <span class="tb-sep"></span>
      <div class="tb-group">
        <button id="tb-undo" class="tb-btn" disabled title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button id="tb-redo" class="tb-btn" disabled title="Redo (Ctrl+Y)" aria-label="Redo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
      <span class="tb-sep"></span>
      <div class="tb-group controls" id="tbg-font" data-collapse="6">
        <input id="tb-font" class="tb-select tb-font" type="text" list="tb-font-list"
               title="Font (type any font)" aria-label="Font" placeholder="Default" />
        <datalist id="tb-font-list">
          <option>Calibri</option><option>Arial</option><option>Aptos</option>
          <option>Times New Roman</option><option>Georgia</option><option>Verdana</option>
          <option>Courier New</option><option>Helvetica</option><option>Tahoma</option>
        </datalist>
        <input id="tb-size" class="tb-select tb-size" type="text" inputmode="decimal"
               list="tb-size-list" title="Font size (type any size)" aria-label="Font size" placeholder="11" />
        <datalist id="tb-size-list">
          <option>8</option><option>9</option><option>10</option><option>11</option>
          <option>12</option><option>14</option><option>16</option><option>18</option>
          <option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option>
        </datalist>
        <button id="tb-size-up" class="tb-btn glyph" title="Increase font size" aria-label="Increase font size">A&#9650;</button>
        <button id="tb-size-down" class="tb-btn glyph" title="Decrease font size" aria-label="Decrease font size">A&#9660;</button>
      </div>
      <button class="tb-btn tb-collapsed" data-for="tbg-font" title="Font" aria-haspopup="true" hidden><span>Font</span><svg class="tbc-caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4 4-4"/></svg></button>
      <div class="tb-flyout popmenu" data-flyout="tbg-font" hidden></div>
      <span class="tb-sep"></span>
      <div class="tb-group">
        <button id="tb-bold" class="tb-btn tb-toggle" title="Bold (Ctrl+B)" aria-label="Bold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
        </button>
        <button id="tb-italic" class="tb-btn tb-toggle" title="Italic (Ctrl+I)" aria-label="Italic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
        </button>
        <button id="tb-underline" class="tb-btn tb-toggle" title="Underline (Ctrl+U)" aria-label="Underline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M6 3v7a6 6 0 0 0 12 0V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
        </button>
        <button id="tb-strike" class="tb-btn tb-toggle" title="Strikethrough" aria-label="Strikethrough">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M17.3 5A4 4 0 0 0 14 4h-4a3.5 3.5 0 0 0-1.6 6.6"/><path d="M7 15a3.5 3.5 0 0 0 3 2h4a3.5 3.5 0 0 0 1.3-.3"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
      </div>
      <span class="tb-sep"></span>
      <div class="tb-group" id="tbg-color" data-collapse="5">
        <div class="menu-wrap">
          <button id="tb-fontcolor" class="tb-btn" title="Text color" aria-label="Text color" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M5 20l5.5-14h3L19 20"/><line x1="8" y1="15" x2="16" y2="15"/></svg>
          </button>
          <!-- Populated by buildColorMenu(): palette grid + no-color + custom hex + recent. -->
          <div id="fontcolor-menu" class="popmenu color-menu" hidden></div>
        </div>
        <div class="menu-wrap">
          <button id="tb-fillcolor" class="tb-btn" title="Fill color" aria-label="Fill color" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M19 11l-8-8-8.5 8.5a2 2 0 0 0 0 2.8L8 20a2 2 0 0 0 2.8 0L19 11z"/><path d="M5 8l6 6"/><path d="M20.5 15s1.5 2 1.5 3a1.5 1.5 0 1 1-3 0c0-1 1.5-3 1.5-3z"/></svg>
          </button>
          <div id="fillcolor-menu" class="popmenu color-menu" hidden></div>
        </div>
      </div>
      <button class="tb-btn tb-collapsed" data-for="tbg-color" title="Color" aria-haspopup="true" hidden><span>Color</span><svg class="tbc-caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4 4-4"/></svg></button>
      <div class="tb-flyout popmenu" data-flyout="tbg-color" hidden></div>
      <span class="tb-sep"></span>
      <div class="tb-group" id="tbg-align" data-collapse="4">
        <button class="tb-btn tb-toggle tb-align" data-al="left" title="Align left" aria-label="Align left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button class="tb-btn tb-toggle tb-align" data-al="center" title="Align center" aria-label="Align center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <button class="tb-btn tb-toggle tb-align" data-al="right" title="Align right" aria-label="Align right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button id="tb-wrap" class="tb-btn tb-toggle" title="Wrap text" aria-label="Wrap text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="3" y1="6" x2="21" y2="6"/><path d="M3 12h15a3 3 0 0 1 0 6h-4"/><polyline points="16 16 14 18 16 20"/><line x1="3" y1="18" x2="8" y2="18"/></svg>
        </button>
        <button id="tb-merge" class="tb-btn" title="Merge cells" aria-label="Merge cells">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="3" y="5" width="18" height="14" rx="1"/><line x1="12" y1="5" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="19"/><polyline points="8 10 10 12 8 14"/><polyline points="16 10 14 12 16 14"/></svg>
        </button>
        <div class="menu-wrap">
          <button id="tb-valign" class="tb-btn" title="Vertical align" aria-label="Vertical align" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="12" y1="3" x2="12" y2="21"/><polyline points="8 7 12 3 16 7"/><polyline points="8 17 12 21 16 17"/></svg>
          </button>
          <div id="valign-menu" class="popmenu" hidden>
            <button data-va="top">Align top</button>
            <button data-va="middle">Align middle</button>
            <button data-va="bottom">Align bottom</button>
          </div>
        </div>
      </div>
      <button class="tb-btn tb-collapsed" data-for="tbg-align" title="Alignment" aria-haspopup="true" hidden><span>Align</span><svg class="tbc-caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4 4-4"/></svg></button>
      <div class="tb-flyout popmenu" data-flyout="tbg-align" hidden></div>
      <span class="tb-sep"></span>
      <div class="tb-group" id="tbg-number" data-collapse="3">
        <button id="tb-currency" class="tb-btn" title="Currency" aria-label="Currency">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </button>
        <button id="tb-percent" class="tb-btn" title="Percent" aria-label="Percent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
        </button>
        <button id="tb-comma" class="tb-btn glyph mono" title="Comma style" aria-label="Comma style">,</button>
        <button id="tb-inc-dec" class="tb-btn glyph mono nf-dec" title="Increase decimals" aria-label="Increase decimals">.0&#8594;</button>
        <button id="tb-dec-dec" class="tb-btn glyph mono nf-dec" title="Decrease decimals" aria-label="Decrease decimals">&#8592;.0</button>
        <div class="menu-wrap">
          <button id="tb-numfmt" class="tb-btn" title="Number format" aria-label="Number format" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
          </button>
          <div id="numfmt-menu" class="popmenu" hidden>
            <button data-nf="">Automatic (General)</button>
            <button data-nf="0">Number (0)</button>
            <button data-nf="0.00">Number (0.00)</button>
            <button data-nf="#,##0">Thousands (#,##0)</button>
            <button data-nf="#,##0.00">Thousands (#,##0.00)</button>
            <button data-nf="0%">Percent (0%)</button>
            <button data-nf="0.00%">Percent (0.00%)</button>
            <button data-nf="$#,##0.00">Currency ($#,##0.00)</button>
            <button data-nf="_($* #,##0.00_);_($* (#,##0.00);_($* &quot;-&quot;??_);_(@_)">Accounting</button>
            <button data-nf="yyyy-mm-dd">Short Date (yyyy-mm-dd)</button>
            <button data-nf="dddd, mmmm d, yyyy">Long Date</button>
            <button data-nf="h:mm:ss AM/PM">Time (h:mm:ss AM/PM)</button>
            <button data-nf="0.00E+00">Scientific (0.00E+00)</button>
            <button data-nf="@">Text (@)</button>
          </div>
        </div>
        <div class="menu-wrap">
          <button id="tb-border" class="tb-btn" title="Borders" aria-label="Borders" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
          </button>
          <!-- Populated by buildBorderMenu(): placement grid + line-style + color. -->
          <div id="border-menu" class="popmenu border-menu" hidden></div>
        </div>
      </div>
      <button class="tb-btn tb-collapsed" data-for="tbg-number" title="Number format" aria-haspopup="true" hidden><span>Number</span><svg class="tbc-caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4 4-4"/></svg></button>
      <div class="tb-flyout popmenu" data-flyout="tbg-number" hidden></div>
      <span class="tb-sep"></span>
      <div class="tb-group" id="tbg-data" data-collapse="2">
        <div class="menu-wrap">
          <button id="tb-freeze" class="tb-btn" title="Freeze panes" aria-label="Freeze panes" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
          <div id="freeze-menu" class="popmenu" hidden>
            <button data-fz="sel">Freeze up to selection</button>
            <button data-fz="row">Freeze top row</button>
            <button data-fz="col">Freeze first column</button>
            <button data-fz="none">Unfreeze</button>
            <div class="menu-sep"></div>
            <button data-fz="gridlines">Toggle gridlines</button>
          </div>
        </div>
        <div class="menu-wrap">
          <button id="tb-sort" class="tb-btn" title="Sort range" aria-label="Sort range" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><line x1="4" y1="6" x2="13" y2="6"/><line x1="4" y1="12" x2="11" y2="12"/><line x1="4" y1="18" x2="9" y2="18"/><polyline points="17 8 20 5 23 8"/><line x1="20" y1="5" x2="20" y2="19"/></svg>
          </button>
          <div id="sort-menu" class="popmenu" hidden>
            <button data-sort="asc">Sort range A → Z</button>
            <button data-sort="desc">Sort range Z → A</button>
          </div>
        </div>
        <button id="tb-filter" class="tb-btn" title="Filter column" aria-label="Filter column" aria-haspopup="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </button>
      </div>
      <button class="tb-btn tb-collapsed" data-for="tbg-data" title="Data" aria-haspopup="true" hidden><span>Data</span><svg class="tbc-caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4 4-4"/></svg></button>
      <div class="tb-flyout popmenu" data-flyout="tbg-data" hidden></div>
      <span class="tb-sep"></span>
      <div class="tb-group" id="tbg-tools" data-collapse="1">
        <button id="tb-dv" class="tb-btn" title="Data validation" aria-label="Data validation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg>
        </button>
        <button id="tb-cf" class="tb-btn" title="Conditional formatting" aria-label="Conditional formatting">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M12 2.5 6 9a8 8 0 1 0 12 0z"/><line x1="4.5" y1="15.5" x2="19.5" y2="15.5"/></svg>
        </button>
        <button id="tb-note" class="tb-btn" title="Insert / edit note" aria-label="Insert or edit note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
      <button class="tb-btn tb-collapsed" data-for="tbg-tools" title="Tools" aria-haspopup="true" hidden><span>Tools</span><svg class="tbc-caret" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4 4-4"/></svg></button>
      <div class="tb-flyout popmenu" data-flyout="tbg-tools" hidden></div>
    </div>

    <div class="formula-bar">
      <input class="cell-ref" id="cell-ref" spellcheck="false" title="Name box — type a cell (B12) or range (A1:C5) and press Enter" aria-label="Name box" value="A1" />
      <span class="fx" aria-hidden="true">fx</span>
      <input id="formula-input" type="text" spellcheck="false" placeholder="value or =formula" />
    </div>

    <div class="work-area">
    <div class="grid-wrap" id="grid-wrap">
      <div class="find-bar" id="find-bar" hidden>
        <input id="find-input" class="find-field" placeholder="Find" spellcheck="false" />
        <span class="find-count" id="find-count"></span>
        <button id="find-prev" class="find-btn" title="Previous (Shift+Enter)" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="find-next" class="find-btn" title="Next (Enter)" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <input id="replace-input" class="find-field" placeholder="Replace with" spellcheck="false" />
        <button id="replace-one" class="find-action">Replace</button>
        <button id="replace-all" class="find-action">Replace all</button>
        <label class="find-case"><input type="checkbox" id="find-case" /> Aa</label>
        <button id="find-close" class="find-btn" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <canvas id="grid" tabindex="0"></canvas>
      <input id="inline-edit" class="inline-edit" spellcheck="false" />
      <div id="ac-menu" class="ac-menu" hidden></div>
      <div id="comment-tip" class="comment-tip" hidden></div>
      <span class="sel-stats" id="sel-stats"></span>
      <div class="scrollbar vscroll" id="vscroll"><div class="thumb" id="vthumb"></div></div>
      <div class="scrollbar hscroll" id="hscroll"><div class="thumb" id="hthumb"></div></div>
    </div>

    <aside class="side-panel" id="side-panel" hidden aria-label="Tool panel">
      <div class="side-panel-head">
        <span class="side-panel-title" id="side-panel-title">Panel</span>
        <button class="side-panel-close" id="side-panel-close" title="Close (Esc)" aria-label="Close panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="side-panel-body" id="side-panel-body"></div>
    </aside>
    </div>

    <div class="bottom-bar">
      <div class="sheet-tabs" id="sheet-tabs" role="tablist" aria-label="Sheets"></div>
      <span class="bottom-status"><span class="dot"></span>Local only · nothing uploaded</span>
    </div>

    <script type="module" src="./editor.js?v=26"></script>
