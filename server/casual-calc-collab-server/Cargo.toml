[package]
name = "casual-calc-collab-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "The OpenCalc collaboration server: a session, not a filing system."

[dependencies]
casual-calc-eval = { path = "../../crates/casual-calc-eval" }
casual-calc-export = { path = "../../crates/casual-calc-export" }
casual-calc-import = { path = "../../crates/casual-calc-import" }
casual-calc-model = { path = "../../crates/casual-calc-model" }
casual-calc-transaction = { path = "../../crates/casual-calc-transaction" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# Multiplexed connection rather than a pool: every command here is small and
# the coordination path is latency-sensitive, so one connection pipelining
# concurrent callers beats a pool taking a round trip to hand one out.
#
# `connection-manager` is that same multiplexed connection with a re-dial behind
# it. Without it a coordinator that restarts leaves every node holding a socket
# to something that is gone, and no command on it ever succeeds again (DEP-13).
#
# `tokio-rustls-comp` is what makes `rediss://` a URL this build can dial, and
# rustls rather than native-tls to keep one TLS implementation in the process —
# the feature pulls `rustls/ring`, which is what the listener already uses.
redis = { version = "0.27", default-features = false, features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
    "script",
] }
# For the pub/sub message stream. Already a dev-dependency; the relay needs it
# at runtime too.
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }

[dev-dependencies]
# `copy_bidirectional`, for the forwarder the coordinator-link tests put in
# front of Redis so they can sever the connection without stopping the server.
tokio = { version = "1", features = ["io-util"] }
rcgen = "0.13"
tokio-tungstenite = "0.24"
serde_json = "1"
casual-calc-export = { path = "../../crates/casual-calc-export" }
futures-util = "0.3"
casual-calc-formula = { path = "../../crates/casual-calc-formula" }

[lints]
workspace = true

[[bin]]
name = "casual-calc-collab-server"
path = "src/main.rs"

[lib]
name = "casual_calc_collab_server"
path = "src/lib.rs"
