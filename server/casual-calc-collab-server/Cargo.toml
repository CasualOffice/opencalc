[package]
name = "casual-calc-collab-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "The OpenCalc collaboration server: a session, not a filing system."

[dependencies]
casual-calc-eval = { path = "../../crates/casual-calc-eval" }
casual-calc-export = { path = "../../crates/casual-calc-export" }
casual-calc-import = { path = "../../crates/casual-calc-import" }
casual-calc-model = { path = "../../crates/casual-calc-model" }
casual-calc-transaction = { path = "../../crates/casual-calc-transaction" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# Multiplexed connection rather than a pool: every command here is small and
# the coordination path is latency-sensitive, so one connection pipelining
# concurrent callers beats a pool taking a round trip to hand one out.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "script"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }

[dev-dependencies]
rcgen = "0.13"
tokio-tungstenite = "0.24"
serde_json = "1"
casual-calc-export = { path = "../../crates/casual-calc-export" }
futures-util = "0.3"
casual-calc-formula = { path = "../../crates/casual-calc-formula" }

[lints]
workspace = true

[[bin]]
name = "casual-calc-collab-server"
path = "src/main.rs"

[lib]
name = "casual_calc_collab_server"
path = "src/lib.rs"
