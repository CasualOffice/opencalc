<!-- One document, open, with the Share and Download a demo needs to make the
     point. Everything below the toolbar is the editor exactly as shipped; this
     page only fetches a token and hands it to `collaborate()`. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCalc</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: .6rem; padding: .5rem .8rem;
           border-bottom: 1px solid #8883; flex: none; }
  header .title { font-weight: 600; margin-right: auto; }
  button { font: inherit; padding: .4rem .8rem; border-radius: .35rem;
           border: 1px solid #8884; background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: #4472c4; color: #fff; border-color: transparent; }
  #status { opacity: .7; font-size: .85rem; }
  #who { display: flex; gap: .3rem; }
  #me input { font: inherit; padding: .25rem .4rem; border: 1px solid #8884;
              border-radius: .3rem; background: transparent; color: inherit; width: 8.5rem; }
  .dot { width: .95rem; height: .95rem; border-radius: 50%; font-size: .6rem; color: #fff;
         display: grid; place-items: center; }
  #frame { flex: 1; border: 0; width: 100%; }
  dialog { border: 1px solid #8884; border-radius: .5rem; padding: 1.1rem; max-width: 30rem; }
  dialog input { width: 100%; font: inherit; padding: .45rem; margin: .6rem 0;
                 border: 1px solid #8886; border-radius: .3rem; background: transparent; color: inherit; }
</style>

<header>
  <span class="title" id="title">…</span>
  <span id="status">connecting…</span>
  <!-- Who you are, editable, because the alternative is inventing it. A demo
       that calls everybody "Guest 47" makes presence useless exactly when two
       people are in a document together and need to tell each other apart. -->
  <label id="me" title="The name other participants see">
    <input id="myname" size="12" placeholder="Your name" autocomplete="name">
  </label>
  <span id="who"></span>
  <button id="share" class="primary">Share</button>
  <button id="download">Download</button>
  <button id="history">History</button>
</header>
<iframe id="frame" title="Spreadsheet"></iframe>

<dialog id="historybox">
  <strong>Previous versions</strong>
  <!-- Built with textContent by the script below, never markup: a title comes
       from a filename somebody chose (SEC-001). -->
  <div id="versions">Loading…</div>
  <p class="note" id="history-note"></p>
  <button id="history-close">Close</button>
</dialog>

<dialog id="sharebox">
  <strong>Anyone with this link can edit</strong>
  <input id="link" readonly>
  <div style="display:flex;gap:.5rem;justify-content:flex-end">
    <button id="copy" class="primary">Copy</button>
    <button id="close">Close</button>
  </div>
</dialog>

<script type="module">
  const id = location.pathname.split("/").pop();
  const status = document.getElementById("status");

  // A name per tab, so two windows of the same browser are two participants
  // with two cursors rather than one that teleports. A name the person actually
  // chose is remembered across documents; the invented one never is, so it stays
  // a placeholder rather than hardening into an identity.
  const chosen = localStorage.getItem("oc-name");
  const name =
    chosen ||
    sessionStorage.getItem("oc-name") ||
    (sessionStorage.setItem("oc-name", "Guest " + Math.floor(Math.random() * 90 + 10)),
     sessionStorage.getItem("oc-name"));

  const nameBox = document.getElementById("myname");
  nameBox.value = chosen ?? "";
  nameBox.placeholder = name;
  // Applied on the next join rather than mid-session: the name is in the signed
  // token, so changing it means a new token, and silently reconnecting somebody
  // mid-edit to rename them is a worse trade than telling them.
  nameBox.addEventListener("change", () => {
    const next = nameBox.value.trim();
    if (next) localStorage.setItem("oc-name", next);
    else localStorage.removeItem("oc-name");
    status.textContent = "name applies when you reload";
  });

  // Guarded, because everything below assumes a document. An unguarded `.json()`
  // on a failed response throws at module top level, and the page then sits at
  // "connecting…" forever with the real reason only in devtools.
  let session;
  try {
    const response = await fetch(`/api/documents/${id}/session?name=${encodeURIComponent(name)}`);
    if (!response.ok) {
      status.textContent =
        response.status === 404
          ? "this document does not exist"
          : `could not open this document (${response.status})`;
      throw new Error(`session ${response.status}`);
    }
    session = await response.json();
  } catch (why) {
    if (status.textContent === "connecting…") status.textContent = "could not reach the server";
    document.getElementById("title").textContent = "Unavailable";
    for (const id of ["share", "download"]) document.getElementById(id).disabled = true;
    throw why;
  }
  document.getElementById("title").textContent = session.title;

  // The editor is loaded in an iframe so this page can keep its own chrome
  // without forking the editor's HTML — the same way a host embeds it.
  const frame = document.getElementById("frame");
  // `?fonts` opts this deployment into the font service below. The editor
  // never probes for one — a host that does not run one would get a 404 in
  // its console on every boot — so saying so is the host's job, and this host
  // does run one.
  // `?hide=header` because this page renders its own — the title, the
  // participant name, Share/Download/History. Without it the editor's header
  // stacks under ours and a user sees two, which is what running the Docker
  // stack looks like today. `<opencalc-sheet>` hides the header by default for
  // the same reason; an iframe had no way to ask until now.
  // `mode=embedded` is what this frame now resolves to by default
  // (`UX-EMBED-02`), and it is the right answer — this host owns the
  // document. Named rather than inherited: a shipped product should not
  // change behaviour because a default moved underneath it.
  frame.src = "/editor/editor.html?mode=embedded&fonts=/api/fonts&hide=header";
  frame.addEventListener("load", async () => {
    const win = frame.contentWindow;
    // Wait for the engine, which the editor signals by writing its version into
    // the status line — the same readiness signal the browser tests use.
    for (let i = 0; i < 300; i++) {
      const el = win.document.getElementById("tb-status");
      if (el && /^engine v\d/.test(el.textContent || "")) break;
      await new Promise((r) => setTimeout(r, 100));
    }
    // The editor publishes its own module for exactly this: a parent frame
    // cannot import into the iframe's realm, and could not name the
    // cache-busted specifier if it could.
    for (let i = 0; i < 100 && !win.opencalcEditor; i++) {
      await new Promise((r) => setTimeout(r, 50));
    }
    const editor = win.opencalcEditor;
    if (!editor) { status.textContent = "editor did not load"; return; }

    await editor.collaborate({
      url: session.collab,
      token: session.token,
      document: session.document,
      onStatus: (s) => {
        status.textContent =
          { live: "connected", opening: "opening…", reconnecting: "reconnecting…" }[s.state] ??
          `${s.state}${s.detail ? ": " + s.detail : ""}`;
      },
      onPresence: () => {
        const seen = new Map();
        for (const p of editor.collaborators()) seen.set(p.client, p);
        // oc-safe-html: clears the element; no markup is parsed.
        document.getElementById("who").innerHTML = "";
        for (const p of seen.values()) {
          const d = document.createElement("span");
          d.className = "dot";
          d.style.background = p.color || "#4472c4";
          d.title = p.name || "Someone";
          d.textContent = (p.name || "?").slice(0, 1);
          document.getElementById("who").appendChild(d);
        }
      },
    });
  });

  const box = document.getElementById("sharebox");
  document.getElementById("share").addEventListener("click", () => {
    document.getElementById("link").value = location.href;
    box.showModal();
  });
  document.getElementById("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(location.href); } catch {}
    document.getElementById("copy").textContent = "Copied";
  });
  document.getElementById("close").addEventListener("click", () => box.close());
  document.getElementById("download").addEventListener("click", () => {
    // Downloads what the collaboration server has saved back, which is why the
    // callback matters: without it this is the file as it was uploaded.
    location.href = `/api/documents/${id}/download`;
  });

  // --- Version history (COL-41) --------------------------------------------
  //
  // The host keeps the previous contents before every save, so this list is
  // "what it was", newest first. Restore is offered next to each because a
  // person who wants an old version almost always wants it *back*, not merely
  // to look at — but Open is there too, so looking is possible without
  // replacing anything.
  const historyBox = document.getElementById("historybox");
  const versionsEl = document.getElementById("versions");
  const historyNote = document.getElementById("history-note");

  function when(ms) {
    // The absolute time, not "3 hours ago": choosing between saves means
    // recognising one, and a person recognises a clock time.
    return new Date(Number(ms)).toLocaleString();
  }

  async function showHistory() {
    versionsEl.textContent = "Loading…";
    historyNote.textContent = "";
    historyBox.showModal();
    let list = [];
    try {
      const response = await fetch(`/api/documents/${id}/versions`);
      if (!response.ok) throw new Error(String(response.status));
      ({ versions: list } = await response.json());
    } catch (why) {
      versionsEl.textContent = `Could not load the history: ${why.message}`;
      return;
    }
    versionsEl.textContent = "";
    if (!list.length) {
      // Said plainly rather than shown as an empty box, because "no versions"
      // and "the list failed to load" look identical when both are blank.
      versionsEl.textContent = "No previous versions yet — one is kept each time the document is saved.";
      return;
    }
    for (const v of list) {
      const row = document.createElement("div");
      row.className = "version";
      const label = document.createElement("span");
      label.textContent = `${when(v.at)} · ${Math.round(v.bytes / 1024)} KB`;
      const open = document.createElement("button");
      open.textContent = "Open";
      open.addEventListener("click", () => {
        location.href = `/api/documents/${id}/versions/${v.at}`;
      });
      const restore = document.createElement("button");
      restore.textContent = "Restore";
      restore.addEventListener("click", async () => {
        restore.disabled = true;
        historyNote.textContent = "Restoring…";
        try {
          const response = await fetch(
            `/api/documents/${id}/versions/${v.at}/restore`,
            { method: "POST" },
          );
          if (!response.ok) throw new Error(await response.text());
          // **Said out loud**, because the restore lands on the stored file and
          // anyone with the document already open is still looking at what was
          // there before — including this page's own iframe.
          historyNote.textContent =
            "Restored. Reload this page, and ask anyone else with it open to reload too.";
        } catch (why) {
          historyNote.textContent = `Could not restore: ${why.message}`;
          restore.disabled = false;
        }
      });
      row.append(label, open, restore);
      versionsEl.append(row);
    }
  }

  document.getElementById("history").addEventListener("click", showHistory);
  document.getElementById("history-close").addEventListener("click", () => historyBox.close());
</script>
