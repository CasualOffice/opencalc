[package]
name = "casual-calc-mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "An MCP server (stdio) that lets an AI agent open, read, edit, recalculate and save a workbook (docs/97, AGENT-01)."

# Deliberately small (docs/97, AGENT-01). The protocol is JSON-RPC 2.0 over
# stdin/stdout, hand-rolled on `serde_json`, so there is no MCP framework, no
# async runtime and **no network stack** in this binary: the "no network"
# bound is kept by there being nothing here that could open a socket.
# `casual-calc-model` is named only for the id a new sheet needs; everything
# else goes through the SDK, so an agent and a person get the same answers.
[dependencies]
casual-calc-model = { path = "../../crates/casual-calc-model" }
casual-calc-sdk = { path = "../../crates/casual-calc-sdk" }
serde_json = "1"

[lints]
workspace = true
