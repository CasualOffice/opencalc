# OpenCalc, standalone. The demo somebody runs before deciding to integrate.
#
#   cp .env.example .env      # and change the secret
#   docker compose up --build
#   open http://localhost:8080
#
# Two containers, because they are two things: the **host** is what a product
# supplies (documents, identity, tokens, saving) and the **collaboration server**
# is what OpenCalc supplies. Keeping them apart in the demo is the point — it is
# the same boundary a real integration has, so what you try is what you would
# build against.

name: opencalc

services:
  host:
    build:
      context: .
      dockerfile: server/casual-calc-host/Dockerfile
    environment:
      OPENCALC_HOST_BIND: 0.0.0.0:8080
      OPENCALC_STORE: /data
      OPENCALC_SHARED_SECRET: ${OPENCALC_SHARED_SECRET:?set it in .env — see .env.example}
      OPENCALC_AUDIENCE: ${OPENCALC_AUDIENCE:-opencalc-demo}
      # Left empty on purpose: the host derives the socket address from the
      # request the browser just made, so a share link works wherever it is
      # opened. Set this only when collaboration lives on its own hostname —
      # the old default was the *browser's* loopback and worked for exactly one
      # machine (PROD-12).
      OPENCALC_COLLAB_WS: ${OPENCALC_COLLAB_WS:-}
      # What the *collaboration server* calls this host. A service name, not
      # localhost — localhost inside that container is that container.
      OPENCALC_HOST_INTERNAL: http://host:8080
      # Unset by default, which switches the admin page off entirely. A demo
      # shipping with a known password is a demo somebody exposes once.
      OPENCALC_ADMIN_TOKEN: ${OPENCALC_ADMIN_TOKEN:-}
      # The largest workbook the host will accept. Set explicitly because the
      # framework default is 2 MB, which is under the size of an ordinary
      # spreadsheet and rejected real files.
      OPENCALC_MAX_UPLOAD_BYTES: ${OPENCALC_MAX_UPLOAD_BYTES:-67108864}
      # Latin renders with no configuration. For any other script, drop a
      # .ttf/.otf/.ttc into ./fonts and it is registered at boot — see
      # docs/65-RUNNING-IT.md. An absent directory is fine and is the default.
      OPENCALC_FONT_DIR: /fonts
    volumes:
      - documents:/data
      # `:ro` because the renderer only ever reads these, and read-only is the
      # honest declaration of that.
      - ./fonts:/fonts:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/casual-calc-host", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  collab:
    build:
      context: .
      dockerfile: server/casual-calc-collab-server/Dockerfile
    environment:
      OPENCALC_BIND: 0.0.0.0:8443
      OPENCALC_SHARED_SECRET: ${OPENCALC_SHARED_SECRET:?set it in .env — see .env.example}
      OPENCALC_AUDIENCE: ${OPENCALC_AUDIENCE:-opencalc-demo}
      # The demo talks plain HTTP on a private network. Both of these are the
      # "local development only" cases the server documents, and neither is on
      # by default — they are opted into here, visibly.
      OPENCALC_ALLOW_PLAIN_CALLBACKS: "1"
      OPENCALC_ALLOWED_HOSTS: ${OPENCALC_ALLOWED_HOSTS:-host,127.0.0.1,localhost}
      OPENCALC_MAX_DOCUMENTS: ${OPENCALC_MAX_DOCUMENTS:-1000}
      OPENCALC_MAX_PARTICIPANTS: ${OPENCALC_MAX_PARTICIPANTS:-200}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "8443"
    depends_on:
      host:
        condition: service_healthy
    # Longer than OPENCALC_DRAIN_DEADLINE_MS (25s), so the final saves the
    # drain performs are allowed to finish. Docker's default is 10s, which
    # SIGKILLed a node mid-drain — losing exactly the work the drain exists
    # to save (DEP-05).
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/usr/local/bin/casual-calc-collab-server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # One origin for the editor, the API and the WebSocket. Without it the page
  # and the socket are on different ports, which is why the browser had to be
  # told an address rather than being able to use the one it already had.
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${OPENCALC_HOST_PORT:-8080}:80"
    depends_on:
      host:
        condition: service_healthy
      collab:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  documents:
