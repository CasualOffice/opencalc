# Temporary harness for `REL-09`: proves, on a real runner with no libfuse2,
# that the shipped AppImage cannot mount and that a static runtime fixes it.
# Deleted before merge — the permanent check lives in `release-desktop.yml`.
name: appimage-fuse-proof
on:
  push:
    branches: [fix/rel-09-appimage-without-libfuse2]

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: This runner is what a user's stock machine looks like
        run: |
          set -euo pipefail
          . /etc/os-release && echo "runner: $PRETTY_NAME"
          echo "fusermount  : $(command -v fusermount || echo 'ABSENT')"
          echo "fusermount3 : $(command -v fusermount3 || echo 'ABSENT')"
          dpkg -l | grep -E 'libfuse2|^ii  fuse ' || echo "libfuse2: NOT INSTALLED"

      - name: Fetch the AppImage that v0.0.1 actually published
        run: |
          set -euo pipefail
          curl -fsSL -o App.AppImage \
            https://github.com/CasualOffice/opencalc/releases/download/desktop-v0.0.1/OpenCalc_0.0.1_amd64.AppImage
          chmod +x App.AppImage
          ls -la App.AppImage

      # The runner ships /usr/bin/fusermount (FUSE 2), which a stock Ubuntu
      # 22.04 or 24.04 desktop does NOT — those have fusermount3 only. That
      # difference is exactly why this shipped: CI is not a user's machine.
      # Hiding the FUSE 2 binary while leaving fusermount3 in place models a
      # stock desktop precisely.
      # The FUSE hypothesis was tested and REFUTED: with /usr/bin/fusermount
      # moved away and only fusermount3 left — a stock 22.04 desktop — the
      # published AppImage mounted and blocked (exit 124). It does not need
      # FUSE 2. So the question is what else differs on 22.04, and the
      # candidate is glibc: this is built on ubuntu-latest, which is 24.04
      # (glibc 2.39), and 22.04 has 2.35. An AppImage bundles its libraries
      # but NOT libc, so it must be built on the oldest distro it claims.
      - name: What glibc does the shipped AppImage actually demand?
        run: |
          set -euo pipefail
          ./App.AppImage --appimage-extract >/dev/null
          bin="squashfs-root/usr/bin/opencalc"
          [ -f "$bin" ] || bin="$(find squashfs-root -type f -perm -u+x \
            -exec sh -c 'file -b "$1" | grep -q ELF' _ {} \; -print | head -1)"
          echo "binary: $bin"
          echo "--- highest GLIBC_ version the executable requires ---"
          objdump -T "$bin" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -5
          echo "--- and across every bundled .so ---"
          find squashfs-root -name '*.so*' -type f -print0 \
            | xargs -0 -r objdump -T 2>/dev/null \
            | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -5
          echo "--- Ubuntu 22.04 LTS ships glibc 2.35 ---"
          top="$( { objdump -T "$bin" 2>/dev/null; find squashfs-root -name '*.so*' -type f -print0 | xargs -0 -r objdump -T 2>/dev/null; } | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          echo "highest required: glibc $top"
          if [ "$(printf '%s\n2.35\n' "$top" | sort -V | tail -1)" != "2.35" ]; then
            echo "REPRODUCED: needs glibc $top, but Ubuntu 22.04 has 2.35 — it cannot start there"
          else
            echo "NOT REPRODUCED: glibc $top runs on 22.04; the cause is something else"
          fi
