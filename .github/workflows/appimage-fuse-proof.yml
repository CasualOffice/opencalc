# Temporary harness for `REL-09`. Deleted before merge.
#
# Established already, on runs of this file:
#   * FUSE was REFUTED — with /usr/bin/fusermount moved away and only
#     fusermount3 left (a stock 22.04), the shipped AppImage mounted fine.
#   * glibc REPRODUCED — the shipped AppImage requires glibc 2.39 across its
#     176 ELF files; Ubuntu 22.04 ships 2.35, so it cannot start there.
#
# This run tests the fix: build the same Linux leg on ubuntu-22.04 instead of
# ubuntu-latest, and assert nothing in the bundle demands more than 2.35.
name: appimage-fuse-proof
on:
  push:
    branches: [fix/rel-09-appimage-without-libfuse2]

jobs:
  build-on-2204:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: . /etc/os-release && echo "building on $PRETTY_NAME (glibc $(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$'))"
      - uses: ./.github/actions/cargo-warmup
      - uses: ./.github/actions/cargo-warmup
        with:
          manifest-path: desktop/Cargo.toml
      - name: Install the Linux webview and bundler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev file
      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: Build the engine the webview loads
        run: python3 tools/build-wasm.py
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Bundle
        run: cargo tauri build --bundles deb,appimage
      - name: THE TEST — nothing in the bundle may need more than glibc 2.35
        run: |
          set +e
          img="$(find desktop/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          echo "built: $img"
          chmod +x "$img"
          "$img" --appimage-extract >/dev/null
          find squashfs-root -type f \( -perm -u+x -o -name '*.so*' \) -print0 > files.z
          xargs -0 -r -a files.z objdump -T 2>/dev/null > syms.txt
          grep -oE 'GLIBC_[0-9.]+' syms.txt | sed 's/GLIBC_//' | sort -uV > vers.txt
          echo "--- glibc versions required, highest last ---"; tail -8 vers.txt
          top="$(tail -1 vers.txt)"
          echo "highest required: glibc $top"
          if [ "$(printf '%s\n2.35\n' "$top" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::still needs glibc $top — Ubuntu 22.04 has 2.35"
            exit 1
          fi
          echo "FIXED: highest requirement is glibc $top, which 22.04 satisfies"
