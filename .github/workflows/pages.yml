name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build the marketing site + the WebAssembly demo and deploy to GitHub Pages.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: Build the engine to WebAssembly
        run: wasm-pack build crates/casual-calc-wasm --release --target web --out-dir pkg
      - name: Assemble the site
        run: |
          mkdir -p site/pkg
          cp webapp/index.html webapp/app.js webapp/style.css site/
          cp crates/casual-calc-wasm/pkg/casual_calc_wasm.js site/pkg/
          cp crates/casual-calc-wasm/pkg/casual_calc_wasm_bg.wasm site/pkg/
          cp fixtures/generated/minimal.xlsx site/sample.xlsx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
