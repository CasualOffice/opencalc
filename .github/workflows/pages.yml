name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build the marketing site + the WebAssembly demo and deploy to GitHub Pages.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install wasm toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: Build the engine to WebAssembly
        run: wasm-pack build crates/casual-calc-wasm --release --target web --out-dir pkg
      # Copy by listing the directory, not by naming files. The hand-written
      # list this replaced had drifted: docs.html, embed.html, embed.js and the
      # whole fonts/ directory were missing, so the SDK guide 404'd on the
      # deployed site and every cell fell back to a system font — neither of
      # which shows up locally, where the same files are served straight off
      # disk.
      - name: Assemble the site
        run: |
          mkdir -p site/pkg
          cp webapp/*.html webapp/*.js webapp/*.css site/
          # The icon sprite the ribbon fetches at runtime (UX-SHELL-16). It is
          # not imported by any module, so nothing else would bring it along.
          cp webapp/*.svg site/
          cp -r webapp/fonts site/fonts
          cp crates/casual-calc-wasm/pkg/casual_calc_wasm.js site/pkg/
          cp crates/casual-calc-wasm/pkg/casual_calc_wasm_bg.wasm site/pkg/
          cp fixtures/generated/minimal.xlsx site/sample.xlsx
          # Pages serves files as they are, so the dev server's per-tree `?v=`
          # stamps must be applied here, or a deploy keeps the old URLs and
          # browsers keep the old files (and cached 404s) for hours.
          python3 tools/stamp-site.py site

      # The pages that must exist, asserted rather than assumed — a silent
      # 404 on the deployed site is exactly the failure this job just had.
      - name: Check the site is complete
        run: |
          set -euo pipefail
          for f in index.html editor.html docs.html embed.html download.html \
                   editor.js embed.js collab.js style.css site.js editor.css \
                   ribbon.js ribbon.css ribbon.tokens.css ribbon.model.js commands.js icons.fluent.svg \
                   pkg/casual_calc_wasm_bg.wasm fonts/Carlito-Regular.ttf fonts/inter-latin-400-700.woff2 \
                   fonts/cjk/manifest.json fonts/cjk/jp-sans-400/000.woff2 fonts/cjk/OFL-Noto-Sans-CJK.txt; do
            [ -s "site/$f" ] || { echo "::error::site/$f is missing or empty"; exit 1; }
          done
          echo "site: $(find site -type f | wc -l) files"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
