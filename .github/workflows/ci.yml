name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Job names are the CI contract; see docs/15-CI-AND-RELEASE-GATES.md.
# Every job named in that document's table exists here.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The cluster's rules are written once and run against both coordinators —
    # the in-memory one and Redis. Without a server here the Redis half skips,
    # and a suite that always skips half of itself is a suite that reports on
    # half of itself while looking green.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --workspace --all-features --locked
        env:
          OPENCALC_TEST_REDIS: redis://127.0.0.1:6379

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo doc --workspace --all-features --no-deps

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add wasm32-unknown-unknown
      # The **engine** must stay WASM-clean, which is `crates/`. Anything under
      # `server/` is a host (ADR-012) and was never meant to run in a browser:
      # each has an async runtime and an HTTP stack, and checking one here would
      # be asserting something nobody wants to be true.
      #
      # The exclusions are **derived from the workspace, not listed**. They were
      # listed, and adding a third host crate broke this job on `main` — the
      # list is a copy of a fact the manifest already states, and a copy of a
      # fact is a thing that goes stale. `server/` is the boundary the
      # `dependency-policy` job already enforces, so it is the boundary to read.
      - name: The engine still builds for the browser
        run: |
          mapfile -t EXCLUDES < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | contains("/server/")) | "--exclude", .name')
          echo "not checked for wasm: ${EXCLUDES[*]}"
          cargo check --target wasm32-unknown-unknown --workspace "${EXCLUDES[@]}"

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # **`--release`, and the report has to say so.**
      #
      # The frame budget is an absolute duration, and a debug build is a
      # different program: the same frame measures 0.13 ms in release and 5.7 ms
      # in debug on one machine. This job ran debug, so a gate on "sixty frames
      # a second" was being applied to a binary nobody ships — which is most of
      # why its ceiling had drifted to four whole frames before anyone noticed
      # it was gating fifteen.
      - name: Run benchmark smoke and validate report shape
        run: |
          cargo run -q --release -p casual-calc-benchmark -- --smoke --env ci > report.json
          jq -e '.schemaVersion == 1
                 and .profile == "release"
                 and (.cases | length) >= 1
                 and (all(.cases[]; has("id") and has("medianNs") and .deterministic == true))' \
             report.json \
            || { echo "::error::the benchmark report is malformed, or was not a release build"; exit 1; }
      # The part that is a gate rather than a shape check. It asserts how the
      # work *scales*, not how long it took: a shared runner varies by several
      # times between runs, so an absolute threshold either catches nothing or
      # fails on a noisy neighbour — and a gate that cries wolf gets turned off.
      # A ratio divides the hardware out, and what actually goes wrong is
      # somebody making a linear pass quadratic.
      - name: Assert the engine still scales linearly
        run: |
          jq -e '(.scaling | length) >= 1 and all(.scaling[]; .withinBudget)' report.json \
            || { jq '.scaling' report.json; echo "::error::a case grew faster than its budget allows"; exit 1; }

  # The SDK's published surface, compiled the way an integrator compiles it.
  #
  # `@opencalc/sheet` and `@opencalc/react` shipped no declarations at all
  # (SDK-009), so every TypeScript host embedding this got `any` — or, more
  # often, an error and a decision to use something else. The declarations are
  # hand-written beside hand-written JavaScript, which means nothing forces them
  # to describe the code except somebody compiling against them. This job is
  # that somebody.
  sdk-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # `ci`, not `install`: the lockfile is committed, and `install` is free to
      # resolve something else — which makes the gate's result depend on the day
      # it ran. The same reasoning as `--locked` on every cargo command here.
      - name: Install the type checker
        working-directory: sdk/types
        run: npm ci --no-audit --no-fund
      # Two checks, because they answer different questions. `tsc` proves the
      # surface *composes* under `strict`; it cannot prove the surface is real,
      # and a `.d.ts` naming a method nobody implemented type-checks perfectly.
      - name: The published surface type-checks, and exists
        working-directory: sdk/types
        run: npm test

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify fixture checksums against manifest
        run: |
          jq -r '.fixtures[] | "\(.sha256)  fixtures/\(.path)"' fixtures/manifest.json \
            | shasum -a 256 -c -
      - name: Reject merge-conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- ':!*.yml' ; then
            echo "merge-conflict markers found" >&2
            exit 1
          fi
      # A floating `@v4` resolves to whatever that tag points at today, so a
      # compromised or retagged action runs with this workflow's permissions
      # and nothing in the repository changed. docs/15 has claimed SHA pinning
      # for some time; until now every `uses:` was a floating major tag.
      - name: Actions must be pinned to a commit SHA
        run: |
          if grep -rnE '^\s*(- )?uses: [^ ]+@(v[0-9]|main|master)' .github/workflows/ ; then
            echo "::error::pin the action above to a full commit SHA (keep the tag as a comment)" >&2
            exit 1
          fi
      # The same rule as the action pinning above, for the larger input. A tag is
      # a moving reference: `debian:bookworm-slim` is retagged whenever Debian
      # rebuilds it, so the same Dockerfile produces a different image with
      # nothing in this repository having changed — and a base image is every
      # byte under the binary, which is more of the shipped artefact than any
      # action touches.
      - name: Container base images must be pinned by digest
        run: |
          unpinned=$(grep -hn '^FROM ' server/*/Dockerfile | grep -v '@sha256:' || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned"
            echo "::error::pin the base image above by digest (keep the tag before the @)" >&2
            exit 1
          fi
          echo "every container base image is pinned by digest"
      # An id is only useful if it names one thing. Two trackers ran independent
      # FID-01..FID-25 series for different work, and rows were appended without
      # checking the ids already in the file — so `git log --grep FID-13`
      # returned two unrelated changes. Review cannot catch this: the diff shows
      # the row being added, not the row three hundred lines up that already has
      # that id.
      - name: Tracker ids must be unique
        run: python3 tools/check-tracker-ids.py
      # Cargo defaults `overflow-checks` off in release, so arithmetic that
      # panics in a debug test wraps silently in the shipped binary — the tests
      # then prove a property the artefact does not have. This engine's
      # arithmetic runs on indices and lengths taken from untrusted files, so
      # the setting is deliberate and must stay deliberate.
      - name: Release builds must keep overflow checks
        run: |
          if ! grep -qE '^overflow-checks *= *true' Cargo.toml ; then
            echo "::error::[profile.release] must set overflow-checks = true" >&2
            exit 1
          fi
      # ADR-012: a host is not an engine layer. A host may depend on the
      # crates; nothing under `crates/` may depend on a host, or an async
      # runtime and an HTTP stack arrive in a library that has neither. A
      # documented boundary that nothing checks is a boundary that erodes.
      #
      # **Every host, derived**, not the one this check was written for. It
      # named `casual-calc-collab-server` alone, so a crate taking a dependency
      # on `casual-calc-host` or `casual-calc-wopi` would have been told the
      # boundary was intact — while the workspace manifest states the rule for
      # all three.
      - name: The engine must not depend on any host
        run: |
          mapfile -t HOSTS < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | contains("/server/")) | .name')
          broken=0
          for host in "${HOSTS[@]}"; do
            if grep -rn "$host" crates/ ; then
              echo "::error::a crate under crates/ depends on $host (ADR-012)" >&2
              broken=1
            fi
          done
          [ "$broken" = "0" ] || exit 1
          echo "engine/host boundary intact for: ${HOSTS[*]}"
      # A diagnostic code is a promise to whoever reads a log, and docs/20 is
      # where that promise is written down. Nothing checked the two agreed, and
      # both drifts had already happened: `OC-IMP-0003` sat in the registry for
      # a limit nothing enforced, and the first fix for it emitted a fresh
      # `OC-IMP-0004` that the registry had never heard of.
      #
      # Checked in one direction only. A code the *code* emits must be
      # registered; a code the registry lists need not be emitted yet, because
      # the registry deliberately reserves codes for work that is planned.
      - name: Every emitted error code is in the registry
        run: |
          missing=0
          for code in $(grep -rhoE '"OC-[A-Z]+-[0-9]{4}"' crates/ server/ --include='*.rs' \
                        | tr -d '"' | sort -u); do
            if ! grep -q "\`$code\`" docs/20-ERROR-CODE-REGISTRY.md ; then
              echo "::error::$code is emitted but not in docs/20-ERROR-CODE-REGISTRY.md" >&2
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "every emitted diagnostic code is registered"
      # SEC-001. A workbook is untrusted input, so any path turning its text
      # into markup runs somebody else's script in the editor's origin — where
      # the document, the session token and the collaboration socket live. The
      # Name Manager did exactly that, and opening a file was enough.
      #
      # Sinks are not banned outright: a few build fixed markup (an SVG icon,
      # a menu scaffold) and rewriting those as DOM calls buys nothing. They
      # carry an `oc-safe-html:` marker naming *why* they are safe, so a new one
      # has to be argued for rather than merely typed.
      - name: Dynamic HTML sinks must be marked as audited
        run: |
          unmarked=0
          while IFS= read -r hit; do
            file=${hit%%:*}
            rest=${hit#*:}
            line=${rest%%:*}
            # The line immediately above, and nothing wider: a three-line
            # window let an unrelated marker nearby exempt a brand-new sink,
            # which is how this check first passed against a planted one.
            prev=$(( line > 1 ? line - 1 : 1 ))
            if sed -n "${prev}p" "$file" | grep -q 'oc-safe-html:'; then
              continue
            fi
            echo "::error file=$file,line=$line::unmarked dynamic HTML sink (SEC-001). Build DOM with textContent, or add an 'oc-safe-html:' comment saying why this markup is static."
            unmarked=$((unmarked + 1))
          done < <(git grep -nE '\.(innerHTML|outerHTML)\s*=|insertAdjacentHTML|document\.write\(' \
                     -- 'webapp/*.js' 'webapp/*.html' 'server/casual-calc-host/src/*.html' \
                   | grep -v 'oc-safe-html:')
          if [ "$unmarked" -gt 0 ]; then
            echo "$unmarked unmarked sink(s)" >&2
            exit 1
          fi
          echo "every dynamic HTML sink is marked audited"

  # The only gate that runs the editor as a user does. Every other job proves
  # the engine is right; none of them would notice the WebAssembly glue failing
  # to instantiate, a canvas that never paints, or bindings and engine that
  # disagree about a signature — a stale `pkg/` once shipped 25 of 222 exports
  # with every Rust gate green. AGENTS.md requires verifying in a browser
  # before calling anything done; this is that, on every push.
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      # Built here, never taken from the tree: `webapp/pkg/` is not committed,
      # and a gate that would accept a stale build is a gate that cannot catch
      # a stale build.
      - name: Build the engine for the browser
        run: wasm-pack build crates/casual-calc-wasm --release --target web --out-dir "$PWD/webapp/pkg"
      # The collaboration suite runs two browsers against the real server
      # binary. Built as its own step so a compile failure says so, instead of
      # surfacing as Playwright giving up on a port that never opened — and so
      # the compile is not racing that job's readiness timeout.
      - name: Build the collaboration server
        run: cargo build --locked -p casual-calc-collab-server
      - name: Install the harness
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the smoke suite
        working-directory: tests/browser
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: |
            tests/browser/test-results/
          retention-days: 7

  # Every other test of the calc engine was written from the specification by
  # whoever wrote the code it tests, so a *misreading* of the spec produces a
  # test that agrees with the bug. LibreOffice does not share our misreadings.
  # Its first run found the `_xlfn.` writer bug (P2-003): five functions were
  # being written in a form Excel reads as #NAME?.
  oracle-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          soffice --version
      - name: Diff the corpus against LibreOffice Calc
        run: cargo run -q -p casual-calc-fidelity -- --json oracle-report.json
      # P1B-003: does an independent implementation accept *and understand* the
      # packages we write? A full re-save drives its reader over every part and
      # then writes back what it understood, which catches the structural
      # mistakes an "it opened" check cannot.
      - name: Validate the package LibreOffice gets
        run: cargo run -q -p casual-calc-fidelity -- --validate-package --json package-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oracle-report
          path: |
            oracle-report.json
            package-report.json
          retention-days: 14

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-07-20 --profile minimal
          cargo install cargo-fuzz --locked
      - name: Build fuzz targets and assert the lockfile is unchanged
        working-directory: fuzz
        run: |
          cargo +nightly-2026-07-20 fuzz build
          git diff --exit-code Cargo.lock
      # Built is not run. A target that compiles proves the harness exists; only
      # running it searches, and a fuzzer that never runs finds nothing — which
      # is a gate that reports on its own existence.
      #
      # Short on purpose: a minute each is not a fuzzing campaign, it is a
      # regression check that the corpus already found. The long runs belong
      # somewhere without a per-job time limit; what this catches is a change
      # that breaks an input the corpus has already reduced.
      - name: Run each fuzz target briefly
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in bounded_package formula_parse number_format wire_operation ooxml_xml transform_tp1 token_verify; do
            seeds="seeds/$target"
            echo "::group::$target"
            # Created, not assumed. `fuzz/corpus/` is gitignored, so on a fresh
            # checkout it does not exist — and libFuzzer treats a named corpus
            # directory that is missing as an error rather than as empty. It
            # only bit the targets that *have* seeds, because those were the
            # only ones naming a corpus directory at all, and it never bit a
            # working tree where earlier runs had already created one.
            mkdir -p "corpus/$target"
            cargo +nightly-2026-07-20 fuzz run "$target" \
              "corpus/$target" $([ -d "$seeds" ] && echo "$seeds" || true) \
              -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done

  # Nothing built the images, so nothing tested that the Dockerfiles still
  # compile — the one artefact an integrator actually runs was the only thing
  # with no gate at all (DEP-07). Build only: publishing is a release concern
  # and needs a registry decision, but a Dockerfile that stopped building would
  # otherwise be found by whoever tried to deploy.
  #
  # Also asserts the standalone stack comes up and answers through its proxy,
  # which is what PROD-12 was about: the page and the socket on one origin.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build every image
        run: |
          docker build -f server/casual-calc-host/Dockerfile -t opencalc-host .
          docker build -f server/casual-calc-collab-server/Dockerfile -t opencalc-collab .
          docker build -f server/casual-calc-wopi/Dockerfile -t opencalc-wopi .
      - name: The standalone stack answers on one origin
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^OPENCALC_SHARED_SECRET=.*/OPENCALC_SHARED_SECRET=ci-not-a-real-secret/' .env
          docker compose up -d --no-build
          # Wait for the proxy rather than a fixed sleep: the collab server
          # waits on the host's healthcheck, so readiness is a chain.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          [ "${ready:-0}" = "1" ] || { docker compose logs; exit 1; }
          # The socket has to be reachable on the *same* origin as the page,
          # which is the whole of PROD-12. What is checked is the **routing**,
          # not the handshake: a completed 101 leaves the connection open and
          # curl reports an empty reply, so probing with an upgrade tests curl
          # rather than nginx. A plain GET is enough — the collaboration server
          # answers it (refusing, since it is not an upgrade), and the proxy
          # failing to route answers 404 from the host or 502 from nowhere.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   'http://127.0.0.1:8080/collab?doc=ci' || echo 000)
          case "$code" in
            404|502|000)
              echo "::error::/collab answered $code through the proxy: not routed"
              docker compose logs
              exit 1
              ;;
            *) echo "collab is reachable on the page's own origin ($code)" ;;
          esac
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null && echo "host reachable"
      - name: The WOPI adapter serves a discovery document
        run: |
          set -euo pipefail
          # The one URL an administrator pastes into Nextcloud or SharePoint. If
          # it does not parse, the editor never appears in their list and there
          # is no error anywhere to explain why.
          docker compose --profile wopi up -d --no-build wopi
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1; then up=1; break; fi
            sleep 2
          done
          [ "${up:-0}" = "1" ] || { docker compose logs wopi; exit 1; }
          curl -fsS http://127.0.0.1:8090/hosting/discovery -o discovery.xml
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('discovery.xml')"
          grep -q 'name="edit" ext="xlsx"' discovery.xml \
            || { echo "::error::no edit action for xlsx"; cat discovery.xml; exit 1; }
          echo "discovery is valid XML and advertises an editor"
      - if: always()
        run: docker compose down -v || true

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-deny --locked
      - run: cargo deny check bans licenses sources
      # `advisories` was the one `cargo deny` check left out, so the RUSTSEC
      # database — the entire point of a supply-chain gate — was never
      # consulted, while docs/07 and docs/15 both stated it was. A gate a
      # document claims and CI does not run is worse than no gate: it is a
      # gate somebody is relying on.
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: "1.96.0"
          - os: windows-latest
            toolchain: "1.96.0"
          - os: ubuntu-latest
            toolchain: "1.88.0"   # MSRV check (ADR-pending)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: rustup override set ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-features --locked
