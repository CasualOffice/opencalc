name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Job names are the CI contract; see docs/15-CI-AND-RELEASE-GATES.md.
# Jobs whose harnesses do not exist yet (benchmark-smoke, fuzz-build,
# repository-policy, browser-smoke) are added in their Phase-0/1 items.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-features --locked

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - run: cargo doc --workspace --all-features --no-deps

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run benchmark smoke and validate report shape
        run: |
          cargo run -q -p casual-calc-benchmark -- --smoke --env ci > report.json
          jq -e '.schemaVersion == 1
                 and (.cases | length) >= 1
                 and (all(.cases[]; has("id") and has("medianNs") and .deterministic == true))' \
             report.json

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --locked
      - run: cargo deny check bans licenses sources

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: "1.96.0"
          - os: windows-latest
            toolchain: "1.96.0"
          - os: ubuntu-latest
            toolchain: "1.88.0"   # MSRV check (ADR-pending)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: rustup override set ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-features --locked
