name: ci

on:
  push:
    branches: [main]
  pull_request:

# A pull-request run is superseded the moment its branch moves, so cancelling it
# saves real time and throws away nothing. A push to main is the opposite: that
# run *is* the record of whether main is releasable, there is one per merge, and
# cancelling it destroys the only evidence while saving almost nothing. Nineteen
# of forty consecutive main runs were cancelled this way, which is why `ci` on
# main was a coin flip rather than a signal. Asserted by check-workflow-concurrency.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Job names are the CI contract; see docs/15-CI-AND-RELEASE-GATES.md.
# Every job named in that document's table exists here.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The cluster's rules are written once and run against both coordinators —
    # the in-memory one and Redis. Without a server here the Redis half skips,
    # and a suite that always skips half of itself is a suite that reports on
    # half of itself while looking green.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup

      # **The service container is not enough** (`CI-012`).
      #
      # It gives a Redis on 6379, which is what `OPENCALC_TEST_REDIS` points
      # at. But the coordinator tests start their *own* servers and sentinels —
      # a failover needs two primaries and three sentinels it can promote and
      # kill — and for that they need the binaries on PATH. Without them they
      # printed "skipped" and passed.
      #
      # So the behaviour `ADR-020` exists for, and that this project has now
      # decided to depend on, was asserted nowhere that gates a merge. Same
      # shape as a metric that is scraped and always zero.
      - name: Redis binaries, for the tests that run their own cluster
        run: |
          sudo apt-get update -qq
          # **Both packages.** `redis-sentinel` is not shipped by
          # `redis-server` on Debian or Ubuntu — it is its own package, which
          # depends on the server. Installing only the server gave
          # `redis-sentinel: command not found` and a job that failed at the
          # version check rather than deep inside a test, which is the one
          # good thing about checking versions here.
          sudo apt-get install -y -qq redis-server redis-sentinel
          # Both, by name: a missing binary fails on this line, where the
          # message says which, and not thirty tests later as a skip.
          redis-server --version
          redis-sentinel --version

      - name: Tests
        run: cargo test --workspace --all-features --locked 2>&1 | tee /tmp/test.log
        env:
          OPENCALC_TEST_REDIS: redis://127.0.0.1:6379

      # **A skipped test that passes is the thing this row is about.**
      #
      # Installing the binaries fixes it today. Nothing stops a runner image
      # changing, or a test growing a new precondition, and going quiet again —
      # and a green job would say nothing either time. So the skips are the
      # assertion: if the coordinator tests announce they were skipped, the job
      # fails and says which.
      - name: No coordinator test skipped itself
        run: |
          if grep -nE "skipped: (needs a .redis-server|set OPENCALC_TEST_REDIS)" /tmp/test.log; then
            echo "::error::a coordinator test skipped and passed — the behaviour above is untested here"
            exit 1
          fi
          echo "no coordinator test skipped"

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - run: cargo doc --workspace --all-features --no-deps

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - run: rustup target add wasm32-unknown-unknown
      # The **engine** must stay WASM-clean, which is `crates/`. Anything under
      # `server/` is a host (ADR-012) and was never meant to run in a browser:
      # each has an async runtime and an HTTP stack, and checking one here would
      # be asserting something nobody wants to be true.
      #
      # The exclusions are **derived from the workspace, not listed**. They were
      # listed, and adding a third host crate broke this job on `main` — the
      # list is a copy of a fact the manifest already states, and a copy of a
      # fact is a thing that goes stale. `server/` is the boundary the
      # `dependency-policy` job already enforces, so it is the boundary to read.
      - name: The engine still builds for the browser
        run: |
          # **Hosts and tools, both derived.** `server/` was excluded and
          # `tools/` was not, so the first tool with a native dependency —
          # `casual-calc-loadtest`, which drives sockets — was compiled for the
          # browser and failed on `mio`. Neither a server nor a developer tool
          # ever runs in a webview; what this gate is for is the *engine*
          # staying portable, and a build tool is not the engine.
          mapfile -t EXCLUDES < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | test("/(server|tools)/")) | "--exclude", .name')
          echo "not checked for wasm: ${EXCLUDES[*]}"
          cargo check --target wasm32-unknown-unknown --workspace "${EXCLUDES[@]}"

      # **The browser profile is also a profile that must pass its tests.**
      #
      # `ADR-018` turns text shaping off for WebAssembly, and docs/64 promises
      # such a build "reports that it lacks it rather than silently producing
      # wrong output". The test asserting that is only meaningful where the
      # feature is off — with it on, a hardcoded `true` agrees with the build
      # and the test passes while proving nothing. Which is exactly what it did
      # until this step existed (`DOC-031`).
      - name: The unshaped build says so
        run: cargo test -p casual-calc-render --no-default-features

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      # **`--release`, and the report has to say so.**
      #
      # The frame budget is an absolute duration, and a debug build is a
      # different program: the same frame measures 0.13 ms in release and 5.7 ms
      # in debug on one machine. This job ran debug, so a gate on "sixty frames
      # a second" was being applied to a binary nobody ships — which is most of
      # why its ceiling had drifted to four whole frames before anyone noticed
      # it was gating fifteen.
      - name: Run benchmark smoke and validate report shape
        run: |
          cargo run -q --release -p casual-calc-benchmark -- --smoke --env ci > report.json
          jq -e '.schemaVersion == 1
                 and .profile == "release"
                 and (.cases | length) >= 1
                 and (all(.cases[]; has("id") and has("medianNs") and .deterministic == true))' \
             report.json \
            || { echo "::error::the benchmark report is malformed, or was not a release build"; exit 1; }
      # The part that is a gate rather than a shape check. It asserts how the
      # work *scales*, not how long it took: a shared runner varies by several
      # times between runs, so an absolute threshold either catches nothing or
      # fails on a noisy neighbour — and a gate that cries wolf gets turned off.
      # A ratio divides the hardware out, and what actually goes wrong is
      # somebody making a linear pass quadratic.
      - name: Assert the engine still scales linearly
        run: |
          jq -e '(.scaling | length) >= 1 and all(.scaling[]; .withinBudget)' report.json \
            || { jq '.scaling' report.json; echo "::error::a case grew faster than its budget allows"; exit 1; }
      # **Measured here, not bounded here — yet.** `PERF-10` says an
      # uncalibrated threshold is worse than none, and it is right: this
      # project's own machines have no `/proc`, so the first honest figure can
      # only come from this runner. What is asserted is that the measurement
      # *happened* — a reading that silently stops working looks exactly like a
      # workbook that got cheaper.
      #
      # Unlike the timing gates, the per-cell figure will be directly
      # comparable: a byte is a byte on every runner, so the ceiling that
      # follows can be an absolute number rather than a ratio.
      - name: Resident memory for a million cells is measured
        run: |
          jq -e '.memory.available == true
                 and .memory.workbookBytes > 0
                 and .memory.centiBytesPerCell > 0' report.json \
            || { jq '.memory' report.json; echo "::error::the memory measurement did not run"; exit 1; }
          jq -r '"\(.memory.cells) cells cost \(.memory.workbookBytes) bytes, \(.memory.centiBytesPerCell / 100) bytes per cell"' report.json

          # **Bounded, on thirteen observations from this runner** (`PERF-10`).
          #
          # The row said an uncalibrated gate is worse than none, and it was
          # right: the threshold could only come from the runner, and no
          # machine here has /proc. Thirteen successful runs give
          #
          #     82.32 x2   82.41 x2   83.64 x4   83.72 x5
          #
          # a spread of 1.40 bytes, or 1.7%. The measurement is very nearly
          # deterministic, which is what makes an absolute ceiling honest.
          #
          # 88 gives 4.28 bytes over the highest seen -- 3.1x the observed
          # spread, so it does not flake -- while still catching one extra
          # pointer per cell (+8 bytes, 91.7), which is the smallest change
          # that would actually matter.
          #
          # The floor is the other half, and it is the one worth explaining: a
          # sudden *drop* is far more likely to mean the measurement broke than
          # that the engine got 16% smaller. A gate that only has a ceiling
          # passes forever once it starts measuring the wrong thing -- which is
          # exactly how four counters on this project reported zero while being
          # scraped.
          CEILING=88
          FLOOR=70
          jq -e --argjson c "$CEILING" --argjson f "$FLOOR" \
             '(.memory.centiBytesPerCell / 100) as $b | $b <= $c and $b >= $f' report.json >/dev/null || {
            actual=$(jq -r '.memory.centiBytesPerCell / 100' report.json)
            echo "::error::a cell costs ${actual} bytes; the band is ${FLOOR}-${CEILING}."
            echo "::error::over the ceiling is a memory regression: 13 runs on this runner"
            echo "::error::ranged 82.32-83.72, so this is outside 3x the observed spread."
            echo "::error::under the floor means the measurement is no longer measuring"
            echo "::error::the workbook -- check that before celebrating."
            exit 1
          }

  # The SDK's published surface, compiled the way an integrator compiles it.
  #
  # `@opencalc/sheet` and `@opencalc/react` shipped no declarations at all
  # (SDK-009), so every TypeScript host embedding this got `any` — or, more
  # often, an error and a decision to use something else. The declarations are
  # hand-written beside hand-written JavaScript, which means nothing forces them
  # to describe the code except somebody compiling against them. This job is
  # that somebody.
  sdk-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # `ci`, not `install`: the lockfile is committed, and `install` is free to
      # resolve something else — which makes the gate's result depend on the day
      # it ran. The same reasoning as `--locked` on every cargo command here.
      - name: Install the type checker
        working-directory: sdk/types
        run: npm ci --no-audit --no-fund
      # Two checks, because they answer different questions. `tsc` proves the
      # surface *composes* under `strict`; it cannot prove the surface is real,
      # and a `.d.ts` naming a method nobody implemented type-checks perfectly.
      - name: The published surface type-checks, and exists
        working-directory: sdk/types
        run: npm test

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - name: Verify fixture checksums against manifest
        run: |
          jq -r '.fixtures[] | "\(.sha256)  fixtures/\(.path)"' fixtures/manifest.json \
            | shasum -a 256 -c -
      - name: Reject merge-conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- ':!*.yml' ; then
            echo "merge-conflict markers found" >&2
            exit 1
          fi
      # A floating `@v4` resolves to whatever that tag points at today, so a
      # compromised or retagged action runs with this workflow's permissions
      # and nothing in the repository changed. docs/15 has claimed SHA pinning
      # for some time; until now every `uses:` was a floating major tag.
      - name: Actions must be pinned to a commit SHA
        run: |
          if grep -rnE '^\s*(- )?uses: [^ ]+@(v[0-9]|main|master)' .github/workflows/ ; then
            echo "::error::pin the action above to a full commit SHA (keep the tag as a comment)" >&2
            exit 1
          fi
      # The same rule as the action pinning above, for the larger input. A tag is
      # a moving reference: `debian:bookworm-slim` is retagged whenever Debian
      # rebuilds it, so the same Dockerfile produces a different image with
      # nothing in this repository having changed — and a base image is every
      # byte under the binary, which is more of the shipped artefact than any
      # action touches.
      - name: Container base images must be pinned by digest
        run: |
          unpinned=$(grep -hn '^FROM ' server/*/Dockerfile | grep -v '@sha256:' || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned"
            echo "::error::pin the base image above by digest (keep the tag before the @)" >&2
            exit 1
          fi
          echo "every container base image is pinned by digest"
      # An id is only useful if it names one thing. Two trackers ran independent
      # FID-01..FID-25 series for different work, and rows were appended without
      # checking the ids already in the file — so `git log --grep FID-13`
      # returned two unrelated changes. Review cannot catch this: the diff shows
      # the row being added, not the row three hundred lines up that already has
      # that id.
      - name: Tracker ids must be unique
        run: python3 tools/check-tracker-ids.py
      # The self-hosting page is dense with the exact strings an operator
      # pastes into a compose file. Prose that goes vague is survivable; a
      # wrong `OPENCALC_*` name costs somebody an afternoon before they
      # conclude the documentation is lying. Checked one way — every name on
      # the page must exist, and the code may hold names the page leaves out.
      - name: The deployment page names settings that exist
        run: python3 tools/check-deploy-docs.py
      # A duplicate nav entry is not a broken link, is not invalid HTML, and is
      # invisible to any test that renders the page successfully. It just looks
      # careless to everyone who sees it — which is what happened when the
      # self-hosting page was linked in by a script that guarded against a
      # repeated *link* and not a repeated *label*.
      - name: The site's navigation has no duplicates or dead links
        run: python3 tools/check-site-nav.py
      # `cp .env.example .env && docker compose up` is the documented quick
      # start, so whatever is in that file *is* the deployment for anybody
      # trying this for the first time. It shipped a collaboration endpoint on
      # a port the stack `expose`s but does not publish, so co-editing — the
      # one thing the demo exists to demonstrate — never connected.
      - name: The example environment points at ports the stack publishes
        run: python3 tools/check-env-example.py
      # `THEME_TOKENS` is a published list a host reads to build a theme picker.
      # A name on it that no stylesheet mentions is a promise the product does
      # not keep: the host sets it, nothing changes, and there is no error to
      # explain why. `dangerColor` was exactly that.
      - name: Every advertised theme token is honoured
        run: python3 tools/check-theme-tokens.py
      # A registry blip is not a code defect, but it reds the run just as hard --
      # and a red main that means nothing is what teaches everybody to ignore a
      # red main that means something. One `lint` job died on an SSL connect
      # error 0.3s in, having compiled nothing, and passed unchanged on re-run.
      # The warm-up absorbs that; this asserts no cargo job is added without it.
      - name: Every cargo job warms the registry with retries
        run: python3 tools/check-ci-retry.py
      # The sibling of the rule above, for the failure that looks like success.
      # Nineteen of forty consecutive main runs were `cancelled`, so "is main
      # green?" had no answer half the time -- not because anything broke, but
      # because `cancel-in-progress` treated a push to main like a superseded
      # branch. This asserts the run that is the record survives.
      - name: A workflow that gates main keeps its run on main
        run: python3 tools/check-workflow-concurrency.py
      # DOC-025's acceptance is "no doc claims a gate CI does not run", and for
      # a long time nothing enforced it -- docs/67 stated DOC-025's own gate as
      # a documentation consistency check that had never been written, so the
      # row meant to catch unbacked gate claims was itself one. A document
      # promising a check nobody wrote is worse than one promising nothing,
      # because it is read as assurance.
      - name: No document claims a gate CI does not run
        run: python3 tools/check-doc-claims.py
      # A decision record's status is load-bearing: `Proposed` means nobody has
      # committed, and a reader deciding whether to follow it reads that word
      # before the argument. `ADR-021` sat at `Proposed` while `RND-11` was
      # built to it, shipped and closed -- and `RND-11`'s own row said
      # "Proposed" in the same sentence that recorded the work as done. Review
      # cannot catch that: the two live in different files and neither diff is
      # wrong on its own.
      - name: A finished row's ADR is not still proposed
        run: python3 tools/check-adr-status.py
      # The owner's hold on publishing is kept by the trigger, not by anybody
      # remembering it: a release workflow must fire on a component-scoped tag
      # or a deliberate manual run, never on a merge.
      - name: A release cannot publish by accident
        run: python3 tools/check-release-hold.py
      # fuzz/ is its own workspace with its own lockfile, path-depending on
      # crates in the main one — so a dependency change there invalidates it
      # without the main --locked build noticing. That has cost two incidents:
      # a vulnerable h2 that only fuzz/ still pinned, and a stale lock that
      # failed fuzz-build on main. Seconds here beats minutes there.
      - name: The fuzz lockfile is not stale
        run: python3 tools/check-fuzz-lock.py
      # DOC-025's "142 stale claims" had no list behind it. This is one thing
      # that *is* enumerable: a document naming a path is making a checkable
      # claim, and an integrator who follows it and finds nothing has been
      # misled by prose that read as fact.
      - name: Every code path a document names exists
        run: python3 tools/check-doc-paths.py
      # Boundary invariant 7: the browser build and the native build compile the
      # same engine. Kept by care until now; the failure mode is one
      # `cfg(target_os)` added to make a build pass, which review does not see.
      - name: The engine does not fork on the platform
        run: python3 tools/check-host-seams.py
      # `docs/00-README.md` calls itself the map, and AGENTS.md sends every
      # agent there first -- so a document missing from it is a document
      # nobody finds. Eight of them accumulated (69..75 and the 14a archive)
      # because writing a new document never forces this file to change, and a
      # review diff shows the document being added, not the index that failed
      # to mention it (DOC-033).
      - name: Every document is in the documentation index
        run: python3 tools/check-doc-index.py
      # The browser suite speaks the wire protocol over a raw socket, so it
      # carries its own copy of the version number. Bumping the engine and
      # forgetting this one turned three collaboration tests red *after* a
      # merge, and only in `browser-smoke` -- a ten-minute job, on main. The
      # same drift is a one-second grep here.
      - name: The browser suite speaks the engine's protocol version
        run: |
          engine=$(grep -oE 'PROTOCOL_VERSION: u32 = [0-9]+' \
            crates/casual-calc-transaction/src/protocol.rs | grep -oE '[0-9]+$')
          suite=$(grep -oE '^const PROTOCOL = [0-9]+' \
            tests/browser/collab.spec.mjs | grep -oE '[0-9]+$')
          if [ -z "$engine" ] || [ -z "$suite" ] ; then
            echo "::error::could not read a protocol version from one of the two files" >&2
            exit 1
          fi
          if [ "$engine" != "$suite" ] ; then
            echo "::error::engine speaks protocol $engine, tests/browser/collab.spec.mjs speaks $suite" >&2
            exit 1
          fi
          echo "both speak protocol $engine"
      # Cargo defaults `overflow-checks` off in release, so arithmetic that
      # panics in a debug test wraps silently in the shipped binary — the tests
      # then prove a property the artefact does not have. This engine's
      # arithmetic runs on indices and lengths taken from untrusted files, so
      # the setting is deliberate and must stay deliberate.
      - name: Release builds must keep overflow checks
        run: |
          if ! grep -qE '^overflow-checks *= *true' Cargo.toml ; then
            echo "::error::[profile.release] must set overflow-checks = true" >&2
            exit 1
          fi
      # ADR-012: a host is not an engine layer. A host may depend on the
      # crates; nothing under `crates/` may depend on a host, or an async
      # runtime and an HTTP stack arrive in a library that has neither. A
      # documented boundary that nothing checks is a boundary that erodes.
      #
      # **Every host, derived**, not the one this check was written for. It
      # named `casual-calc-collab-server` alone, so a crate taking a dependency
      # on `casual-calc-host` or `casual-calc-wopi` would have been told the
      # boundary was intact — while the workspace manifest states the rule for
      # all three.
      - name: The engine must not depend on any host
        run: |
          mapfile -t HOSTS < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.manifest_path | contains("/server/")) | .name')
          broken=0
          for host in "${HOSTS[@]}"; do
            if grep -rn "$host" crates/ ; then
              echo "::error::a crate under crates/ depends on $host (ADR-012)" >&2
              broken=1
            fi
          done
          [ "$broken" = "0" ] || exit 1
          echo "engine/host boundary intact for: ${HOSTS[*]}"
      # A diagnostic code is a promise to whoever reads a log, and docs/20 is
      # where that promise is written down. Nothing checked the two agreed, and
      # both drifts had already happened: `OC-IMP-0003` sat in the registry for
      # a limit nothing enforced, and the first fix for it emitted a fresh
      # `OC-IMP-0004` that the registry had never heard of.
      #
      # Checked in one direction only. A code the *code* emits must be
      # registered; a code the registry lists need not be emitted yet, because
      # the registry deliberately reserves codes for work that is planned.
      - name: Every emitted error code is in the registry
        run: |
          missing=0
          for code in $(grep -rhoE '"OC-[A-Z]+-[0-9]{4}"' crates/ server/ --include='*.rs' \
                        | tr -d '"' | sort -u); do
            if ! grep -q "\`$code\`" docs/20-ERROR-CODE-REGISTRY.md ; then
              echo "::error::$code is emitted but not in docs/20-ERROR-CODE-REGISTRY.md" >&2
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "every emitted diagnostic code is registered"
      # SEC-001. A workbook is untrusted input, so any path turning its text
      # into markup runs somebody else's script in the editor's origin — where
      # the document, the session token and the collaboration socket live. The
      # Name Manager did exactly that, and opening a file was enough.
      #
      # Sinks are not banned outright: a few build fixed markup (an SVG icon,
      # a menu scaffold) and rewriting those as DOM calls buys nothing. They
      # carry an `oc-safe-html:` marker naming *why* they are safe, so a new one
      # has to be argued for rather than merely typed.
      #
      # **`[[:space:]]`, not `\s`.** `git grep -E` is POSIX ERE, where `\s` is
      # undefined — so the `innerHTML`/`outerHTML` half of this pattern matched
      # *nothing*, and the gate had been passing on one sink in seven. The one
      # it did catch was `document.write(`, the only alternative with no `\s`
      # in it, which is why the job still looked alive. Every existing sink
      # turned out to be marked, so nothing was exploitable — but a new one
      # would have sailed through the check written to stop it.
      #
      # **Every host's markup, by pattern rather than by name.** This listed
      # `casual-calc-host` alone, so `casual-calc-wopi/src/editor.html` — which
      # is served to a browser exactly the same way — was outside the gate, and
      # a sink added there would have passed. That is the third time a
      # hand-maintained list of hosts has gone stale here (the wasm excludes
      # and the ADR-012 boundary were the other two), so this one matches a
      # path shape instead of naming crates.
      - name: Dynamic HTML sinks must be marked as audited
        run: |
          unmarked=0
          while IFS= read -r hit; do
            file=${hit%%:*}
            rest=${hit#*:}
            line=${rest%%:*}
            # The line immediately above, and nothing wider: a three-line
            # window let an unrelated marker nearby exempt a brand-new sink,
            # which is how this check first passed against a planted one.
            prev=$(( line > 1 ? line - 1 : 1 ))
            if sed -n "${prev}p" "$file" | grep -q 'oc-safe-html:'; then
              continue
            fi
            echo "::error file=$file,line=$line::unmarked dynamic HTML sink (SEC-001). Build DOM with textContent, or add an 'oc-safe-html:' comment saying why this markup is static."
            unmarked=$((unmarked + 1))
          done < <(git grep -nE '\.(innerHTML|outerHTML)[[:space:]]*=|insertAdjacentHTML|document\.write\(' \
                     -- 'webapp/*.js' 'webapp/*.html' 'server/**/*.html' 'server/**/*.js' \
                   | grep -v 'oc-safe-html:')
          if [ "$unmarked" -gt 0 ]; then
            echo "$unmarked unmarked sink(s)" >&2
            exit 1
          fi
          echo "every dynamic HTML sink is marked audited"

  # The only gate that runs the editor as a user does. Every other job proves
  # the engine is right; none of them would notice the WebAssembly glue failing
  # to instantiate, a canvas that never paints, or bindings and engine that
  # disagree about a signature — a stale `pkg/` once shipped 25 of 222 exports
  # with every Rust gate green. AGENTS.md requires verifying in a browser
  # before calling anything done; this is that, on every push.
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      # Built here, never taken from the tree: `webapp/pkg/` is not committed,
      # and a gate that would accept a stale build is a gate that cannot catch
      # a stale build.
      - name: Build the engine for the browser
        run: wasm-pack build crates/casual-calc-wasm --release --target web --out-dir "$PWD/webapp/pkg"
      # The collaboration suite runs two browsers against the real server
      # binary. Built as its own step so a compile failure says so, instead of
      # surfacing as Playwright giving up on a port that never opened — and so
      # the compile is not racing that job's readiness timeout.
      - name: Build the collaboration server
        run: cargo build --locked -p casual-calc-collab-server
      - name: Install the harness
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the smoke suite
        working-directory: tests/browser
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: |
            tests/browser/test-results/
          retention-days: 7

  # Every other test of the calc engine was written from the specification by
  # whoever wrote the code it tests, so a *misreading* of the spec produces a
  # test that agrees with the bug. LibreOffice does not share our misreadings.
  # Its first run found the `_xlfn.` writer bug (P2-003): five functions were
  # being written in a form Excel reads as #NAME?.
  oracle-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - name: Install the oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          soffice --version
      - name: Diff the corpus against LibreOffice Calc
        run: cargo run -q -p casual-calc-fidelity -- --json oracle-report.json
      # P1B-003: does an independent implementation accept *and understand* the
      # packages we write? A full re-save drives its reader over every part and
      # then writes back what it understood, which catches the structural
      # mistakes an "it opened" check cannot.
      - name: Validate the package LibreOffice gets
        run: cargo run -q -p casual-calc-fidelity -- --validate-package --json package-report.json
      # ODS-02: the `.ods` reader had no oracle at all. Its tests read documents
      # this repository wrote, which proves the reader agrees with the writer
      # and nothing about whether either agrees with LibreOffice -- the
      # application that actually makes `.ods` files, and now an upload path
      # into this engine. The corpus is LibreOffice-authored: its repeat runs,
      # its escaping, its element order.
      - name: Diff the .ods corpus against LibreOffice Calc
        run: cargo run -q -p casual-calc-fidelity -- --ods --json ods-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oracle-report
          path: |
            oracle-report.json
            package-report.json
            ods-report.json
          retention-days: 14

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
        with:
          manifest-path: fuzz/Cargo.toml
      - name: Install pinned nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-07-20 --profile minimal
          cargo install cargo-fuzz --locked
      - name: Build fuzz targets and assert the lockfile is unchanged
        working-directory: fuzz
        run: |
          cargo +nightly-2026-07-20 fuzz build
          git diff --exit-code Cargo.lock
      # Built is not run. A target that compiles proves the harness exists; only
      # running it searches, and a fuzzer that never runs finds nothing — which
      # is a gate that reports on its own existence.
      #
      # Short on purpose: a minute each is not a fuzzing campaign, it is a
      # regression check that the corpus already found. The long runs belong
      # somewhere without a per-job time limit; what this catches is a change
      # that breaks an input the corpus has already reduced.
      - name: Run each fuzz target briefly
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in bounded_package formula_parse number_format wire_operation ooxml_xml transform_tp1 token_verify ods xlsx delimited snapshot; do
            seeds="seeds/$target"
            extra=""
            flags="-max_total_time=60 -rss_limit_mb=4096"
            # `xlsx` reads the rights-reviewed fixture corpus **in place**
            # rather than carrying a second copy of it: five producers (Excel,
            # LibreOffice, openpyxl, XlsxWriter, this repository), already
            # checksummed by `repository-policy`, so a seed cannot drift from
            # the fixture it came from. `-max_len` is explicit because the
            # largest fixture is 934 KB and libFuzzer sizes its mutations from
            # the largest corpus entry when not told otherwise.
            #
            # These are named **after** `corpus/$target`, and that order is not
            # cosmetic: libFuzzer writes what it finds into the *first*
            # directory, so naming a tracked one there fills `fixtures/` with a
            # thousand fuzzer artefacts.
            if [ "$target" = xlsx ]; then
              extra="seeds/ooxml_xml ../fixtures/corpus ../fixtures/generated"
              flags="$flags -max_len=65536"
            fi
            echo "::group::$target"
            # Created, not assumed. `fuzz/corpus/` is gitignored, so on a fresh
            # checkout it does not exist — and libFuzzer treats a named corpus
            # directory that is missing as an error rather than as empty. It
            # only bit the targets that *have* seeds, because those were the
            # only ones naming a corpus directory at all, and it never bit a
            # working tree where earlier runs had already created one.
            mkdir -p "corpus/$target"
            cargo +nightly-2026-07-20 fuzz run "$target" \
              "corpus/$target" $([ -d "$seeds" ] && echo "$seeds" || true) $extra \
              -- $flags
            echo "::endgroup::"
          done

  # Nothing built the images, so nothing tested that the Dockerfiles still
  # compile — the one artefact an integrator actually runs was the only thing
  # with no gate at all (DEP-07). Build only: publishing is a release concern
  # and needs a registry decision, but a Dockerfile that stopped building would
  # otherwise be found by whoever tried to deploy.
  #
  # Also asserts the standalone stack comes up and answers through its proxy,
  # which is what PROD-12 was about: the page and the socket on one origin.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build every image
        run: |
          docker build -f server/casual-calc-host/Dockerfile -t opencalc-host .
          docker build -f server/casual-calc-collab-server/Dockerfile -t opencalc-collab .
          docker build -f server/casual-calc-wopi/Dockerfile -t opencalc-wopi .
      - name: The standalone stack answers on one origin
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^OPENCALC_SHARED_SECRET=.*/OPENCALC_SHARED_SECRET=ci-not-a-real-secret/' .env
          docker compose up -d --no-build
          # Wait for the proxy rather than a fixed sleep: the collab server
          # waits on the host's healthcheck, so readiness is a chain.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          [ "${ready:-0}" = "1" ] || { docker compose logs; exit 1; }
          # The socket has to be reachable on the *same* origin as the page,
          # which is the whole of PROD-12. What is checked is the **routing**,
          # not the handshake: a completed 101 leaves the connection open and
          # curl reports an empty reply, so probing with an upgrade tests curl
          # rather than nginx. A plain GET is enough — the collaboration server
          # answers it (refusing, since it is not an upgrade), and the proxy
          # failing to route answers 404 from the host or 502 from nowhere.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   'http://127.0.0.1:8080/collab?doc=ci' || echo 000)
          case "$code" in
            404|502|000)
              echo "::error::/collab answered $code through the proxy: not routed"
              docker compose logs
              exit 1
              ;;
            *) echo "collab is reachable on the page's own origin ($code)" ;;
          esac
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null && echo "host reachable"
      # **PROD-13: the whole chain, on the deployed stack.**
      #
      # Every leg of this is covered on its own — the importer has unit tests,
      # the collaboration protocol has a browser suite, the steps above prove
      # the containers answer. What nothing covered is the *chain*: that the
      # file a person uploads is the file the collaboration server fetches over
      # an internal address that only exists inside this network, and that two
      # participants handed tokens by the host converge on it.
      #
      # That is where a deployment breaks, and every previous failure of the
      # kind looked like a blank editor with three healthy containers and
      # nothing in any log.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 22 for a global `WebSocket`, so the check speaks the protocol with
          # no dependencies to install into a job that has none.
          node-version: "22"
      - name: A real workbook survives upload, sharing, co-editing and download
        run: node tools/e2e-document-lifecycle.mjs http://127.0.0.1:8080
      - name: Show the stack's logs if the chain broke
        if: failure()
        run: docker compose logs
      - name: The WOPI adapter serves a discovery document
        run: |
          set -euo pipefail
          # The one URL an administrator pastes into Nextcloud or SharePoint. If
          # it does not parse, the editor never appears in their list and there
          # is no error anywhere to explain why.
          docker compose --profile wopi up -d --no-build wopi
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1; then up=1; break; fi
            sleep 2
          done
          [ "${up:-0}" = "1" ] || { docker compose logs wopi; exit 1; }
          curl -fsS http://127.0.0.1:8090/hosting/discovery -o discovery.xml
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('discovery.xml')"
          grep -q 'name="edit" ext="xlsx"' discovery.xml \
            || { echo "::error::no edit action for xlsx"; cat discovery.xml; exit 1; }
          echo "discovery is valid XML and advertises an editor"
      - if: always()
        run: docker compose down -v || true

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-deny --locked
      - run: cargo deny check bans licenses sources
      # `advisories` was the one `cargo deny` check left out, so the RUSTSEC
      # database — the entire point of a supply-chain gate — was never
      # consulted, while docs/07 and docs/15 both stated it was. A gate a
      # document claims and CI does not run is worse than no gate: it is a
      # gate somebody is relying on.
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
      # **`fuzz/` resolves its own lockfile, and CI compiles it.** `cargo audit`
      # reads one lockfile, so this second dependency tree sat outside the
      # supply-chain gate entirely — it was still pinning the h2 that
      # RUSTSEC-2026-0258 is against, and building it, while the job above said
      # "0 vulnerabilities". Audited here rather than trusted to stay in step,
      # because it is resolved separately and will drift again.
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: "1.96.0"
          - os: windows-latest
            toolchain: "1.96.0"
          - os: ubuntu-latest
            toolchain: "1.88.0"   # MSRV check (ADR-pending)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/cargo-warmup
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: rustup override set ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-features --locked
