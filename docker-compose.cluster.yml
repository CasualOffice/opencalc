# OpenCalc as a cluster: two collaboration nodes behind a proxy, coordinating
# through Redis.
#
#   cp .env.example .env
#   docker compose -f docker-compose.cluster.yml up --build
#   open http://localhost:8090
#
# What this demonstrates that standalone cannot: a client lands on whichever
# node the proxy chose, one node leads a given document, and the other relays to
# it. Two people editing the same sheet may be on different nodes and cannot
# tell — which is the point (ADR-017).
#
# Standalone is not a lesser version of this. One process is leader of every
# document by definition and needs no Redis at all; the cluster buys horizontal
# capacity, not correctness.

name: opencalc-cluster

services:
  redis:
    image: redis:7-alpine
    # No persistence: Redis holds leases, the op log for documents currently
    # open, and pub/sub. The *documents* live with the host. Losing Redis costs
    # in-flight coordination, which the nodes recover by re-claiming, and not
    # anybody's spreadsheet.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  host:
    build:
      context: .
      dockerfile: server/casual-calc-host/Dockerfile
    environment:
      OPENCALC_HOST_BIND: 0.0.0.0:8080
      OPENCALC_STORE: /data
      OPENCALC_SHARED_SECRET: ${OPENCALC_SHARED_SECRET:?set it in .env — see .env.example}
      OPENCALC_AUDIENCE: ${OPENCALC_AUDIENCE:-opencalc-demo}
      # Through the proxy, which is what makes the two nodes invisible.
      #
      # A *different* variable from the standalone stack's on purpose. Sharing
      # one name means a `.env` written for standalone points the browser at
      # port 8443, which the cluster does not publish — and the symptom is an
      # editor that says "reconnecting" forever with nothing in any log, because
      # nothing ever reached a server. Found by running it.
      OPENCALC_COLLAB_WS: ${OPENCALC_CLUSTER_COLLAB_WS:-ws://127.0.0.1:8090/collab}
      OPENCALC_HOST_INTERNAL: http://host:8080
    volumes:
      - documents:/data
      # `:ro` because the renderer only ever reads these, and read-only is the
      # honest declaration of that.
      - ./fonts:/fonts:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/casual-calc-host", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  collab-a: &collab
    build:
      context: .
      dockerfile: server/casual-calc-collab-server/Dockerfile
    environment: &collab-env
      OPENCALC_BIND: 0.0.0.0:8443
      OPENCALC_SHARED_SECRET: ${OPENCALC_SHARED_SECRET:?set it in .env — see .env.example}
      OPENCALC_AUDIENCE: ${OPENCALC_AUDIENCE:-opencalc-demo}
      OPENCALC_ALLOW_PLAIN_CALLBACKS: "1"
      OPENCALC_ALLOWED_HOSTS: ${OPENCALC_ALLOWED_HOSTS:-host,127.0.0.1,localhost}
      OPENCALC_REDIS_URL: redis://redis:6379
      # Both must be set or neither: half an identity is a cluster that cannot
      # form, and guessing the other half is how a node advertises an address
      # nobody can reach. The server refuses to start rather than guess.
      OPENCALC_NODE_ID: node-a
      OPENCALC_ADVERTISE: collab-a:8443
      # The proxy is in front, so the client address arrives in a header. Trust
      # it only from the proxy — `X-Forwarded-For` is a claim until you know who
      # made it.
      OPENCALC_TRUSTED_PROXIES: ${OPENCALC_TRUSTED_PROXIES:-}
      OPENCALC_TRUST_ANY_PROXY: "1"
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      redis:
        condition: service_healthy
      host:
        condition: service_healthy
    # Longer than OPENCALC_DRAIN_DEADLINE_MS (25s), so a node stopping is
    # allowed to finish returning documents to the host. Docker's default is
    # 10s, which SIGKILLed a node mid-drain and lost exactly the work the drain
    # exists to save (DEP-05). Inherited by collab-b through the anchor above.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/usr/local/bin/casual-calc-collab-server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  collab-b:
    <<: *collab
    environment:
      <<: *collab-env
      OPENCALC_NODE_ID: node-b
      OPENCALC_ADVERTISE: collab-b:8443

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.cluster.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${OPENCALC_PROXY_PORT:-8090}:80"
    depends_on:
      host:
        condition: service_healthy
      collab-a:
        condition: service_healthy
      collab-b:
        condition: service_healthy

volumes:
  documents:
