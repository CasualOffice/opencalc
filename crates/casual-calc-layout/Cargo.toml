[package]
name = "casual-calc-layout"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The formula *language* only: a chart series names its values with a
# reference string, and `chart_data` has to parse one. `casual-calc-formula`
# has no dependencies of its own and sits in the bedrock beside the model
# (docs/19), so this is a downward edge and not a new layer.
casual-calc-formula = { path = "../casual-calc-formula" }
# Advance widths, for geometry decided by how wide a string is — a chart
# legend box, and the plot rectangle left over from it (`RND-11`). Also the
# home of the font substitution table, which moved down with it because the
# faces need it and it needs nothing.
casual-calc-text = { path = "../casual-calc-text", default-features = false }
casual-calc-model = { path = "../casual-calc-model" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
