[package]
name = "casual-calc-sdk"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Forwarded rather than fixed (ADR-018). A native host embedding the SDK should
# shape text; the WebAssembly build turns this off, because the browser already
# shapes what a user looks at and a shaper in that bundle is pure weight.
[features]
default = ["shaping", "raster"]
shaping = ["casual-calc-render/shaping"]
# Forwarded, so a host that renders a thumbnail decodes every raster format a
# workbook can carry. Off in the WebAssembly build, which does not render PNGs.
raster = ["casual-calc-render/raster"]

[dependencies]
casual-calc-eval = { path = "../casual-calc-eval" }
casual-calc-export = { path = "../casual-calc-export" }
casual-calc-import = { path = "../casual-calc-import" }
casual-calc-io = { path = "../casual-calc-io" }
casual-calc-layout = { path = "../casual-calc-layout" }
casual-calc-model = { path = "../casual-calc-model" }
# The OpenDocument reader and writer, so a `.ods` a host holds can be opened
# and saved back as one (`WOPI-07`). A peer of the OOXML path rather than a
# layer under it: the two formats share the model and nothing else.
# For `input_edit`: deciding whether typed text is a formula means parsing it
# (`TAURI-002`). Already in the graph beneath `-transaction`, so this adds
# nothing to the build — it only names what this crate now uses directly.
casual-calc-formula = { path = "../casual-calc-formula" }
casual-calc-ods = { path = "../casual-calc-ods" }
casual-calc-ooxml = { path = "../casual-calc-ooxml" }
casual-calc-render = { path = "../casual-calc-render", default-features = false }
casual-calc-transaction = { path = "../casual-calc-transaction" }

[dev-dependencies]
# To build a picture and to read the rendered one back. Already in the graph
# under `casual-calc-render`, so this adds nothing to the workspace — a test
# that asserts a picture reached the surface has to look at pixels, and the
# encoded PNG this crate returns is not something to eyeball.
tiny-skia = "0.11"

[lints]
workspace = true
