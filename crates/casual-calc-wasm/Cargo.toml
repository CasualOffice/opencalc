[package]
name = "casual-calc-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Skip the optional wasm-opt post-pass: modern Rust emits bulk-memory ops that
# some cached wasm-opt binaries reject. The demo does not need size-optimization.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
casual-calc-eval = { path = "../casual-calc-eval" }
casual-calc-formula = { path = "../casual-calc-formula" }
casual-calc-import = { path = "../casual-calc-import" }
casual-calc-io = { path = "../casual-calc-io" }
casual-calc-layout = { path = "../casual-calc-layout" }
casual-calc-model = { path = "../casual-calc-model" }
casual-calc-render = { path = "../casual-calc-render" }
casual-calc-sdk = { path = "../casual-calc-sdk" }
casual-calc-transaction = { path = "../casual-calc-transaction" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[lints]
workspace = true
