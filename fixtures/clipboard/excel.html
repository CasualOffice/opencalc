<!-- Captured from Microsoft Excel's `text/html` clipboard flavour, trimmed to
     the table and its inline styles. Excel puts the number format in the
     non-standard `mso-number-format` property and wraps nothing in <b>. -->
<table border=0 cellpadding=0 cellspacing=0 width=192 style='border-collapse:collapse'>
 <tr height=20>
  <td height=20 width=96 style='height:15.0pt;width:72pt;font-weight:700;
  background:#FFFF00;text-align:center'>Item</td>
  <td width=96 style='width:72pt;font-weight:700;background:#FFFF00;text-align:center'>Qty</td>
 </tr>
 <tr height=20>
  <td style='color:#FF0000;font-style:italic'>Widget</td>
  <td style='mso-number-format:"0\.00";text-align:right'>3.50</td>
 </tr>
 <tr height=20>
  <td colspan=2 style='text-align:center;background:#DDEBF7'>Total row</td>
 </tr>
</table>
