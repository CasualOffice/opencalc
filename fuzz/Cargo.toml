# Separate cargo workspace: nightly-only cargo-fuzz deps stay out of the product
# graph. See docs/19-WORKSPACE-SCAFFOLD-DESIGN.md and docs/29-PHASE-0-PLAN.md.
[package]
name = "casual-calc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.88.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
casual-calc-formula = { path = "../crates/casual-calc-formula" }
libfuzzer-sys = "0.4"
casual-calc-package = { path = "../crates/casual-calc-package" }
casual-calc-layout = { path = "../crates/casual-calc-layout" }
casual-calc-ooxml = { path = "../crates/casual-calc-ooxml" }
casual-calc-collab-server = { path = "../server/casual-calc-collab-server" }
casual-calc-model = { path = "../crates/casual-calc-model" }
casual-calc-ods = { path = "../crates/casual-calc-ods" }
casual-calc-transaction = { path = "../crates/casual-calc-transaction" }
serde_json = "1"
# Both already in this lockfile, at these versions, via `casual-calc-package`
# and `casual-calc-ods` — so the fuzz dependency set gains no third-party crate
# and `cargo audit --file fuzz/Cargo.lock` has nothing new to judge. `zip`
# builds the package the reader admits from; `quick-xml` lets the ODS target
# estimate a document's expansion with the *same* parser and the same
# attribute-matching rules the reader uses, which a byte scan could not.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"

[[bin]]
name = "bounded_package"
path = "fuzz_targets/bounded_package.rs"
test = false
doc = false
bench = false

# Detach from the parent workspace.
[workspace]

[[bin]]
name = "formula_parse"
path = "fuzz_targets/formula_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "number_format"
path = "fuzz_targets/number_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_operation"
path = "fuzz_targets/wire_operation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ooxml_xml"
path = "fuzz_targets/ooxml_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transform_tp1"
path = "fuzz_targets/transform_tp1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token_verify"
path = "fuzz_targets/token_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ods"
path = "fuzz_targets/ods.rs"
test = false
doc = false
bench = false
