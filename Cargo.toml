[workspace]
resolver = "3"
members = [
    "crates/casual-calc-model",
    "crates/casual-calc-formula",
    "crates/casual-calc-package",
    "crates/casual-calc-ooxml",
    "crates/casual-calc-import",
    "crates/casual-calc-export",
    "crates/casual-calc-ods",
    "crates/casual-calc-io",
    "crates/casual-calc-transaction",
    "crates/casual-calc-selection",
    "crates/casual-calc-eval",
    "crates/casual-calc-layout",
    "crates/casual-calc-render",
    "crates/casual-calc-sdk",
    "crates/casual-calc-wasm",
    "tools/casual-calc-benchmark",
    "tools/casual-calc-loadtest",
    "tools/casual-calc-fidelity",
    # The collaboration server is a *host*, not an engine layer (ADR-012). It
    # may depend on the crates; nothing under `crates/` may depend on it, which
    # is what keeps an async runtime and an HTTP stack out of a library that
    # has neither. Enforced by the `repository-policy` CI job.
    "server/casual-calc-collab-server",
    "server/casual-calc-host",
    # The WOPI adapter: a WOPI *client* on one side and an ordinary OpenCalc
    # integrator on the other (docs/74). Same rule as the two above — it may
    # depend on `crates/`, and nothing under `crates/` may depend on it.
    "server/casual-calc-wopi",
]
# The fuzz workspace is separate: it pulls nightly-only cargo-fuzz deps that must
# stay out of the product dependency graph (docs/19, docs/29).
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CasualOffice/opencalc"
rust-version = "1.88.0"          # MSRV — ADR-pending, see docs/08-ADR-REGISTER.md

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# On, against Cargo's default of off for release.
#
# This engine's arithmetic runs on numbers taken from an untrusted file: row and
# column indices, run lengths, part sizes, serial dates. With overflow checks off
# in release, an expression that panics loudly in a debug test wraps silently in
# the binary people actually run — so the tests prove a property the shipped
# artefact does not have, which is worse than not testing it.
#
# AGENTS.md orders correctness and security bounds above performance, and this is
# that ordering applied: a wrapped index is a wrong cell or an out-of-bounds
# read, and neither is worth the few percent.
overflow-checks = true
