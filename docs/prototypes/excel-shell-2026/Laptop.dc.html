<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenCalc shell at 1024px</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1024px; height: 768px; overflow: hidden">
<dc-import name="Main" collapse="3" labels="none" hint-size="1024px,768px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
