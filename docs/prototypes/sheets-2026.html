    <button class="icbtn" data-act="theme" aria-label="Switch theme"
            data-tip="Theme|Auto, light or dark" aria-haspopup="menu" aria-expanded="false">

      <svg class="ic"><use href="#i-target"/></svg></button>

</header>

<!-- ====================================================== MENU BAR ====== -->
<!-- Eight menus, built from #menu-model. The magnifier is pinned LEFT of File,
     which is what buys the right to a 31-slot toolbar: editorial restraint
     without a route to what was left out is amputation. -->
<div class="menubar" data-region="menubar" role="menubar" aria-label="Menus">

         the sheet tabs or the engine status. -->
    <div class="snackhost" data-role="snackhost"></div>

         action now lands at its own cause instead of 700px away from it. -->

            hidden><span class="statval" data-role="statval"></span></button>

            data-tip="Explore|A host-provided seam: nothing is behind it in this build">

     buildMenuBar(). A placement change is a one-line reviewable diff, and a
     typo'd id is a build failure rather than a control that quietly vanishes.

<!-- ======================================================================
     THE TOOLBAR MODEL — 39 slots, in order: 31 controls, 8 hairlines.
     The selection rule behind it, so a reviewer next year can apply it
     rather than argue about it. A command earns a permanent seat only by
     passing all four tests:
       (a) FREQUENCY   invoked more than once per editing session;
       (b) REVERSIBLE  routes through the undo history;
       (c) IMMEDIACY   meaningful on the selection with no further argument;
       (d) NO DUPLICATE READOUT — nothing else permanently on screen already
           both shows and sets that state.
     Failing (c) sends a command to a MENU that opens a PANEL, never to the
     overflow: a user who opens the overflow expects controls that act on
     what is selected. Failing (b) sends it to a menu whatever its frequency.
     Failing (a) or (d) alone sends it to the permanent residents of "More".
     That is why Freeze, Sort range, Data validation and Conditional
     formatting have no seat, and why zoom does not either — the bottom bar
     already shows the number and sets it.
     ADDING ONE NEXT YEAR: the bar is full. A change must name the control it
     displaces, in the same diff.
     ====================================================================== -->

<!-- Every menu drop, every picker and every group flyout is BUILT AT BOOT and
     parked here. Opening one MOVES it into place and closing moves it back, so
     exactly one node ever carries a given command id and the published command
     surface cannot change size as the user clicks around. In the shipped
     editor listCommands() reads the live DOM, so a lazily-rendered surface
     silently shrinks the SDK's published surface. -->
<div data-role="popstore" hidden></div>

<script>
/* ===========================================================================
   THE JS FOUNDATION
   Vanilla, no dependency. Everything the next two passes need is exposed on
   window.SHEETS so they can add panels and surfaces without re-deriving any
   of this.
   =========================================================================== */
(function () {
"use strict";

var $  = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var root = document.documentElement;
var store = $('[data-role="popstore"]');

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
/* Parsed as HTML rather than built with createElementNS, because the SVG
   namespace literal is the one string this file must never contain — the
   self-contained rule forbids any scheme-and-slashes URL anywhere in the
   source, and that includes the namespace constant, which merely LOOKS like
   a network address. An HTML parser supplies it for free. */
function icon(name, cls) {
  var span = el("span");
  span.innerHTML = '<svg class="' + (cls || "ic") + '"><use/></svg>';
  var svg = span.firstChild;
  svg.firstChild.setAttribute("href", "#i-" + name);
  return svg;
}
function has(id) { return !!document.querySelector('[data-cmd="' + CSS.escape(id) + '"]'); }

/* --- command dispatch ---------------------------------------------------
   A command IS its owning node: dispatch is a click on the one node carrying
   the id. Every other drawing of the verb is a proxy that clicks it. */
function runCommand(id) {
  var n = document.querySelector('[data-cmd="' + CSS.escape(id) + '"]');
  if (!n) throw new Error('the command "' + id + '" is not available in this mode');
  n.click();
  return true;
}
function listCommands() {
  var seen = Object.create(null);
  $$("[data-cmd]").forEach(function (n) {
    if (!n.classList.contains("cmd-hidden")) seen[n.dataset.cmd] = 1;
  });
  return Object.keys(seen).sort();
}

/* --- the status line ----------------------------------------------------
   Feedback lands where the pointer is: the snackbar for a grid action, the
   panel for a panel refusal, the open menu for a menu refusal. The engine
   status strip keeps only what it is for. */
var engineEl = $('[data-role="engine"]');
var modeEl   = $('[data-role="cellmode"]');
function mode(t) { modeEl.textContent = t; }

/* ===========================================================================
   1. THEME
   =========================================================================== */
var themeIcon = $('[data-role="themeicon"]').firstElementChild;
function systemDark() { return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function resolvedDark() {
  var t = root.getAttribute("data-theme");
  return t ? t === "dark" : systemDark();
}
function syncThemeIcon() { themeIcon.setAttribute("href", resolvedDark() ? "#i-sun" : "#i-moon"); }
function setTheme(t) {
  if (t === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  syncThemeIcon();
  $$('[data-cmd^="view.theme."]').forEach(function (n) {
    n.setAttribute("aria-checked", String(n.dataset.cmd === "view.theme." + t));
  });
  grid.repaintSelection();
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
  syncThemeIcon(); grid.repaintSelection();
});

/* ===========================================================================
   1b. THE CHROME CHOOSER  (View ▸ Layout — docs/93 §12.4)
   Auto / Ribbon / Toolbar, ticked from resolveLayout() rather than from the
   rendered state, exactly as View ▸ Theme is. Three rules from §12.8 are
   honoured here even though this prototype draws only one of the two chromes:
     * every open surface CLOSES FIRST — a menu anchored to a node that is
       about to stop having a box measures 0x0 and lands in the corner;
     * the grid is refitted exactly ONCE, after the class toggle, never per
       frame, and the top-left visible cell is what is preserved;
     * focus goes to the new chrome's primary landmark, never silently to the
       grid, and the choice is announced by name.
   Coarse pointers are a REFUSAL, not a default (§12.7): Auto resolves to
   toolbar there and Ribbon is refused with its reason, rather than drawn and
   then broken.
   =========================================================================== */
var LAYOUT_NAME = { ribbon: "Ribbon", toolbar: "Toolbar" };
var LAYOUT_KEY = "oc-chrome-layout";
function coarsePointer() { return window.matchMedia("(pointer: coarse)").matches; }
function layoutPref() {
  var v = null;
  try { v = window.localStorage.getItem(LAYOUT_KEY); } catch (e) { v = null; }
  return v === "ribbon" || v === "toolbar" ? v : "auto";
}
/* Per-mount default, §12.7: desktop gets Ribbon, every other mount and every
   coarse pointer gets Toolbar. A file opened from disk is the web mount. */
function resolveLayout(pref) {
  if (pref === "ribbon") return coarsePointer() ? "toolbar" : "ribbon";
  if (pref === "toolbar") return "toolbar";
  return "toolbar";
}
function setLayout(pref) {
  closeAll(null);
  var resolved = resolveLayout(pref);
  try { if (pref === "auto") window.localStorage.removeItem(LAYOUT_KEY);
        else window.localStorage.setItem(LAYOUT_KEY, pref); } catch (e) {}
  root.setAttribute("data-layout", resolved);
  $$('[data-cmd^="view.layout."]').forEach(function (n) {
    n.setAttribute("aria-checked", String(n.dataset.cmd === "view.layout." + pref));
  });
  grid.refit();
  reflowToolbar();
  var first = tbItems()[0];
  if (first) first.focus();
  if (pref === "ribbon" && resolved !== "ribbon") {
    snack("Ribbon is not offered on a touch device — one chrome there, and it is this one", null, null);
  } else if (pref === "ribbon") {
    snack("The ribbon chrome is its own prototype — this file draws the toolbar chrome only",
          null, null);
  }
  echo(pref === "auto" ? "Layout: Auto — " + LAYOUT_NAME[resolved] : "Layout: " + LAYOUT_NAME[pref]);
}

/* ===========================================================================
   2. TOOLTIPS — delayed, measured while shown, never the accessible name
   =========================================================================== */
var tipEl = null, tipTimer = 0;
function hideTip() { clearTimeout(tipTimer); if (tipEl) { tipEl.remove(); tipEl = null; } }
function showTip(host) {
  var raw = host.getAttribute("data-tip"); if (!raw) return;
  var parts = raw.split("|");
  tipEl = el("div", "tip");
  tipEl.appendChild(el("b", null, parts[0]));
  if (parts[1]) tipEl.appendChild(el("span", null, parts[1]));
  if (host.hasAttribute("data-gap"))
    tipEl.appendChild(el("i", null, "No command id in this build yet."));
  document.body.appendChild(tipEl);
  var r = host.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  var x = Math.min(Math.max(6, r.left), window.innerWidth - t.width - 6);
  var y = r.bottom + 6;
  if (y + t.height > window.innerHeight - 6) y = r.top - t.height - 6;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
document.addEventListener("mouseover", function (e) {
  var host = e.target.closest("[data-tip]");
  if (!host) return;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(function () { showTip(host); }, 420);
});
document.addEventListener("mouseout", function (e) { if (e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("mousedown", hideTip, true);
window.addEventListener("scroll", hideTip, true);

/* ===========================================================================
   3. THE POPUP CONTROLLER
   Generic, and the surface pass 2 and pass 3 reuse. Panels are MOVED out of
   the store, shown, THEN measured and placed: measuring a hidden panel yields
   0x0 and makes every flip and clamp below dead code.
   =========================================================================== */
var openStack = [];        /* [{pop, trigger, home}] — index 0 is the root  */
var scrim = null;

function homeOf(pop) { return { parent: pop.parentNode, before: pop.nextSibling }; }

function closeFrom(depth, restoreFocus) {
  while (openStack.length > depth) {
    var top = openStack.pop();
    top.trigger.setAttribute("aria-expanded", "false");
    top.trigger.removeAttribute("data-open");
    (function (rec) {
      rec.pop.setAttribute("data-closing", "1");
      setTimeout(function () {
        rec.pop.removeAttribute("data-closing");
        rec.pop.removeAttribute("style");
        rec.home.parent.insertBefore(rec.pop, rec.home.before);
      }, 150);
    })(top);
  }
  if (!openStack.length && scrim) { scrim.remove(); scrim = null; }
  if (restoreFocus && restoreFocus.focus) restoreFocus.focus();
}
function closeAll(restoreFocus) { closeFrom(0, restoreFocus); }

function place(pop, trigger, side) {
  var r = trigger.getBoundingClientRect();
  var p = pop.getBoundingClientRect();
  var x, y, origin;
  if (side === "right") {                 /* a submenu opens beside its row */
    x = r.right - 4; y = r.top - 6; origin = "top left";
    if (x + p.width > window.innerWidth - 6) { x = r.left - p.width + 4; origin = "top right"; }
  } else {
    x = r.left; y = r.bottom + 4; origin = "top left";
    if (x + p.width > window.innerWidth - 6) { x = Math.max(6, r.right - p.width); origin = "top right"; }
  }
  if (y + p.height > window.innerHeight - 6) {
    var above = r.top - p.height - 4;
    if (side !== "right" && above > 6) { y = above; origin = origin.replace("top", "bottom"); }
    else y = Math.max(6, window.innerHeight - p.height - 6);
  }
  pop.style.setProperty("--pop-origin", origin);
  pop.style.left = Math.max(6, x) + "px";
  pop.style.top = Math.max(6, y) + "px";
}

/* openPop(trigger, popNode, {depth, side, focusFirst}) */
function openPop(trigger, pop, opts) {
  opts = opts || {};
  var depth = opts.depth || 0;
  /* Clicking the trigger of an already-open panel closes it. */
  if (openStack[depth] && openStack[depth].trigger === trigger) { closeFrom(depth, trigger); return null; }
  closeFrom(depth, null);
  if (!scrim) {
    scrim = el("div", "scrim");
    scrim.addEventListener("mousedown", function () { closeAll(null); });
    document.body.appendChild(scrim);
  }
  var rec = { pop: pop, trigger: trigger, home: homeOf(pop) };
  document.body.appendChild(pop);
  /* Switching between adjacent menus while the bar is armed is INSTANT. A
     menu bar that re-animates on every sideways move reads as a web page
     rather than an application, and this is the detail that decides it. */
  if (opts.instant) pop.style.animation = "none";
  else pop.style.animation = "";
  place(pop, trigger, opts.side);
  openStack[depth] = rec; openStack.length = depth + 1;
  trigger.setAttribute("aria-expanded", "true");
  trigger.setAttribute("data-open", "1");
  if (opts.focusFirst !== false) {
    var first = pop.querySelector('.mi:not([aria-disabled="true"]), input, .sw, .bd, button');
    if (first) first.focus();
  }
  return pop;
}
/* A click inside a panel must not dismiss it: panels hold live inputs. */
document.addEventListener("mousedown", function (e) {
  if (!openStack.length) return;
  if (e.target.closest(".pop")) return;
  var t = openStack[0].trigger;
  if (e.target === t || (t && t.contains(e.target))) return;
  closeAll(null);
});

/* ===========================================================================
   4. MENU ROWS
   Three slots, always: gutter / label / accelerator, plus a submenu arrow.
   The gutter ALWAYS contains its check glyph, so a checkable row never
   reflows the label when it is ticked and every row contains an <svg>.
   =========================================================================== */
function makeRow(item, path) {
  if (item.sep) { var s = el("div", "mi-sep"); s.setAttribute("role", "separator"); return s; }
  var b = el("button", "mi");
  b.type = "button";
  b.setAttribute("role", item.radio ? "menuitemradio" : (item.check ? "menuitemcheckbox" : "menuitem"));
  if (item.radio || item.check) b.setAttribute("aria-checked", item.checked ? "true" : "false");
  if (item.gap) b.dataset.gap = "1";
  if (item.radio) b.dataset.radio = item.radio;
  if (item.check) b.dataset.check = "1";
  if (item.mirror) b.dataset.mirror = item.mirror;
  if (item.proxy) b.dataset.proxy = item.cmd; else b.dataset.cmd = item.cmd;
  b.dataset.path = path;
  var tip = item.label.replace(/…$/, "");
  b.setAttribute("data-tip", tip + (item.note ? "|" + item.note : (item.key ? "|" + item.key : "")));

  var g = el("span", "mi-gutter");
  var chk = icon("check", "ic chk"); chk.classList.add("chk"); g.appendChild(chk);
  if (item.icon) { var gi = icon(item.icon, "ic gi"); gi.classList.add("gi"); g.appendChild(gi); }
  b.appendChild(g);
  b.appendChild(el("span", "mi-label", item.label));
  b.appendChild(el("span", "mi-key", item.key || ""));
  var sub = el("span", "mi-sub");
  if (item.sub) { sub.appendChild(icon("chev-right", "ic")); b.setAttribute("aria-haspopup", "menu");

  b.appendChild(sub);
  return b;
}
function makeMenu(items, path, depth) {

      store.appendChild(subPop);
      row.dataset.subFor = String(subId++);
      subPop.dataset.subId = row.dataset.subFor;
      row.addEventListener("click", function (e) {
        e.stopPropagation();
        openPop(row, subPop, { depth: depth + 1, side: "right" });
      });

         PER EVENT, not once at build time: a touch replay fires mouseenter
         immediately before click, and a build-time check gets it wrong. */

/* ===========================================================================
   6. POPUP BODIES THAT ARE DATA, NOT MARKUP

   CONTENT COLOUR IS NOT CHROME COLOUR, AND THIS IS THE ONLY PLACE EITHER IS
   COMPOSED OUTSIDE THE TOKEN BLOCK.
   Every colour the CHROME wears is a custom property; that rule has no
   exception and the check below the header comment enforces it. But a swatch
   picker and a sheet-tab colour are the user's choices about their DOCUMENT,
   not the chrome's palette: fifty tokens named --swatch-red-3 would be fifty
   values no theme ever redefines and no host ever swaps, which is a token set

function mkControl(it) {

    car.setAttribute("data-tip", it.label + " options|Choose a different one");
    car.dataset.pop = it.swatch ? "colour_" + it.swatch : it.pop;
    car.appendChild(icon("caret", "ic ic-sm"));
    wrap.appendChild(main); wrap.appendChild(car);
    if (it.proxy) main.dataset.proxy = it.id; else main.dataset.cmd = it.id;
    if (it.gap) { main.dataset.gap = "1"; car.dataset.gap = "1"; }

(function buildToolbar() {
  var cur = null, curName = null, pendingSep = null;
  TB.forEach(function (it) {
    if (it.kind === "sep") {
      if (it.group && it.group === curName) {
        var s2 = el("span", "tb-sep");
        s2.setAttribute("role", "separator");
        s2.setAttribute("aria-orientation", "vertical");
        cur.appendChild(s2);
      } else pendingSep = true;
      return;
    }
    var g = it.group || null;
    if (g !== curName) {
      if (pendingSep) {
        var s = el("span", "tb-sep");
        s.setAttribute("role", "separator");
        s.setAttribute("aria-orientation", "vertical");
        s.dataset.after = curName || "";
        toolbar.appendChild(s);
        pendingSep = false;
      }
      curName = g;
      if (g) {
        cur = el("div", "tbg");
        cur.setAttribute("role", "group");
        cur.setAttribute("aria-label", GROUPS[g].label);
        cur.dataset.group = g;
        if (GROUPS[g].fold) cur.dataset.fold = String(GROUPS[g].fold);
        toolbar.appendChild(cur);
        /* One chip per foldable group, built once, hidden until the ladder
           folds that group. Never a second copy of the controls: the group's
           own body is MOVED into the chip's popover. */
        if (GROUPS[g].fold) {
          var chip = el("button", "chip");
          chip.type = "button";
          chip.setAttribute("aria-haspopup", "menu");
          chip.setAttribute("aria-expanded", "false");
          chip.setAttribute("aria-label", GROUPS[g].label + " group");
          chip.setAttribute("data-tip", GROUPS[g].label + "|Folded at this width — open it here");
          chip.dataset.chipFor = g;
          chip.appendChild(el("span", null, GROUPS[g].label));
          toolbar.appendChild(chip);
          GROUPS[g].chip = chip;
        }
      } else cur = null;
    }
    (cur || toolbar).appendChild(mkControl(it));
  });
})();

/* The fold ladder. The ORDER is authored (each group carries data-fold); the
   POINT at which a step fires is measured, because guessing a pixel width is
   how the shipped bar ended up collapsing its first group at 1461px on a
   1440px laptop. Nothing is ever reordered: a control degrades in place and
   then folds into its OWN group's labelled chip. History and Number never
   fold — at the narrowest desktop width those two survive plus the chevron. */
var foldState = [];
function reflowToolbar() {
  $$(".tbg[data-fold]", toolbar).forEach(function (g) { g.removeAttribute("data-folded"); });
  Object.keys(GROUPS).forEach(function (k) {
    if (GROUPS[k].chip) GROUPS[k].chip.removeAttribute("data-shown");
  });
  foldState = [];
  var fits = function () { return toolbar.scrollWidth <= toolbar.clientWidth + 1; };
  if (fits()) return syncSeps();
  var order = $$(".tbg[data-fold]", toolbar).sort(function (a, b) {
    return (+a.dataset.fold) - (+b.dataset.fold);
  });
  for (var i = 0; i < order.length; i++) {
    var g = order[i];
    if (openStack.length) closeAll(null);   /* a folded body may be on loan */
    g.setAttribute("data-folded", "1");
    GROUPS[g.dataset.group].chip.setAttribute("data-shown", "1");
    foldState.push(GROUPS[g.dataset.group].label);
    syncSeps();
    if (fits()) break;
  }

    if (mi.dataset.radio) {
      var scope = mi.closest(".pop");
      $$('[data-radio="' + mi.dataset.radio + '"]', scope).forEach(function (n) {
        n.setAttribute("aria-checked", String(n === mi));
      });
    } else if (mi.dataset.check) {
      mi.setAttribute("aria-checked", mi.getAttribute("aria-checked") === "true" ? "false" : "true");
    }
    if (mi.dataset.mirror) {
      var own = document.querySelector('[data-cmd="' + CSS.escape(mi.dataset.mirror) + '"]');
      if (own) {
        own.setAttribute("aria-pressed", own.getAttribute("aria-pressed") === "true" ? "false" : "true");
        mi.setAttribute("aria-checked", own.getAttribute("aria-pressed"));
      }
    }
    if (mi.dataset.proxy && !mi.dataset.cmd) {
      var owner = document.querySelector('[data-cmd="' + CSS.escape(mi.dataset.proxy) + '"]');
      if (owner && owner !== mi) { closeAll(null); owner.click(); return; }
    }
    if (!effect(id, mi)) echo(labelOf(mi));
    if (!mi.dataset.radio && !mi.dataset.check) closeAll(null);
    saveState.touch();
    dismissSnack();
    return;
  }
  /* 5. a border pattern */
  var bd = e.target.closest(".bd");
  if (bd) {
    $$(".bd", bd.closest(".pop")).forEach(function (n) { n.setAttribute("aria-checked", String(n === bd)); });
    echo(bd.getAttribute("aria-label"));
    closeAll(null);
    return;
  }
  /* 6. a chrome action */
  var act = e.target.closest("[data-act]");
  if (act) { handleAct(act, e); return; }
  /* 7. a toolbar control or any other command node */
  var cmdNode = e.target.closest("[data-cmd], [data-proxy]");
  if (cmdNode) {
    if (cmdNode.classList.contains("tb") && cmdNode.hasAttribute("aria-pressed")) {
      var on = cmdNode.getAttribute("aria-pressed") !== "true";
      cmdNode.setAttribute("aria-pressed", String(on));
      /* a verb drawn twice is one command: the menu row showing the same
         state has to move with it */
      $$('[data-mirror="' + CSS.escape(cmdNode.dataset.cmd || "") + '"]').forEach(function (n) {
        n.setAttribute("aria-checked", String(on));
      });
    }
    var cid = cmdNode.dataset.cmd || cmdNode.dataset.proxy;
    if (cmdNode.dataset.proxy && !cmdNode.dataset.cmd) {
      var own2 = document.querySelector('[data-cmd="' + CSS.escape(cmdNode.dataset.proxy) + '"]');
      if (own2 && own2 !== cmdNode) { own2.click(); return; }
    }
    if (!effect(cid, cmdNode)) echo(cmdNode.getAttribute("aria-label") || cid);
    saveState.touch();
  }
});

function handleAct(node, e) {
  var a = node.dataset.act;
  if (a === "star") {
    var on = node.getAttribute("aria-pressed") !== "true";
    node.setAttribute("aria-pressed", String(on));
    echo(on ? "Starred" : "Unstarred");
  } else if (a === "move") {
    snack("Moved to “Finance / FY26”", "Undo", function () { echo("Move undone"); });
  } else if (a === "theme") {
    openPop(node, POPS.theme, { depth: 0 });
  } else if (a === "gaps") {
    var g = root.getAttribute("data-gaps") === "1";
    root.setAttribute("data-gaps", g ? "0" : "1");
    node.setAttribute("aria-pressed", String(!g));
    echo(g ? "Coverage legend off" : "Coverage legend on — outlined controls have no command id yet");
  } else if (a === "finder") {
    finderPop.repaint("");
    openPop(node, finderPop, { depth: 0, focusFirst: false });
    finderPop.field.value = "";
    finderPop.field.focus();
  } else if (a === "names") {
    openPop(node, POPS.names, { depth: 0 });
  } else if (a === "stats") {
    openPop(node, POPS.stats, { depth: 0 });
  } else if (a === "all-sheets") {
    openPop(node, sheetListPop(), { depth: 0 });
  } else if (a === "add-sheet") {
    sheets.add();
  } else if (a === "explore") {
    openPanel("explore", node);
  } else if (a === "import-report") {
    openPanel("import", node);
  } else if (a === "version-history" || a === "comment-history" || a === "share") {
    var owner = document.querySelector('[data-cmd="' + CSS.escape(node.dataset.proxy) + '"]');
    if (owner) owner.click();
  } else if (a === "account") {
    snack("Sam Okonkwo · sam@example.internal", null, null);
  } else if (a === "panel-close") {
    closePanel();
  } else if (a === "zoom-in") { stepZoom(1); }
  else if (a === "zoom-out") { stepZoom(-1); }
  else if (a === "zoom-reset") { setZoom(100); }
  else if (a === "fx-expand") {
    var fb = $(".formulabar");
    var open = fb.getAttribute("data-expanded") === "1";
    fb.setAttribute("data-expanded", open ? "0" : "1");
    node.setAttribute("aria-expanded", String(!open));
    grid.refit();
  } else if (a === "fx-cancel") {
    grid.repaintSelection(); mode("Ready"); echo("Entry cancelled");
  } else if (a === "fx-accept") {
    mode("Ready"); saveState.touch(); echo("Entry committed");
    $$('[data-act="fx-cancel"],[data-act="fx-accept"]').forEach(function (n) { n.disabled = true; });
  } else if (a === "docname") {
    startRename();
  }
}

/* sheet strip menus ------------------------------------------------------- */
var sheetListPopNode = null;
function sheetListPop() {
  if (!sheetListPopNode) { sheetListPopNode = el("div", "pop"); sheetListPopNode.setAttribute("role", "menu");
    sheetListPopNode.setAttribute("aria-label", "All sheets"); store.appendChild(sheetListPopNode); }
  sheetListPopNode.textContent = "";
  sheetListPopNode.appendChild(el("div", "mi-head", "All sheets"));
  sheets.list().forEach(function (s) {
    var row = makeRow({ label: s.name, cmd: "sheet.goto." + s.index, radio: "sheet",
                        checked: s.active, icon: "sheet" }, "All sheets");
    row.dataset.gotoSheet = String(s.index);
    sheetListPopNode.appendChild(row);
  });
  return sheetListPopNode;
}
var sheetMenuNode = null;
function sheetMenu(index) {
  if (!sheetMenuNode) { sheetMenuNode = el("div", "pop"); sheetMenuNode.setAttribute("role", "menu");
    sheetMenuNode.setAttribute("aria-label", "Sheet options"); store.appendChild(sheetMenuNode); }
  sheetMenuNode.textContent = "";
  [{ label: "Rename", icon: "rename", act: "rename" },
   { label: "Duplicate", icon: "copy", act: "duplicate" },
   { label: "Change colour", icon: "fillcolor", act: "colour" },
   { label: "Hide sheet", icon: "hidden", act: "hide" },
   { sep: true },
   { label: "Delete", icon: "delrow", act: "delete", danger: 1 }
  ].forEach(function (it) {
    if (it.sep) { sheetMenuNode.appendChild(el("div", "mi-sep")); return; }
    var b = el("button", "mi");
    b.type = "button";
    b.setAttribute("role", "menuitem");
    if (it.danger) b.dataset.danger = "1";
    b.setAttribute("data-tip", it.label);
    var g = el("span", "mi-gutter");
    g.appendChild(icon(it.icon, "ic"));
    b.appendChild(g);
    b.appendChild(el("span", "mi-label", it.label));
    b.appendChild(el("span", "mi-key", ""));
    b.appendChild(el("span", "mi-sub"));
    b.addEventListener("click", function () {
      closeAll(null);
      if (it.act === "delete") sheets.remove(index);
      else if (it.act === "rename") {
        var name = prompt("Rename sheet", sheets.list()[index].name);
        if (name) { sheets.rename(index, name); echo("Sheet renamed"); }
      } else if (it.act === "duplicate") { sheets.add(); }
      else echo(it.label);
    });
    sheetMenuNode.appendChild(b);
  });
  return sheetMenuNode;
}
$('[data-role="stabs"]').addEventListener("click", function (e) {
  var m = e.target.closest("[data-sheet-menu]");
  if (m) { e.stopPropagation(); openPop(m, sheetMenu(+m.dataset.sheetMenu), { depth: 0 }); return; }
  var t = e.target.closest(".stab");
  if (t) sheets.activate(+t.dataset.sheet);
});
document.addEventListener("click", function (e) {
  var g = e.target.closest("[data-goto-sheet]");
  if (g) { sheets.activate(+g.dataset.gotoSheet); closeAll(null); }
}, true);

/* the document title: click to rename in place, Enter or blur commits ------ */
var docName = $('[data-role="docname"]'), docRename = $('[data-role="docrename"]');
function startRename() {
  docRename.value = docName.textContent;
  docName.hidden = true; docRename.hidden = false;
  docRename.focus(); docRename.select();
}
docName.addEventListener("click", startRename);
function commitRename(save) {
  if (save && docRename.value.trim()) docName.textContent = docRename.value.trim();
  docRename.hidden = true; docName.hidden = false;
  if (save) { saveState.touch(); echo("Renamed"); }
}
docRename.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); commitRename(true); docName.focus(); }
  if (e.key === "Escape") { e.stopPropagation(); commitRename(false); docName.focus(); }
});
docRename.addEventListener("blur", function () { if (!docRename.hidden) commitRename(true); });

/* ===========================================================================
   18. COMPACT CONTROLS
   64px of chrome height back to the grid. It IS a grid resize, so it takes
   the panel's contract: the bands animate, and resize() runs exactly once,
   at transitionend, never per frame.
   The chord is Ctrl+F1, and ONLY Ctrl+F1. This chrome's source binds
   Ctrl+Shift+F; the shipped editor already spends that chord on Format Cells
   and argues at webapp/editor.core.js:8461-8469 why rebinding it again is
   worse than a missing chord, so docs/93 §11.1 refuses it. The ribbon chrome
   takes Ctrl+F1 for the same verb (docs/91 §7.2) — one verb, one chord,
   across two chromes, which is a better outcome than either chrome matching
   its own source.
   =========================================================================== */
function toggleCompact() {
  var on = root.getAttribute("data-compact") === "1";
  root.setAttribute("data-compact", on ? "0" : "1");
  $$('[data-cmd="view.compact-controls"]').forEach(function (n) {
    n.setAttribute("aria-checked", String(!on));
  });
  echo(on ? "Controls restored" : "Compact controls — Ctrl+F1 to bring them back");
  var band = $(".menubar");
  var settle = function () { band.removeEventListener("transitionend", settle); grid.refit(); reflowToolbar(); };
  band.addEventListener("transitionend", settle);
  setTimeout(settle, 300);
}

/* ===========================================================================
   19. KEYBOARD
   F6 cycles the chrome's regions; the toolbar is ONE composite tab stop with
   a roving tabindex, so a control parked in a closed flyout never becomes a
   stray stop; Alt arms the menu bar and underlines its mnemonics.
   =========================================================================== */
var REGIONS = ["menubar", "toolbar", "formulabar", "grid", "panel", "bottombar", "appbar"];
function regionNode(name) {
  if (name === "panel") return panelEl.hidden ? null : panelEl;
  return document.querySelector('[data-region="' + name + '"]');
}
function focusRegion(name) {
  var host = regionNode(name);
  if (!host) return false;
  var target = host.dataset.lastFocus && host.querySelector('[data-stop="' + host.dataset.lastFocus + '"]');
  if (!target) target = host.matches("[tabindex]") ? host
    : host.querySelector('button:not([disabled]), input, select, [tabindex]:not([tabindex="-1"])');
  if (!target) return false;
  if (target.tabIndex < 0 && target !== host) target.tabIndex = 0;
  target.focus();
  echo(name.replace("bar", " bar").replace("^.", ""));
  return true;
}
function cycleRegion(dir) {
  var here = document.activeElement && document.activeElement.closest("[data-region]");
  var i = here ? REGIONS.indexOf(here.dataset.region) : -1;
  for (var n = 1; n <= REGIONS.length; n++) {
    var j = (i + dir * n + REGIONS.length * 2) % REGIONS.length;
    if (focusRegion(REGIONS[j])) return;
  }
}
/* One tab stop for the whole toolbar. items() filters on offsetParent, so a
   control inside a folded group or a closed flyout is not in the ring. */
function tbItems() {
  return $$(".tb, .combo input, .chip", toolbar).filter(function (n) {
    return !n.disabled && n.offsetParent !== null;
  });
}
function syncStops() {
  $$("button, input, select", toolbar).forEach(function (n) { n.tabIndex = -1; });
  var items = tbItems();
  if (items.length) items[0].tabIndex = 0;
}
toolbar.addEventListener("keydown", function (e) {
  var items = tbItems();
  var i = items.indexOf(document.activeElement);
  if (i < 0) return;
  if (document.activeElement.tagName === "INPUT" &&
      (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;   /* the field keeps its own */
  var n = -1;
  if (e.key === "ArrowRight") n = (i + 1) % items.length;
  if (e.key === "ArrowLeft")  n = (i - 1 + items.length) % items.length;
  if (e.key === "Home") n = 0;
  if (e.key === "End")  n = items.length - 1;
  if (n >= 0) {
    e.preventDefault();
    items.forEach(function (x) { x.tabIndex = -1; });
    items[n].tabIndex = 0; items[n].focus();
    return;
  }
  if (e.key === "ArrowDown" && document.activeElement.hasAttribute("aria-haspopup")) {
    e.preventDefault(); document.activeElement.click();
  }
});
/* menu-bar roving tabindex: exactly one 0 in the bar at all times */
function focusTop(b) {
  menuTops.forEach(function (t) { t.tabIndex = t === b ? 0 : -1; });
  b.focus();
}
menubar.addEventListener("keydown", function (e) {
  var i = menuTops.indexOf(document.activeElement);
  if (i < 0) return;
  var n = -1;
  if (e.key === "ArrowRight") n = (i + 1) % menuTops.length;
  if (e.key === "ArrowLeft")  n = (i - 1 + menuTops.length) % menuTops.length;
  if (e.key === "Home") n = 0;
  if (e.key === "End")  n = menuTops.length - 1;
  if (n >= 0) {
    e.preventDefault(); focusTop(menuTops[n]);
    if (openStack.length) openMenu(MENUS[n], true);
    return;
  }
  if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") {
    e.preventDefault(); openMenu(MENUS[i], false);
  }
});
/* inside an open menu */
document.addEventListener("keydown", function (e) {
  if (!openStack.length) return;
  var top = openStack[openStack.length - 1];
  var rows = $$(".mi", top.pop).filter(function (n) {
    return n.getAttribute("aria-disabled") !== "true" && n.offsetParent !== null;
  });
  if (e.key === "Escape") {
    e.stopPropagation(); e.preventDefault();
    closeFrom(openStack.length - 1, top.trigger);
    return;
  }
  if (!rows.length) return;
  var i = rows.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); rows[(i + 1 + rows.length) % rows.length].focus(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); rows[(i - 1 + rows.length) % rows.length].focus(); }
  else if (e.key === "Home") { e.preventDefault(); rows[0].focus(); }
  else if (e.key === "End") { e.preventDefault(); rows[rows.length - 1].focus(); }
  else if (e.key === "ArrowRight" && i >= 0 && rows[i].dataset.subFor) { e.preventDefault(); rows[i].click(); }
  else if (e.key === "ArrowLeft" && openStack.length > 1) {
    e.preventDefault(); closeFrom(openStack.length - 1, top.trigger);
  } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    /* at the root, sideways moves between menus — instantly */
    var mi2 = menuTops.indexOf(openStack[0].trigger);
    if (mi2 < 0) return;
    e.preventDefault();
    var d = e.key === "ArrowRight" ? 1 : -1;
    var nx = (mi2 + d + menuTops.length) % menuTops.length;
    focusTop(menuTops[nx]);
    openMenu(MENUS[nx], true);
  }
}, true);

/* global chords ---------------------------------------------------------- */
var altArmed = false;
document.addEventListener("keydown", function (e) {
  if (e.key === "Alt" && !e.ctrlKey && !e.metaKey) { altArmed = true; root.setAttribute("data-alt", "1"); return; }
  if (e.key !== "Alt") altArmed = false;

  var k = (e.key || "").toLowerCase();
  var mod = e.ctrlKey || e.metaKey;

  if (e.key === "F6") { e.preventDefault(); cycleRegion(e.shiftKey ? -1 : 1); return; }
  if (e.key === "Escape") {
    if (openDlg) { e.preventDefault(); closeDialog(true); return; }
    if (openStack.length) { e.preventDefault(); closeAll(null); return; }
    if (activePanel) { e.preventDefault(); closePanel(); return; }
    if (liveSnack) { dismissSnack(); return; }
    return;
  }
  if (mod && e.key === "F1") { e.preventDefault(); toggleCompact(); return; }
  if (mod && k === "/") { e.preventDefault(); openDialog("shortcuts", null); return; }
  if ((e.altKey && k === "/") || (mod && k === "k")) {
    e.preventDefault();
    handleAct($('[data-act="finder"]'), e);
    return;
  }
  if (mod && !e.shiftKey && (k === "b" || k === "i" || k === "u")) {
    var id = k === "b" ? "toolbar.bold" : k === "i" ? "toolbar.italic" : "toolbar.underline";
    e.preventDefault(); runCommand(id); return;
  }
  if (mod && k === "p") { e.preventDefault(); runCommand("file.print"); return; }
  if (e.altKey && !mod && k.length === 1) {
    for (var i = 0; i < MENUS.length; i++) {
      if (MENUS[i].key.toLowerCase() === k) {
        e.preventDefault();
        /* Alt+letter while compact un-compacts FIRST and opens on the next
           frame: anchoring a menu to a display:none button measures 0x0 and
           drops the panel in the window's corner. */
        if (root.getAttribute("data-compact") === "1") {
          toggleCompact();
          requestAnimationFrame(function () { focusTop(MENUS[i].btn); openMenu(MENUS[i], false); });
        } else { focusTop(MENUS[i].btn); openMenu(MENUS[i], false); }
        return;
      }
    }
  }
});
document.addEventListener("keyup", function (e) {
  if (e.key === "Alt") {
    root.removeAttribute("data-alt");
    if (altArmed && !openStack.length) { focusTop(menuTops[0]); }
    altArmed = false;
  }
});

/* ===========================================================================
   20. BOOT
   =========================================================================== */
applySwatch("font", ramp(0, 1));
applySwatch("fill", ramp(42, 4));
$$('[data-swatch-for]').forEach(function (n) { n.setAttribute("aria-checked", "false"); });
presence.render();
sheets.render();
sheets.activate(0);
setZoom(100);
syncThemeIcon();
/* The layout resolves BEFORE first paint and without going through
   setLayout(): §12.5's rule is that a wrong layout for one frame is a
   140 <-> 196 px band jump and a canvas reallocation, not a colour flash, so
   boot ticks the radio and stamps the root and does nothing else — no focus
   move, no snackbar, no announcement for a choice the user did not just make. */
(function bootLayout() {
  var pref = layoutPref();
  root.setAttribute("data-layout", resolveLayout(pref));
  $$('[data-cmd^="view.layout."]').forEach(function (n) {
    n.setAttribute("aria-checked", String(n.dataset.cmd === "view.layout." + pref));
  });
})();
syncStops();
reflowToolbar();
mode("Ready");
saveState.set("All changes saved", { tip: "Saved to this device a moment ago" });
setTimeout(function () { $('[data-role="savestate"]').setAttribute("data-collapsed", "1"); }, 2600);
grid.setRemote(presence.people[0].name, presence.people[0].hue, presence.people[0].cell);
menuTops[0].tabIndex = 0;
window.addEventListener("resize", function () {
  panelScrim.hidden = !(activePanel && window.innerWidth <= 1023);
  grid.refit();
});

/* ===========================================================================
   21. THE SURFACE THE NEXT PASSES BUILD ON
   =========================================================================== */
window.SHEETS = {
  /* popups and menus */
  openPop: openPop, closeAll: closeAll, POPS: POPS, makeRow: makeRow, makeMenu: makeMenu,
  store: store, icon: icon, el: el,
  /* commands */
  runCommand: runCommand, listCommands: listCommands, menuModel: menuModel, has: has,
  /* surfaces */
  registerPanel: registerPanel, openPanel: openPanel, closePanel: closePanel, panels: PANELS,
  registerDialog: function (name, build) { DIALOGS[name] = build; },
  openDialog: openDialog, closeDialog: closeDialog,
  snack: snack, dismissSnack: dismissSnack, echo: echo,
  /* model */
  grid: grid, sheets: sheets, presence: presence, saveState: saveState,
  setTheme: setTheme, setZoom: setZoom, toggleCompact: toggleCompact,
  reflowToolbar: reflowToolbar, syncStops: syncStops,
  foldState: function () { return foldState.slice(); },
  models: { menus: MENUS, toolbar: TB, groups: GROUPS }
};
})();
</script>
</body>
