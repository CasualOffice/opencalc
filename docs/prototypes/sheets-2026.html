<!doctype html>
<html lang="en" data-compact="0" data-gaps="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCalc — Sheets 2026 prototype</title>
<!--
  ============================================================================
  OpenCalc editor chrome — Google-Sheets-shaped "toolbar" chrome prototype
  ============================================================================
  Standalone, single file, no build step, no network request of any kind.
  Open it by double-clicking from disk.

  PASS 1 of 3 delivers: the token layer, the window shell, the control system,
  the app bar, the complete menu bar, the complete toolbar with its authored
  fold ladder, the formula bar, a live grid, the bottom bar, and the JS
  foundation (popup controller, grid selection model, theme, gap legend,
  snackbar, dialog host, panel host).

  Seams the later passes extend are marked
      SEAM: ...

  CONVENTIONS THIS FILE ENFORCES (a later pass must keep them):

  * THE ASSIGNMENT IS DATA, NOT MARKUP. The menu tree and the toolbar row are
    two JSON blocks (#menu-model, #toolbar-model) consumed by one builder, so
    a placement change is a one-line reviewable diff and a typo'd id is a
    build failure rather than a silently missing control. This mirrors the way
    webapp/editor.core.js:9611's MENUS literal feeds buildMenuBar().

  * EXACTLY ONE NODE OWNS A COMMAND ID. Every other drawing of the same verb
    carries data-proxy="<id>" and clicks the owner. Ids are slugified from the
    English label path in the real editor (webapp/editor.selection.js:1015)
    and BOTH the capability table (editor.core.js:1336) and the read-only
    whitelist (editor.core.js:4993) match them BY REGEX, so re-deriving an id
    for a regrouped menu is a security change, not a naming one.

  * NO NEW `tb-` PREFIXED ELEMENT IDS. The real editor's boot sweep stamps
    every [id^='tb-'] node as a command (editor.core.js:11019).

  * Controls the assignment marks status:"gap" carry data-gap="1". The gap
    legend in the app bar outlines them, so "what does this build not have
    yet" reads at a glance instead of living in a spreadsheet.

  * ONE ICON SYSTEM: a 16-unit viewBox, fill:none, stroke:currentColor,
    stroke-width 1.4, round caps and joins. Every glyph in this file was
    drawn for it. Nothing is traced from another vendor's artwork.

  * NO COLOUR LITERAL, DURATION OR EASING OUTSIDE THE THREE TOKEN BLOCKS —
    :root, the explicit dark theme, and the prefers-color-scheme fallback —
    which sit inside one fence whose markers are the words TOKENS:BEGIN and
    TOKENS:END in CSS comments. The fence exists so the rule can be CHECKED
    rather than believed: search for a hex triple, an rgb()/hsl() call, a
    millisecond value or a cubic-bezier outside it and the answer must be
    empty. One further fence, CONTENT-COLOUR:BEGIN / :END, holds the three
    generators that compose the user's DOCUMENT colours (the swatch ramp and
    a sheet tab's colour). Those are the user's choices, not the chrome's
    palette, no theme redefines them, and nothing in the chrome may call
    them. Note that this paragraph names the markers WITHOUT their CSS
    comment delimiters, so a search for the delimited fence lands on the real
    thing and only on it. That is deliberate: the first version of this
    comment quoted the fences verbatim, an indexOf() found the quotation
    instead, and the check silently measured the wrong region of the file and
    passed. A gate that reads its own documentation is not a gate.

  THE DESIGN IN ONE PARAGRAPH. Four bands totalling 140px above the grid and
  175px overall — lighter than the shipped chrome (162/197) and lighter than
  the ribbon's Simplified default (144/179). The look comes from tone and
  elevation rather than borders: the app bar, menu bar and toolbar band share
  one tonal ground, the toolbar's rounded container lifts once off it, and
  every control inside that container TINTS rather than lifting. Three of the
  five hairlines above the grid disappear into that tonal step; only the
  formula bar's survives, because on both sides of it the surface is white.
-->
<style>
/* ==========================================================================
   1. TOKENS
   Everything downstream reads these. The dark theme redefines TOKENS ONLY:
   there is not one selector below this block that changes between themes.
   ========================================================================== */
/* TOKENS:BEGIN */
:root {
  color-scheme: light;

  /* --- brand -------------------------------------------------------------
     ONE accent. In the product this is --oc-accent-color, the single
     host-swappable token; ADR-026 rules that any large branded surface fills
     with it and never with a hard-coded vendor colour, and
     tests/browser/editor.branding.spec.mjs:57 boots with ?brand=Ledgerly to
     prove no region of the chrome names a product. The prototype ships a
     green accent because that is what the chrome it is modelled on reads
     like; swapping this one value re-brands the entire chrome. */
  --accent:            #0b8043;
  --accent-bright:     #12a55a;   /* the lighter end of the mark's ramp      */
  --accent-hover:      #0a6f3a;
  --accent-pressed:    #085c30;
  --accent-on-soft:    #0a6f3a;   /* label/glyph ON a tonal container: 5.1:1 */
  --on-accent:         #ffffff;
  --accent-soft:       color-mix(in srgb, var(--accent) 15%, #ffffff);
  --accent-soft-hover: color-mix(in srgb, var(--accent) 24%, #ffffff);
  --accent-soft-press: color-mix(in srgb, var(--accent) 32%, #ffffff);
  --accent-ring:       color-mix(in srgb, var(--accent) 34%, transparent);

  /* --- tonal surface levels ----------------------------------------------
     ground < container is the whole visual idea. The step is deliberately
     small (about 1.04:1) and is therefore NEVER the only signal: the
     container also carries radius and one elevation. prefers-contrast:more
     restores a real outline on it, further down. */
  --bg-ground:         #f2f5f8;   /* app bar + menu bar + toolbar band       */
  --bg-container:      #ffffff;   /* the toolbar's rounded strip             */
  --bg-canvas:         #ffffff;   /* formula bar, grid, bottom bar           */
  --bg-raised:         #ffffff;   /* menus, popovers, panels, dialogs        */
  --bg-sunken:         #eef1f5;   /* inputs and search fields                */
  --bg-inverse:        #202124;   /* snackbar and tooltip ground             */
  --fg-inverse:        #f1f3f4;

  /* --- interaction fills -------------------------------------------------
     A control inside the container TINTS. It does not lift: if the container
     lifts and its buttons lift too, the container stops reading as a
     surface. --oc-elevation-raised is spent once, on the strip. */
  --fill-hover:        #eceff3;
  --fill-press:        #dfe3e9;
  --fill-hover-ground: #e4e9ef;   /* hover for a control ON the ground       */
  --fill-press-ground: #d7dde5;
  /* Hover tint for a control that paints itself in its OWN inherited colour
     — today only the snackbar action, which sits on an inverted surface where
     none of the fills above are legible. It is theme-INDEPENDENT on purpose:
     currentColor is already whatever the theme resolved, so the two themes
     differ here without the token being redefined, exactly as --dur-* and
     --r-* are defined once. It lives in the fence because the fence's rule is
     that no colour is COMPUTED outside it, and color-mix() is a computation
     wherever it is written. */
  --tint-on-current:   color-mix(in srgb, currentColor 14%, transparent);

  /* --- strokes ----------------------------------------------------------- */
  --stroke-1:          #dadce0;   /* band hairlines, control outlines        */
  --stroke-2:          #e7eaee;   /* toolbar group rules, soft dividers      */
  --stroke-hover:      #b6bcc4;

  /* --- foregrounds ------------------------------------------------------- */
  --fg-1:              #1f1f1f;   /* primary text, active glyph              */
  --fg-2:              #444746;   /* icon at rest                            */
  --fg-3:              #5f6368;   /* secondary text, captions                */
  --fg-disabled:       #878d93;   /* 3.2:1 on the ground — disabled is still
                                     readable, which is the state that
                                     usually fails an audit                  */

  /* --- semantic ---------------------------------------------------------- */
  --danger:            #c5221f;
  --warning:           #a8630a;
  --gap-stroke:        #a8630a;   /* the coverage legend outline             */
  --gap-tint:          color-mix(in srgb, #a8630a 10%, transparent);

  /* --- grid --------------------------------------------------------------- */
  --grid-line:         #dde1e6;
  --grid-head-bg:      #f6f8fa;
  --grid-head-hot:     color-mix(in srgb, var(--accent) 12%, #f6f8fa);
  --grid-head-fg:      #5f6368;
  --grid-sel-fill:     color-mix(in srgb, var(--accent) 8%, transparent);
  --grid-total-bg:     #f7f9fa;
  --viz-bar:           color-mix(in srgb, var(--accent) 30%, transparent);
  --viz-bar-neg:       color-mix(in srgb, #c5221f 26%, transparent);
  --viz-hi:            color-mix(in srgb, var(--accent) 26%, transparent);
  --viz-mid:           color-mix(in srgb, #eab308 30%, transparent);
  --viz-lo:            color-mix(in srgb, #c5221f 22%, transparent);
  --note-tint:         color-mix(in srgb, #eab308 22%, transparent);

  /* --- direct manipulation on the grid -------------------------------------
     A resize preview, a reorder drop indicator and a freeze divider are three
     different promises and must not share one colour. The guide is the
     ACCENT because it says "this is where it lands"; the freeze divider is a
     NEUTRAL heavier than a gridline because it is a persistent property of
     the sheet rather than a transient preview, and an accent-coloured
     permanent line competes with the selection for the same meaning. */
  --grid-guide:        var(--accent);
  --grid-freeze:       #9aa0a6;
  --grid-freeze-hot:   var(--accent);
  --ghost-bg:          color-mix(in srgb, var(--accent) 14%, #ffffff);
  --ghost-stroke:      color-mix(in srgb, var(--accent) 55%, transparent);
  --frozen-shadow:     rgba(31,31,31,.16);

  /* --- presence: five hues, assigned on join ------------------------------ */
  --p1: #d93025; --p2: #1a73e8; --p3: #9334e6; --p4: #e37400; --p5: #12a55a;

  /* --- elevation. TWO, and only two. ------------------------------------- */
  --sh-raised:  0 1px 2px rgba(31,31,31,.07), 0 0 1px rgba(31,31,31,.08);
  --sh-overlay: 0 1px 3px rgba(31,31,31,.24), 0 4px 12px rgba(31,31,31,.13);
  --scrim:      rgba(31,31,31,.32);

  /* --- typography --------------------------------------------------------- */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-title:  14px;   /* the document name                                   */
  --fs-menu:   13px;   /* menu-bar labels and menu rows                       */
  --fs-ctl:  12.5px;   /* combo values, 123 readout, sheet tabs               */
  --fs-small:11.5px;   /* save state, status bar                              */
  --fw-reg: 400; --fw-med: 500; --fw-semi: 600;

  /* --- geometry ----------------------------------------------------------- */
  --h-appbar:   36px;  /* 2 + 32 (.tb-icon) + 2, no hairline                  */
  --h-menubar:  28px;  /* 2 + 24 (label box) + 2, no hairline                 */
  --h-toolbar:  40px;  /* 4 + 32 (container) + 4, no hairline                 */
  --h-formula:  35px;  /* + 1px hairline = 36                                 */
  --h-bottom:   34px;  /* + 1px hairline = 35                                 */
  --h-ctl:      28px;  /* the asserted pointer floor for a toolbar button     */
  --h-icon:     32px;  /* .tb-icon: the app bar's control box                 */
  --h-row:      25px;  /* a menu row with a mouse (44 under a coarse pointer) */
  --icon:       16px;
  --caret:      14px;  /* the caret half of a split button                    */
  --bar-inset:   4px;  /* container inset inside the 40px band                */
  --gap-ctl:     4px;  /* 28 + 4 = the 32px per-button pitch                  */
  --gap-grp:     6px;  /* 6 | 1px rule | 6 = the 13px boundary budget         */
  --row-h:      21px;  /* one grid row                                        */
  --panel-w:   320px;

  /* --- radii. Five values, no sixth. -------------------------------------- */
  --r-ctl:     3px;    /* any toolbar control <= 32px                         */
  --r-row:     6px;    /* menu rows, menu-bar labels, sheet tabs              */
  --r-icon:    8px;    /* .tb-icon, snackbar                                  */
  --r-pop:    12px;    /* menus, popovers, pickers, dialogs                   */
  --r-bar:    16px;    /* the toolbar container: half of 32 = a full pill     */
  --r-pill:  999px;    /* the Share pill, avatars, chips                      */

  /* --- motion ------------------------------------------------------------
     Durations and easings are Material 3's, taken from the AndroidX
     MotionTokens source. Entering uses a decelerate curve and the longer
     duration; exiting uses an accelerate curve and about half the time. */
  --dur-0:   0ms;      /* press-in, selection, anything on the grid's path   */
  --dur-1: 100ms;      /* hover in, press out                                */
  --dur-2: 140ms;      /* caret rotation, small crossfade, menu exit         */
  --dur-3: 160ms;      /* menu / popover / picker open                       */
  --dur-4: 220ms;      /* snackbar, avatar join, compact controls            */
  --dur-6: 300ms;      /* the side panel and the grid meeting it             */
  --ease-standard: cubic-bezier(.4, 0, .2, 1);
  --ease-decel:    cubic-bezier(.05, .7, .1, 1);
  --ease-accel:    cubic-bezier(.3, 0, .8, .15);
  --ease-emphasis: cubic-bezier(.2, 0, 0, 1);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --accent:            #57c98a;
  --accent-bright:     #7fdca7;
  --accent-hover:      #6ed69a;
  --accent-pressed:    #48b87a;
  --accent-on-soft:    #9ee8bb;
  --on-accent:         #08210f;
  --accent-soft:       color-mix(in srgb, var(--accent) 22%, #1e2126);
  --accent-soft-hover: color-mix(in srgb, var(--accent) 30%, #1e2126);
  --accent-soft-press: color-mix(in srgb, var(--accent) 38%, #1e2126);
  --accent-ring:       color-mix(in srgb, var(--accent) 40%, transparent);

  --bg-ground:         #16181d;
  --bg-container:      #1e2126;
  --bg-canvas:         #101216;
  --bg-raised:         #22262c;
  --bg-sunken:         #191c21;
  --bg-inverse:        #e6e8eb;
  --fg-inverse:        #16181d;

  --fill-hover:        #292d34;
  --fill-press:        #343941;
  --fill-hover-ground: #22262c;
  --fill-press-ground: #2c3138;

  --stroke-1:          #333840;
  --stroke-2:          #272b31;
  --stroke-hover:      #4a5058;

  --fg-1:              #e3e5e8;
  --fg-2:              #b6bcc4;
  --fg-3:              #969ca4;
  --fg-disabled:       #6b7076;   /* 3.4:1 on the dark ground                */

  --danger:            #f28b82;
  --warning:           #e8a33d;
  --gap-stroke:        #e8a33d;
  --gap-tint:          color-mix(in srgb, #e8a33d 13%, transparent);

  --grid-line:         #2c3138;
  --grid-head-bg:      #171a1f;
  --grid-head-hot:     color-mix(in srgb, var(--accent) 16%, #171a1f);
  --grid-head-fg:      #969ca4;
  --grid-sel-fill:     color-mix(in srgb, var(--accent) 12%, transparent);
  --grid-total-bg:     #161a1f;
  --viz-bar:           color-mix(in srgb, var(--accent) 30%, transparent);
  --viz-bar-neg:       color-mix(in srgb, #f28b82 26%, transparent);
  --viz-hi:            color-mix(in srgb, var(--accent) 28%, transparent);
  --viz-mid:           color-mix(in srgb, #eab308 26%, transparent);
  --viz-lo:            color-mix(in srgb, #f28b82 22%, transparent);
  --note-tint:         color-mix(in srgb, #eab308 18%, transparent);
  /* Not an inversion: the divider LIGHTENS relative to its gridline exactly
     as it darkened in light, and the ghost mixes toward the dark canvas so it
     stays a lift rather than becoming a hole. The frozen-pane shadow gets
     deeper, because on a dark ground a soft shadow reads as nothing at all. */
  --grid-guide:        var(--accent);
  --grid-freeze:       #7c848d;
  --grid-freeze-hot:   var(--accent);
  --ghost-bg:          color-mix(in srgb, var(--accent) 22%, #1f242b);
  --ghost-stroke:      color-mix(in srgb, var(--accent) 62%, transparent);
  --frozen-shadow:     rgba(0,0,0,.55);

  --p1: #f28b82; --p2: #8ab4f8; --p3: #c58af9; --p4: #fcad70; --p5: #7fdca7;

  --sh-raised:  0 1px 2px rgba(0,0,0,.44), 0 0 1px rgba(0,0,0,.5);
  --sh-overlay: 0 1px 3px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.5);
  --scrim:      rgba(0,0,0,.55);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --accent:            #57c98a;
    --accent-bright:     #7fdca7;
    --accent-hover:      #6ed69a;
    --accent-pressed:    #48b87a;
    --accent-on-soft:    #9ee8bb;
    --on-accent:         #08210f;
    --accent-soft:       color-mix(in srgb, var(--accent) 22%, #1e2126);
    --accent-soft-hover: color-mix(in srgb, var(--accent) 30%, #1e2126);
    --accent-soft-press: color-mix(in srgb, var(--accent) 38%, #1e2126);
    --accent-ring:       color-mix(in srgb, var(--accent) 40%, transparent);
    --bg-ground:         #16181d;
    --bg-container:      #1e2126;
    --bg-canvas:         #101216;
    --bg-raised:         #22262c;
    --bg-sunken:         #191c21;
    --bg-inverse:        #e6e8eb;
    --fg-inverse:        #16181d;
    --fill-hover:        #292d34;
    --fill-press:        #343941;
    --fill-hover-ground: #22262c;
    --fill-press-ground: #2c3138;
    --stroke-1:          #333840;
    --stroke-2:          #272b31;
    --stroke-hover:      #4a5058;
    --fg-1:              #e3e5e8;
    --fg-2:              #b6bcc4;
    --fg-3:              #969ca4;
    --fg-disabled:       #6b7076;
    --danger:            #f28b82;
    --warning:           #e8a33d;
    --gap-stroke:        #e8a33d;
    --gap-tint:          color-mix(in srgb, #e8a33d 13%, transparent);
    --grid-line:         #2c3138;
    --grid-head-bg:      #171a1f;
    --grid-head-hot:     color-mix(in srgb, var(--accent) 16%, #171a1f);
    --grid-head-fg:      #969ca4;
    --grid-sel-fill:     color-mix(in srgb, var(--accent) 12%, transparent);
    --grid-total-bg:     #161a1f;
    --viz-bar:           color-mix(in srgb, var(--accent) 30%, transparent);
    --viz-bar-neg:       color-mix(in srgb, #f28b82 26%, transparent);
    --viz-hi:            color-mix(in srgb, var(--accent) 28%, transparent);
    --viz-mid:           color-mix(in srgb, #eab308 26%, transparent);
    --viz-lo:            color-mix(in srgb, #f28b82 22%, transparent);
    --note-tint:         color-mix(in srgb, #eab308 18%, transparent);
    --grid-guide:        var(--accent);
    --grid-freeze:       #7c848d;
    --grid-freeze-hot:   var(--accent);
    --ghost-bg:          color-mix(in srgb, var(--accent) 22%, #1f242b);
    --ghost-stroke:      color-mix(in srgb, var(--accent) 62%, transparent);
    --frozen-shadow:     rgba(0,0,0,.55);
    --p1: #f28b82; --p2: #8ab4f8; --p3: #c58af9; --p4: #fcad70; --p5: #7fdca7;
    --sh-raised:  0 1px 2px rgba(0,0,0,.44), 0 0 1px rgba(0,0,0,.5);
    --sh-overlay: 0 1px 3px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.5);
    --scrim:      rgba(0,0,0,.55);
  }
}
/* TOKENS:END */

/* ==========================================================================
   2. BASE
   ========================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: var(--fw-reg) var(--fs-menu)/1.45 var(--font-ui);
  color: var(--fg-1);
  background: var(--bg-ground);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;               /* the app owns its own scrolling regions */
}
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
:focus { outline: none; }
::selection { background: var(--accent-soft); }

/* One icon system. 16-unit viewBox, no fill, 1.4 stroke, round joins, so
   every glyph lands on the same optical weight at 1x and 2x. */
.ic { width: var(--icon); height: var(--icon); flex: 0 0 auto; display: block;
      fill: none; stroke: currentColor; stroke-width: 1.4;
      stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 13px; height: 13px; }
.ic-lg { width: 20px; height: 20px; }
.ic text { fill: currentColor; stroke: none; font-family: var(--font-ui);
           text-anchor: middle; font-weight: var(--fw-med); }
.ic .fill { fill: currentColor; stroke: none; }

/* Digits that sit in a column line up. Everywhere, without exception. */
.num, .cell[data-num], .rowhead, .colhead, .namebox, .zoomval, .statval,
.sizefield, .numfmt-read { font-variant-numeric: tabular-nums; }

/* ==========================================================================
   3. WINDOW SHELL
   One flex column. Every band is fixed; the work area is the only thing that
   grows, which is what makes the band arithmetic in the header comment true
   rather than aspirational.
   ========================================================================== */
.app { height: 100vh; display: flex; flex-direction: column; overflow: hidden;
       background: var(--bg-ground); }
.work { flex: 1 1 auto; min-height: 0; display: flex; position: relative;
        background: var(--bg-canvas); }

/* Compact controls (Ctrl+F1) gives 64px back to the grid.
   Height is animated on the BANDS, and resize() runs once at transitionend —
   never per frame. See the JS. */
.appbar, .menubar {
  transition: height var(--dur-4) var(--ease-emphasis),
              opacity var(--dur-2) var(--ease-standard);
}
:root[data-compact="1"] .appbar,
:root[data-compact="1"] .menubar { height: 0; opacity: 0; pointer-events: none; overflow: hidden; }

/* ==========================================================================
   4. THE CONTROL SYSTEM
   Rest / hover / press / focus / checked / mixed / disabled, once, for every
   control class in the chrome. Nothing below re-states a colour.
   ========================================================================== */
.tb {
  height: var(--h-ctl); min-width: var(--h-ctl);
  padding: 0 4px; border-radius: var(--r-ctl);
  display: inline-flex; align-items: center; justify-content: center; gap: 3px;
  color: var(--fg-2); background: transparent; position: relative;
  transition: background var(--dur-1) var(--ease-standard),
              color var(--dur-1) var(--ease-standard);
}
.tb:hover           { background: var(--fill-hover); color: var(--fg-1); }
.tb:active          { background: var(--fill-press); transition-duration: var(--dur-0); }
.tb[aria-expanded="true"] { background: var(--fill-hover); color: var(--fg-1); }
.tb[aria-pressed="true"]  { background: var(--accent-soft); color: var(--accent-on-soft); }
.tb[aria-pressed="true"]:hover  { background: var(--accent-soft-hover); }
.tb[aria-pressed="true"]:active { background: var(--accent-soft-press); }
.tb[aria-pressed="mixed"] { color: var(--accent-on-soft);
                            box-shadow: inset 0 0 0 1px var(--stroke-1); }
.tb[disabled], .tb[aria-disabled="true"] {
  color: var(--fg-disabled); background: transparent; pointer-events: none;
}
/* A ring that fades in is a ring that is absent for the first frame after a
   keypress, and keyboard users arrive at speed. Never transitioned. */
.tb:focus-visible, .mi:focus-visible, .pill:focus-visible, .chip:focus-visible,
.mtop:focus-visible, .stab:focus-visible, .fx-btn:focus-visible,
.sw:focus-visible, .icbtn:focus-visible, .dlg-x:focus-visible,
.snack-act:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
  box-shadow: 0 0 0 4px var(--accent-ring); transition: none; z-index: 5;
}

/* The disclosure caret is DERIVED from the ARIA semantics, so the visual
   signal cannot drift from what assistive technology is told. In the shipped
   editor nine toolbar buttons announce a popup and draw nothing
   (webapp/editor.html:299,:306,:326,:356,:367,:425,:437,:450,:459) against
   one that does (:401); no rule in editor.css targets [aria-haspopup] at all.
   A clip-path triangle, not a rotated square: no fractional-DPR blur. */
.tb[aria-haspopup]::after, .pill[aria-haspopup]::after, .chip::after,
.statbtn[aria-haspopup]::after {
  content: ""; width: 8px; height: 5px; margin-left: 1px; flex: 0 0 auto;
  background: currentColor; opacity: .74;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transition: transform var(--dur-2) var(--ease-standard);
}
.tb[aria-expanded="true"]::after, .chip[aria-expanded="true"]::after,
.statbtn[aria-expanded="true"]::after { transform: rotate(180deg); }
/* A split button's caret half draws it; the primary half must not. */
.split .tb-main::after { content: none; }

/* --- split button: two real buttons in one box -------------------------- */
.split { display: inline-flex; align-items: center; border-radius: var(--r-ctl);
         position: relative; }
.split .tb-main  { border-radius: var(--r-ctl) 0 0 var(--r-ctl); padding-right: 3px; }
.split .tb-caret { border-radius: 0 var(--r-ctl) var(--r-ctl) 0;
                   min-width: var(--caret); width: var(--caret); padding: 0; }
.split .tb-caret::after { margin: 0; }
.split:hover .tb-caret { box-shadow: inset 1px 0 0 var(--stroke-2); }
.split .tb:focus-visible { outline-offset: -1px; }

/* A control that must show a value carries a colour bar under an otherwise
   monochrome glyph. The three that do are the only coloured glyphs here. */
.swatch { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.swatch i { display: block; width: 15px; height: 3px; border-radius: 1px;
            background: var(--swatch, currentColor); }

/* --- combo (font name, font size) --------------------------------------- */
.combo { height: var(--h-ctl); display: inline-flex; align-items: center;
         border-radius: var(--r-ctl); background: transparent;
         box-shadow: inset 0 -1px 0 var(--stroke-1);
         transition: box-shadow var(--dur-1) var(--ease-standard); }
.combo:hover { box-shadow: inset 0 0 0 1px var(--stroke-hover); }
.combo:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.combo input { width: 100%; height: 26px; border: 0; background: transparent;
               font-size: var(--fs-ctl); padding: 0 4px 0 6px; min-width: 0; }
.combo .tb-caret { min-width: var(--caret); width: var(--caret); padding: 0; }
.combo[data-w="font"] { width: 140px; }
.combo[data-w="size"] { width: 48px; }
.combo[data-w="size"] input { text-align: center; padding: 0; }

/* --- the 123 number-format control -------------------------------------- */
.numfmt-read { font-size: var(--fs-ctl); letter-spacing: .1px; padding-left: 2px; }

/* --- app-bar icon button (32px box, 8px radius) -------------------------- */
.icbtn { width: var(--h-icon); height: var(--h-icon); border-radius: var(--r-icon);
         display: inline-flex; align-items: center; justify-content: center;
         color: var(--fg-2); flex: 0 0 auto;
         transition: background var(--dur-1) var(--ease-standard),
                     color var(--dur-1) var(--ease-standard); }
.icbtn:hover  { background: var(--fill-hover-ground); color: var(--fg-1); }
.icbtn:active { background: var(--fill-press-ground); transition-duration: var(--dur-0); }
.icbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-on-soft); }
.icbtn[disabled] { color: var(--fg-disabled); pointer-events: none; }

/* --- the pill: an action carried in a tonal container -------------------- */
.pill {
  height: var(--h-ctl); border-radius: var(--r-pill); padding: 0 14px 0 10px;
  display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
  font-size: var(--fs-menu); font-weight: var(--fw-med);
  background: var(--accent-soft); color: var(--accent-on-soft);
  transition: background var(--dur-1) var(--ease-standard);
}
.pill:hover  { background: var(--accent-soft-hover); }
.pill:active { background: var(--accent-soft-press); transition-duration: var(--dur-0); }
.pill[data-quiet="1"] { background: transparent; color: var(--fg-2); }
.pill[data-quiet="1"]:hover { background: var(--fill-hover-ground); color: var(--fg-1); }

/* --- the gap legend ------------------------------------------------------
   Marks every control the assignment records as status:"gap" — the verb
   exists in the design and the shipped editor has no command id for it. */
:root[data-gaps="1"] [data-gap="1"] {
  box-shadow: inset 0 0 0 1px var(--gap-stroke);
  background-image: linear-gradient(var(--gap-tint), var(--gap-tint));
}
:root[data-gaps="1"] .mi[data-gap="1"] { border-radius: var(--r-row); }

/* ==========================================================================
   5. APP BAR
   ========================================================================== */
.appbar { height: var(--h-appbar); flex: 0 0 auto; display: flex;
          align-items: center; gap: 2px; padding: 0 8px; min-width: 0; }
.mark { width: 28px; height: var(--h-icon); display: inline-flex;
        align-items: center; justify-content: center; flex: 0 0 auto;
        color: var(--accent); }
.mark svg { width: 21px; height: 21px; }
.doctitle { display: flex; align-items: center; gap: 2px; min-width: 0; }
.docname {
  height: 26px; max-width: min(42vw, 420px); padding: 0 7px;
  border-radius: var(--r-ctl); font-size: var(--fs-title); font-weight: var(--fw-med);
  color: var(--fg-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background var(--dur-1) var(--ease-standard);
}
.docname:hover { background: var(--fill-hover-ground); }
.docrename { height: 26px; width: 260px; padding: 0 6px; border-radius: var(--r-ctl);
             border: 1px solid var(--accent); background: var(--bg-raised);
             font-size: var(--fs-title); font-weight: var(--fw-med); }
.docbtn { width: 26px; height: 26px; border-radius: var(--r-ctl);
          display: inline-flex; align-items: center; justify-content: center;
          color: var(--fg-3); flex: 0 0 auto;
          transition: background var(--dur-1) var(--ease-standard),
                      color var(--dur-1) var(--ease-standard); }
.docbtn:hover  { background: var(--fill-hover-ground); color: var(--fg-1); }
.docbtn:active { background: var(--fill-press-ground); transition-duration: var(--dur-0); }
.docbtn[aria-pressed="true"] { color: var(--warning); }
.docbtn[aria-pressed="true"] .ic .star { fill: currentColor; }

/* THE ONE SAVE STATE. The shipped editor makes three claims in two bands that
   do not agree (#doc-state from a 250ms isDirty() poll, #autosave-state hidden
   whenever it works, and a permanent "Local only · nothing uploaded"), and the
   one that reflects what actually protects the user is the invisible one. This
   is a single ambient status, event-driven, and it is the only place in the
   chrome that says whether the work is safe. */
.savestate { position: relative; display: inline-flex; align-items: center;
             height: 26px; padding: 0 6px; margin-left: 2px; flex: 0 0 auto;
             color: var(--fg-3); font-size: var(--fs-small); white-space: nowrap;
             border-radius: var(--r-ctl); max-width: 190px; overflow: hidden;
             transition: max-width var(--dur-3) var(--ease-standard),
                         background var(--dur-1) var(--ease-standard); }
.savestate:hover { background: var(--fill-hover-ground); }
.savestate[data-collapsed="1"] { max-width: 30px; }
.savestate .ic { width: 15px; height: 15px; margin-right: 5px; }
.savestate span { position: relative; }
/* Two stacked spans crossfade, so nothing tweens width mid-sentence. */
.savestate span b { font-weight: var(--fw-reg); transition: opacity var(--dur-2) var(--ease-standard); }
.savestate span b[data-off="1"] { position: absolute; left: 0; top: 0; opacity: 0; }
.savestate[data-fail="1"] { color: var(--danger); max-width: none; }

.spacer { flex: 1 1 auto; min-width: 8px; }
.appbar-right { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.lastedit { height: 26px; padding: 0 8px; border-radius: var(--r-ctl);
            font-size: var(--fs-small); color: var(--fg-3); white-space: nowrap;
            display: inline-flex; align-items: center; gap: 6px;
            transition: background var(--dur-1) var(--ease-standard); }
.lastedit:hover { background: var(--fill-hover-ground); color: var(--fg-1); }
.lastedit i { width: 6px; height: 6px; border-radius: var(--r-pill);
              background: var(--accent); display: inline-block; }

/* --- presence: ambient, and present before anyone is here ---------------- */
.presence { display: flex; align-items: center; padding: 0 4px 0 0; }
.face { width: 24px; height: 24px; border-radius: var(--r-pill);
        margin-left: -6px; flex: 0 0 auto; position: relative;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 10.5px; font-weight: var(--fw-semi); letter-spacing: .2px;
        color: var(--on-accent); background: var(--pc, var(--accent));
        box-shadow: 0 0 0 2px var(--bg-ground);
        transform: scale(1); opacity: 1;
        transition: transform var(--dur-4) var(--ease-decel),
                    opacity var(--dur-4) var(--ease-decel); }
.face:first-child { margin-left: 0; }
.face[data-join="0"] { transform: scale(.6); opacity: 0; }
.face:hover, .face:focus-visible { z-index: 3; }
.face[data-more="1"] { background: var(--bg-sunken); color: var(--fg-3); }
.presence-card { position: fixed; z-index: 90; background: var(--bg-raised);
                 border-radius: var(--r-pop); box-shadow: var(--sh-overlay);
                 padding: 10px 12px; min-width: 172px; pointer-events: none;
                 animation: pop-in var(--dur-2) var(--ease-decel); }
.presence-card b { display: block; font-size: var(--fs-menu); font-weight: var(--fw-med); }
.presence-card span { display: block; font-size: var(--fs-small); color: var(--fg-3); margin-top: 2px; }

/* ==========================================================================
   6. MENU BAR
   Seven of our eight menu names already match this chrome's source, so the
   bar IS the chrome's primary command surface rather than a hidden ghost
   behind one. That is the structural advantage this layout has over a
   ribbon: menuModel() keeps returning a complete model with no engineering.
   ========================================================================== */
.menubar { height: var(--h-menubar); flex: 0 0 auto; display: flex;
           align-items: center; gap: 1px; padding: 0 6px; min-width: 0; }
.mtop { height: 24px; padding: 0 10px; border-radius: var(--r-row);
        font-size: var(--fs-menu); color: var(--fg-1); white-space: nowrap;
        transition: background var(--dur-1) var(--ease-standard); }
.mtop:hover, .mtop[aria-expanded="true"] { background: var(--fill-hover-ground); }
.mtop:active { background: var(--fill-press-ground); transition-duration: var(--dur-0); }
.mtop u { text-decoration: none; }
:root[data-alt="1"] .mtop u { text-decoration: underline; text-underline-offset: 2px; }
.finder { height: 24px; border-radius: var(--r-row); padding: 0 8px;
          display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3);
          font-size: var(--fs-ctl); flex: 0 0 auto;
          transition: background var(--dur-1) var(--ease-standard),
                      color var(--dur-1) var(--ease-standard); }
.finder:hover { background: var(--fill-hover-ground); color: var(--fg-1); }
.menubar .spacer { min-width: 6px; }

/* ==========================================================================
   7. TOOLBAR
   One row, never two, never tabbed. One rounded container that lifts once;
   the controls inside it tint. Grouping is stated by 6|1px|6 hairlines —
   never by capsules, never by a fill, never by a caption.
   ========================================================================== */
.toolband { height: var(--h-toolbar); flex: 0 0 auto;
            padding: var(--bar-inset) 8px; min-width: 0; }
.toolbar {
  height: 32px; border-radius: var(--r-bar); background: var(--bg-container);
  box-shadow: var(--sh-raised); padding: 2px 6px;
  display: flex; align-items: center; gap: var(--gap-ctl);
  overflow: hidden; min-width: 0;
}
.tbg { display: flex; align-items: center; gap: var(--gap-ctl); flex: 0 0 auto; }
.tbg[data-folded="1"] { display: none; }
.tb-sep { width: 1px; height: 16px; background: var(--stroke-2); flex: 0 0 auto;
          margin: 0 calc(var(--gap-grp) - var(--gap-ctl)); }
.tb-sep[hidden] { display: none; }
/* The fold unit is a NAMED, LABELLED chip. The source chrome collapses
   right-to-left one anonymous control at a time into an unlabelled chevron,
   and the documented result is users concluding the feature was removed.
   Adopt its restraint about what is on the bar; keep our degradation. */
.chip { height: var(--h-ctl); padding: 0 6px 0 8px; border-radius: var(--r-ctl);
        display: none; align-items: center; gap: 4px; color: var(--fg-2);
        font-size: var(--fs-ctl); flex: 0 0 auto;
        transition: background var(--dur-1) var(--ease-standard),
                    color var(--dur-1) var(--ease-standard); }
.chip[data-shown="1"] { display: inline-flex; }
.chip:hover  { background: var(--fill-hover); color: var(--fg-1); }
.chip:active { background: var(--fill-press); transition-duration: var(--dur-0); }
.tb-more { margin-left: auto; }

/* ==========================================================================
   8. POPUPS — menus, submenus, pickers, the tool finder
   Cloned, shown, THEN measured and placed. Measuring a hidden panel yields
   0x0 and makes every flip and clamp below dead code; anchorMenu() in the
   shipped editor has already been bitten by exactly that.
   ========================================================================== */
.pop {
  position: fixed; z-index: 80; min-width: 208px; max-width: 460px;
  background: var(--bg-raised); border-radius: var(--r-pop);
  box-shadow: var(--sh-overlay); padding: 6px 0;
  max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain;
  transform-origin: var(--pop-origin, top left);
  animation: pop-in var(--dur-3) var(--ease-decel);
}
@keyframes pop-in {
  from { opacity: 0; transform: scaleY(.94) translateY(-4px); }
  to   { opacity: 1; transform: none; }
}
@keyframes pop-out { to { opacity: 0; } }
/* Exit is opacity only and about half the time. A panel that folds up on the
   way out reads slower than one that simply goes. */
.pop[data-closing="1"] { animation: pop-out var(--dur-2) var(--ease-accel) forwards;
                         pointer-events: none; }
.pop[data-wide="1"] { min-width: 300px; }
.scrim { position: fixed; inset: 0; z-index: 70; background: transparent; }

.mi {
  width: 100%; min-height: var(--h-row); padding: 0 12px 0 0;
  display: grid; grid-template-columns: 30px 1fr auto 18px;
  align-items: center; gap: 0; text-align: left;
  font-size: var(--fs-menu); color: var(--fg-1); border-radius: var(--r-row);
  transition: background var(--dur-1) var(--ease-standard);
}
.mi:hover  { background: var(--fill-hover); }
.mi:active { background: var(--fill-press); transition-duration: var(--dur-0); }
.mi[aria-disabled="true"] { color: var(--fg-disabled); pointer-events: none; }
.mi[data-danger="1"] { color: var(--danger); }
.mi-gutter { display: inline-flex; align-items: center; justify-content: center;
             color: var(--fg-2); }
.mi-gutter .ic { width: 15px; height: 15px; }
.mi-gutter .chk { opacity: 0; }
.mi[aria-checked="true"] .mi-gutter .chk { opacity: 1; color: var(--accent-on-soft); }
.mi[aria-checked="true"] .mi-gutter .gi  { display: none; }
.mi-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 16px; }
.mi-key { color: var(--fg-3); font-size: var(--fs-small); white-space: nowrap;
          font-variant-numeric: tabular-nums; }
.mi-sub { display: inline-flex; align-items: center; justify-content: flex-end; color: var(--fg-3); }
.mi-sub .ic { width: 13px; height: 13px; }
.mi-sep { height: 1px; background: var(--stroke-2); margin: 5px 12px; }
.mi-head { padding: 7px 12px 4px 12px; font-size: var(--fs-small);
           font-weight: var(--fw-semi); color: var(--fg-3);
           letter-spacing: .3px; text-transform: uppercase; }
.mi-empty { padding: 14px 16px; font-size: var(--fs-ctl); color: var(--fg-3); max-width: 300px; }
.mi[data-open="1"] { background: var(--fill-hover); }

/* the swatch grid shared by text colour and fill colour */
.pop-grid { display: grid; grid-template-columns: repeat(11, 20px); gap: 4px; padding: 6px 12px 10px; }
.sw { width: 20px; height: 20px; border-radius: var(--r-ctl); background: var(--c);
      box-shadow: inset 0 0 0 1px var(--stroke-1);
      transition: transform var(--dur-1) var(--ease-standard); }
.sw:hover { transform: scale(1.14); }
.sw[aria-selected="true"] { box-shadow: inset 0 0 0 1px var(--stroke-1), 0 0 0 2px var(--accent); }

/* the 3x4 border pattern grid */
.pop-borders { display: grid; grid-template-columns: repeat(4, 30px); gap: 4px; padding: 6px 12px 10px; }
.bd { width: 30px; height: 28px; border-radius: var(--r-ctl); color: var(--fg-2);
      display: inline-flex; align-items: center; justify-content: center;
      transition: background var(--dur-1) var(--ease-standard); }
.bd:hover { background: var(--fill-hover); color: var(--fg-1); }

/* the tool finder */
.finder-field { display: flex; align-items: center; gap: 8px; padding: 4px 12px 8px; }
.finder-field input { flex: 1 1 auto; height: 30px; border-radius: var(--r-ctl);
                      border: 1px solid var(--stroke-1); background: var(--bg-sunken);
                      padding: 0 9px; font-size: var(--fs-menu); min-width: 0; }
.finder-field input:focus { border-color: var(--accent); }
.mi-path { color: var(--fg-3); font-size: var(--fs-small); }

/* ==========================================================================
   9. FORMULA BAR
   One flat bar with NO independent control borders — the clearest structural
   difference from a "web form" formula bar. A single vertical seam after the
   Name Box, a decorative fx that opens nothing, the input sitting directly on
   the bar, and the expander at the FAR RIGHT end. This is also the only
   hairline left above the grid: on both sides of it the surface is white, so
   there is no tonal step to do the work.
   ========================================================================== */
.formulabar { height: var(--h-formula); flex: 0 0 auto; display: flex;
              align-items: center; gap: 0; padding: 0 8px;
              background: var(--bg-canvas);
              border-bottom: 1px solid var(--stroke-1); position: relative; }
.namebox { width: 92px; height: 28px; border: 0; background: transparent;
           font-size: var(--fs-ctl); padding: 0 4px; flex: 0 0 auto;
           font-variant-numeric: tabular-nums; }
.namebox:focus-visible { border-radius: var(--r-ctl); }
.nb-caret { width: 20px; height: 28px; border-radius: var(--r-ctl);
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--fg-3); flex: 0 0 auto;
            transition: background var(--dur-1) var(--ease-standard); }
.nb-caret:hover { background: var(--fill-hover); color: var(--fg-1); }
.fx-seam { width: 1px; height: 20px; background: var(--stroke-1); margin: 0 8px; flex: 0 0 auto; }
.fx-mark { color: var(--fg-3); flex: 0 0 auto; margin-right: 6px;
           display: inline-flex; align-items: center; }
.fx-mark .ic { width: 15px; height: 15px; }
.fx-input { flex: 1 1 auto; min-width: 0; height: 28px; border: 0;
            background: transparent; font-size: 13px;
            font-family: var(--font-mono); padding: 0 6px; }
.fx-btn { width: 24px; height: 24px; border-radius: var(--r-ctl); color: var(--fg-3);
          display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
          transition: background var(--dur-1) var(--ease-standard),
                      color var(--dur-1) var(--ease-standard); }
.fx-btn:hover { background: var(--fill-hover); color: var(--fg-1); }
.fx-btn[disabled] { color: var(--fg-disabled); pointer-events: none; }
.fx-btn[data-ok="1"]:not([disabled]) { color: var(--accent); }
.fx-expand { margin-left: 4px; }
.fx-expand .ic { transition: transform var(--dur-2) var(--ease-standard); }
.formulabar[data-expanded="1"] { height: 92px; align-items: flex-start; padding-top: 4px; }
.formulabar[data-expanded="1"] .fx-input { height: 82px; white-space: pre-wrap; }
.formulabar[data-expanded="1"] .fx-expand .ic { transform: rotate(180deg); }
:root[data-hide-fx="1"] .formulabar { display: none; }

/* ==========================================================================
   10. GRID
   HTML/CSS, sticky headers, a real selection model. The selection rectangle
   is ONE absolutely-positioned box, so moving it never repaints a cell — and
   the fill handle is a child of that box, so it travels for free.
   ========================================================================== */
.gridwrap { flex: 1 1 auto; min-width: 0; overflow: auto; position: relative;
            background: var(--bg-canvas); scrollbar-gutter: stable;
            outline: none; }
.sheet { display: grid; position: relative; width: max-content;
         font-size: calc(13px * var(--gz, 1)); }
.corner, .colhead, .rowhead {
  background: var(--grid-head-bg); color: var(--grid-head-fg);
  font-size: calc(11px * var(--gz, 1)); font-weight: var(--fw-med);
  display: flex; align-items: center; justify-content: center;
  border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line);
  user-select: none; position: sticky;
  transition: background var(--dur-1) var(--ease-standard);
}
.colhead { top: 0; z-index: 3; }
.rowhead { left: 0; z-index: 2; }
.corner  { top: 0; left: 0; z-index: 4; }
.corner::after { content: ""; width: 0; height: 0; margin: 6px 3px -3px auto;
                 border-left: 7px solid transparent; border-bottom: 7px solid var(--grid-head-fg);
                 opacity: .55; align-self: flex-end; }
.colhead[data-hot="1"], .rowhead[data-hot="1"] { background: var(--grid-head-hot); color: var(--accent-on-soft); }
.colhead:hover, .rowhead:hover { background: var(--grid-head-hot); }
.cell {
  /* The row's height comes from an explicit `grid-template-rows` track, not
     from the cell — otherwise resizing one row means writing a height onto
     each of its 52 cells, and 52 style writes per pointer-move is not a
     gesture, it is a stutter. One track string carries every row. */
  height: 100%; min-height: 0;
  padding: 0 calc(6px * var(--gz, 1));
  border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line);
  display: flex; align-items: center; overflow: hidden; white-space: nowrap;
  position: relative; color: var(--fg-1);
}
:root[data-gridlines="0"] .cell { border-color: transparent; }
.cell[data-num] { justify-content: flex-end; }
.cell[data-b="1"]     { font-weight: var(--fw-semi); }
.cell[data-muted="1"] { color: var(--fg-3); }
.cell[data-title="1"] { font-size: calc(15px * var(--gz, 1)); font-weight: var(--fw-semi); }
.cell[data-hdr="1"]   { font-weight: var(--fw-semi); color: var(--fg-1);
                        background: var(--grid-head-bg);
                        box-shadow: inset 0 -2px 0 var(--accent); }
.cell[data-total="1"] { background: var(--grid-total-bg); font-weight: var(--fw-semi);
                        box-shadow: inset 0 1px 0 var(--fg-3); }
.cell[data-spill="1"] { overflow: visible; z-index: 1; }
.cell[data-note="1"]::after { content: ""; position: absolute; top: 0; right: 0;
                              border-top: 6px solid var(--warning);
                              border-left: 6px solid transparent; }
.cell[data-note="1"] { background: var(--note-tint); }
.cell .bar { position: absolute; left: 2px; top: 3px; bottom: 3px;
             border-radius: 2px; background: var(--viz-bar); }
.cell .bar[data-neg="1"] { background: var(--viz-bar-neg); }
.cell[data-scale="hi"]  { background: var(--viz-hi); }
.cell[data-scale="mid"] { background: var(--viz-mid); }
.cell[data-scale="lo"]  { background: var(--viz-lo); }
.cell[data-sel="1"]::before { content: ""; position: absolute; inset: 0;
                              background: var(--grid-sel-fill); pointer-events: none; }
.cell[data-sel="1"][data-anchor="1"]::before { background: transparent; }

/* Selection paints with NO transition — 0ms, always. A spreadsheet selection
   that eases is a spreadsheet that feels laggy; this is the one place where
   instant IS the design. */
.selbox { position: absolute; z-index: 5; pointer-events: none;
          box-shadow: inset 0 0 0 2px var(--accent); border-radius: 1px; }
.fillhandle { position: absolute; right: -4px; bottom: -4px;
              width: 7px; height: 7px; background: var(--accent);
              box-shadow: 0 0 0 1.5px var(--bg-canvas); border-radius: 1px;
              pointer-events: auto; cursor: crosshair;
              transition: transform var(--dur-1) var(--ease-standard); }
.fillhandle:hover { transform: scale(1.5); }

/* --------------------------------------------------------------------------
   10a. DIRECT MANIPULATION — resize, autofit, reorder, freeze
   Four gestures, one rule that governs all of them: WHILE THE POINTER IS
   DOWN NOTHING TRANSITIONS. A preview line that eases toward the cursor is
   the single most reliable way to make a grid feel broken, and it is exactly
   what a well-meaning `transition: all` produces. Only the COMMIT animates —
   the moment the pointer is released, when there is no longer a pointer to
   lag behind. `docs/93` §9.3 puts freeze lines and the fill handle in the
   never-animated list for the same reason.
   -------------------------------------------------------------------------- */

/* The guide: a resize preview edge, or a reorder drop indicator. One element,
   two jobs, because they are never on screen at the same time. */
.gguide { position: absolute; z-index: 8; background: var(--grid-guide);
          pointer-events: none; transition: none; }
.gguide[data-axis="col"] { width: 2px; top: 0; bottom: 0; }
.gguide[data-axis="row"] { height: 2px; left: 0; right: 0; }
/* A drop indicator is thicker and carries a cap at the leading end, so a
   reorder cannot be misread as a resize at a glance. */
.gguide[data-kind="drop"] { background: var(--grid-guide); }
.gguide[data-kind="drop"][data-axis="col"] { width: 3px; margin-left: -1px; }
.gguide[data-kind="drop"][data-axis="row"] { height: 3px; margin-top: -1px; }
.gguide[data-kind="drop"]::before { content: ""; position: absolute;
          width: 7px; height: 7px; border-radius: var(--r-pill);
          background: var(--grid-guide); }
.gguide[data-kind="drop"][data-axis="col"]::before { left: -2px; top: -3px; }
.gguide[data-kind="drop"][data-axis="row"]::before { top: -2px; left: -3px; }

/* The reorder ghost. It keeps the user's GRIP — the JS offsets it by where
   the band was grabbed rather than centring it under the pointer, mirroring
   `webapp/editor.core.js:7495`'s px0/py0. Centring makes a wide band jump
   sideways the instant the drag starts, which reads as having grabbed the
   wrong thing. */
.gghost { position: absolute; z-index: 9; pointer-events: none;
          background: var(--ghost-bg); opacity: .78;
          box-shadow: inset 0 0 0 1px var(--ghost-stroke), var(--sh-overlay);
          border-radius: var(--r-ctl); transition: none; }

/* The size read-out. Fixed, not absolute: the grid is a scroll container and
   an absolutely-positioned tooltip inside one is clipped at exactly the
   moment a resize reaches the viewport edge. */
.gsize { position: fixed; z-index: 130; background: var(--bg-inverse);
         color: var(--fg-inverse); border-radius: var(--r-ctl);
         padding: 4px 8px; font-size: 11.5px; font-weight: var(--fw-med);
         font-variant-numeric: tabular-nums; pointer-events: none;
         box-shadow: var(--sh-overlay); white-space: nowrap; }

/* Cursors. Set on the header itself while the pointer is in the grab zone,
   because a `col-resize` cursor that only appears after mousedown teaches
   nobody that the gesture exists. */
.colhead[data-grab="1"] { cursor: col-resize; }
.rowhead[data-grab="1"] { cursor: row-resize; }
.colhead[data-move="1"], .rowhead[data-move="1"] { cursor: grab; }
:root[data-dragging="move"] * { cursor: grabbing !important; }
:root[data-dragging="col"]  * { cursor: col-resize !important; }
:root[data-dragging="row"]  * { cursor: row-resize !important; }
:root[data-dragging] .cell, :root[data-dragging] .colhead,
:root[data-dragging] .rowhead { transition: none !important; }

/* THE FREEZE DIVIDER.
   A grid item, not an overlay: `position: sticky` inside the scroller pins it
   to the frozen boundary for free, where an absolutely-positioned overlay
   would scroll away from the pane it is supposed to be marking. Zero-sized so
   it cannot disturb a single track. */
/* AN ABSOLUTE SHELL WITH A STICKY LINE INSIDE IT, and both halves of that
   cost a layout to learn.
   Making the divider a sticky GRID ITEM is the obvious build and fails twice.
   `position: sticky` is clamped to its containing block, and a grid item's
   containing block is its grid AREA — a divider in the 46px row-header track
   can never stick further right than 46px. Spanning `1 / 1 / -1 / -1` fixes
   the clamp and breaks something far worse: definitely-placed items are
   placed BEFORE auto-placed ones, so a divider covering the explicit grid
   leaves no cell free and all 3,233 headers and cells overflow into implicit
   rows beneath it. The sheet rendered as two lines on an empty page.
   Driving it from a scroll listener instead works and is still wrong: scroll
   events are throttled in a background or occluded tab, so the divider sat at
   its unscrolled position while the pane behind it had moved.
   What holds: an ABSOLUTE shell, out of flow so it consumes no cell, sized to
   the whole sheet so it is a containing block worth sticking inside; and a
   STICKY line within it, which the compositor pins with no script at all. The
   frozen CELLS stay sticky too — each only has to pin within its own grid
   area, which is exactly what the clamp permits. */
.fzdiv { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
         z-index: 7; pointer-events: none; }
.fzline { position: sticky; display: block; }
.fzdiv[data-axis="col"] .fzline { left: 0; width: 0; height: 100%; }
.fzdiv[data-axis="row"] .fzline { top: 0; height: 0; width: 100%; }
.fzline i { position: absolute; display: block; background: var(--grid-freeze); }
.fzdiv[data-axis="col"] .fzline i { top: 0; bottom: 0; left: -1px; width: 2px;
                                    box-shadow: 3px 0 6px -2px var(--frozen-shadow); }
.fzdiv[data-axis="row"] .fzline i { left: 0; right: 0; top: -1px; height: 2px;
                                    box-shadow: 0 3px 6px -2px var(--frozen-shadow); }
/* The grab strip is wide (FREEZE_GRAB = 8, raised from 4 in the product
   because a 1px divider under a 4px zone was missed more often than hit and
   users concluded a frozen pane could not be moved at all). */
.fzline b { position: absolute; pointer-events: auto; display: block; }
.fzdiv[data-axis="col"] .fzline b { top: 0; bottom: 0; left: -8px; width: 17px; cursor: col-resize; }
.fzdiv[data-axis="row"] .fzline b { left: 0; right: 0; top: -8px; height: 17px; cursor: row-resize; }
/* The pill is the visible "this line moves" affordance, and it is STICKY on
   the other axis so it rides in the header band at any scroll position — a
   handle that scrolls off the top of a 60-row sheet is a handle nobody finds
   twice. */
.fzline u { position: sticky; display: block; background: var(--grid-freeze);
            border-radius: var(--r-pill); pointer-events: none;
            transition: background var(--dur-1) var(--ease-standard),
                        transform var(--dur-1) var(--ease-standard); }
.fzdiv[data-axis="col"] .fzline u { top: 5px; margin-left: -2px; width: 4px; height: 12px; }
.fzdiv[data-axis="row"] .fzline u { left: 5px; margin-top: -2px; height: 4px; width: 12px; }
.fzline b:hover ~ u, .fzdiv[data-hot="1"] u { background: var(--grid-freeze-hot); }
.fzdiv[data-axis="col"] .fzline b:hover ~ u { transform: scaleX(1.6); }
.fzdiv[data-axis="row"] .fzline b:hover ~ u { transform: scaleY(1.6); }
.fzline b:hover ~ i, .fzdiv[data-hot="1"] i { background: var(--grid-freeze-hot); }

/* The two CORNER HANDLES that CREATE a freeze from zero. Without them the
   only draggable divider is one that already exists, so the gesture a user
   goes looking for first — "make a frozen pane by dragging" — has nothing to
   grab. `webapp/editor.core.js:3563` learnt this the same way. They live
   inside the corner box because the obvious alternative, a grab zone on the
   body's leading edge, sits exactly where column A is and would swallow
   ordinary selection clicks forever after. */
.corner { position: sticky; overflow: visible; }
/* THE HIT AREA IS 9px AND THE VISIBLE PILL IS 3px, and that gap is the whole
   point. A 3px target is the size of the thing you are drawing, not the size
   of the thing a hand can hit: at 3px a real pointer drag missed it every
   time while a synthetic one dispatched at the exact centre succeeded, which
   is the most misleading pair of results this file can produce. Same lesson
   `webapp/editor.core.js:3550` records when it raised FREEZE_GRAB from 4 to
   8. Visible at rest too — an affordance that only appears once you are
   already hovering the right 3 pixels teaches nobody it is there. */
.fzgrab { position: absolute; opacity: .3; z-index: 5;
          transition: opacity var(--dur-1) var(--ease-standard); }
.fzgrab::after { content: ""; position: absolute; border-radius: var(--r-pill);
                 background: var(--grid-freeze);
                 transition: background var(--dur-1) var(--ease-standard); }
.fzgrab[data-axis="col"] { right: 0; top: 2px; bottom: 34%; width: 9px; cursor: col-resize; }
.fzgrab[data-axis="col"]::after { right: 2px; top: 0; bottom: 0; width: 3px; }
.fzgrab[data-axis="row"] { bottom: 0; left: 2px; right: 34%; height: 9px; cursor: row-resize; }
.fzgrab[data-axis="row"]::after { bottom: 2px; left: 0; right: 0; height: 3px; }
.corner:hover .fzgrab { opacity: .62; }
.fzgrab:hover { opacity: 1; }
.fzgrab:hover::after { background: var(--grid-freeze-hot); }

/* A frozen pane's cells are pinned by `position: sticky`, written by the JS
   with the offset each one needs. The class only carries what is constant. */
.cell[data-frozen], .colhead[data-frozen], .rowhead[data-frozen] { position: sticky; }
.cell[data-frozen="c"] { z-index: 1; background: var(--bg-canvas); }
.cell[data-frozen="r"] { z-index: 1; background: var(--bg-canvas); }
.cell[data-frozen="rc"] { z-index: 2; background: var(--bg-canvas); }
.cell[data-frozen][data-total="1"] { background: var(--grid-total-bg); }
.cell[data-frozen][data-hdr="1"] { background: var(--grid-head-bg); }

/* A hidden line is invisible, and so is the fact that it is there. The header
   BESIDE it carries the mark — the only thing left on screen a user can aim
   at to get the line back. Two chevrons, drawn with borders so they cost no
   icon and inherit the header's colour. */
.colhead[data-hid-next="1"]::after, .rowhead[data-hid-next="1"]::after {
  content: ""; position: absolute; background: var(--grid-head-fg); opacity: .7; }
.colhead[data-hid-next="1"]::after { right: 1px; top: 4px; bottom: 4px; width: 2px;
  box-shadow: 2px 0 0 var(--grid-head-fg); }
.rowhead[data-hid-next="1"]::after { bottom: 1px; left: 4px; right: 4px; height: 2px;
  box-shadow: 0 2px 0 var(--grid-head-fg); }
.colhead[data-frozen] { z-index: 4; }
.rowhead[data-frozen] { z-index: 3; }

/* THE COMMIT, and the only thing here that animates. `grid-template-columns`
   interpolates between two same-length px lists, so a released resize glides
   the last few pixels into place instead of snapping. Applied by a class the
   JS sets for one transition and removes on `transitionend`, so it can never
   be live while a drag is. */
.sheet[data-commit="1"] { transition: grid-template-columns var(--dur-2) var(--ease-standard),
                                      grid-template-rows var(--dur-2) var(--ease-standard); }

/* A remote collaborator's cell cursor. It INTERPOLATES to its new position
   rather than jumping — but only over a short distance; a rectangle flying
   across forty columns reads as noise, so the JS cuts instead. */
.rcursor { position: absolute; z-index: 6; pointer-events: none;
           box-shadow: inset 0 0 0 2px var(--pc, var(--accent));
           transition: transform var(--dur-4) var(--ease-standard),
                       width var(--dur-4) var(--ease-standard),
                       height var(--dur-4) var(--ease-standard); }
.rcursor b { position: absolute; top: -17px; left: -2px; height: 16px;
             padding: 0 6px; border-radius: var(--r-ctl) var(--r-ctl) var(--r-ctl) 0;
             background: var(--pc, var(--accent)); color: var(--on-accent);
             font-size: 10.5px; font-weight: var(--fw-med); line-height: 16px;
             white-space: nowrap; transition: opacity var(--dur-2) var(--ease-standard); }

/* ==========================================================================
   11. THE PANEL HOST
   Non-modal, docked right, resizable. The grid REFLOWS to meet it rather
   than being overlaid: that is the structural difference between a panel and
   a floating task pane, and it is what makes "panel instead of modal"
   actually pay — your data never disappears behind the tool editing it.
   The slide itself is an overlay so the canvas is measured once, at the end.
   SEAM: pass 2 registers real panel builders through SHEETS.registerPanel().
   ========================================================================== */
.panel { flex: 0 0 var(--panel-w); width: var(--panel-w); min-width: 0;
         background: var(--bg-raised); border-left: 1px solid var(--stroke-1);
         display: flex; flex-direction: column; position: relative; }
.panel[hidden] { display: none; }
.panel[data-sliding="1"] { position: absolute; right: 0; top: 0; bottom: 0;
                           z-index: 20; box-shadow: var(--sh-overlay);
                           transition: transform var(--dur-6) var(--ease-decel); }
.panel[data-sliding="1"][data-out="1"] { transition-timing-function: var(--ease-accel);
                                         transition-duration: var(--dur-4); }
.panel-grip { position: absolute; left: -2px; top: 0; bottom: 0; width: 5px;
              cursor: col-resize; z-index: 2; }
.panel-grip:hover { background: var(--accent-soft); }
.panel-head { height: 44px; flex: 0 0 auto; display: flex; align-items: center;
              gap: 8px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--stroke-2); }
.panel-title { flex: 1 1 auto; font-size: var(--fs-title); font-weight: var(--fw-med);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel-body { flex: 1 1 auto; overflow-y: auto; padding: 16px;
              opacity: 1; transition: opacity var(--dur-2) var(--ease-standard); }
.panel[data-sliding="1"] .panel-body { opacity: 0; }
.panel-note { font-size: var(--fs-ctl); color: var(--fg-3); line-height: 1.6; }
.panel-note code { font-family: var(--font-mono); font-size: 11.5px;
                   background: var(--bg-sunken); padding: 1px 4px; border-radius: var(--r-ctl); }

/* ==========================================================================
   12. BOTTOM BAR
   ONE row, not two. The + and the all-sheets menu are pinned OUTSIDE the tab
   scroller: in the shipped editor they scrolled out of reach at twelve
   sheets, so a user with twelve sheets could not add a thirteenth.
   ========================================================================== */
.bottombar { height: var(--h-bottom); flex: 0 0 auto; display: flex;
             align-items: center; gap: 2px; padding: 0 6px;
             background: var(--bg-canvas); border-top: 1px solid var(--stroke-1);
             min-width: 0; }
.stab-rail { display: flex; align-items: center; gap: 2px; flex: 0 0 auto;
             padding-right: 4px; }
.stabs { display: flex; align-items: center; gap: 2px; overflow-x: auto;
         flex: 0 1 auto; min-width: 0; scrollbar-width: none; }
.stabs::-webkit-scrollbar { display: none; }
.stab { height: 26px; padding: 0 4px 0 12px; border-radius: var(--r-row);
        display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto;
        font-size: var(--fs-ctl); font-weight: var(--fw-med); color: var(--fg-3);
        white-space: nowrap; position: relative;
        transition: background var(--dur-1) var(--ease-standard),
                    color var(--dur-1) var(--ease-standard); }
.stab:hover { background: var(--fill-hover); color: var(--fg-1); }
.stab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-on-soft); }
.stab i { width: 6px; height: 6px; border-radius: var(--r-pill);
          background: var(--tc, transparent); display: inline-block; flex: 0 0 auto; }
.stab .stab-menu { width: 18px; height: 18px; border-radius: var(--r-ctl);
                   display: inline-flex; align-items: center; justify-content: center;
                   color: inherit; opacity: 0;
                   transition: opacity var(--dur-1) var(--ease-standard); }
.stab:hover .stab-menu, .stab[aria-selected="true"] .stab-menu { opacity: .8; }
.stab .stab-menu:hover { opacity: 1; background: var(--fill-press); }
.stab[data-drag="1"] { opacity: .45; }

.bottom-right { margin-left: auto; display: flex; align-items: center;
                gap: 4px; flex: 0 0 auto; padding-left: 8px; }
.bstat { font-size: var(--fs-small); color: var(--fg-3); white-space: nowrap;
         padding: 0 4px; }
.statbtn { height: 24px; padding: 0 6px 0 8px; border-radius: var(--r-ctl);
           display: inline-flex; align-items: center; gap: 4px;
           font-size: var(--fs-small); color: var(--fg-3); white-space: nowrap;
           transition: background var(--dur-1) var(--ease-standard),
                       color var(--dur-1) var(--ease-standard); }
.statbtn:hover { background: var(--fill-hover); color: var(--fg-1); }
.statbtn[hidden] { display: none; }
/* TABULAR FIGURES, everywhere a number changes under a still label. Sum,
   Average and Count all recompute as the selection is dragged, and
   proportional digits make the whole read-out shuffle left and right on
   every cell crossed — motion nobody asked for, in the one region that is
   supposed to be ambient. Same reason the zoom read-out is fixed-width. */
.statval { font-variant-numeric: tabular-nums; min-width: 0; }
/* The LABEL recedes and the NUMBER leads. Three statistics side by side is
   six pieces of text, and at 11.5px in the quietest strip on screen the only
   way that stays scannable is for "Average" to be visibly subordinate to what
   follows it. */
.statlbl { opacity: .68; font-weight: var(--fw-reg); }
.statsep { opacity: .38; padding: 0 1px; }
.zoomwrap { display: inline-flex; align-items: center; gap: 1px; }
.zoomval { min-width: 46px; text-align: center; font-size: var(--fs-small);
           color: var(--fg-3); font-variant-numeric: tabular-nums; }
.zbtn { width: 22px; height: 22px; border-radius: var(--r-ctl); color: var(--fg-3);
        display: inline-flex; align-items: center; justify-content: center;
        transition: background var(--dur-1) var(--ease-standard); }
.zbtn:hover { background: var(--fill-hover); color: var(--fg-1); }

/* ==========================================================================
   13. SNACKBAR
   Do it, then offer to take it back. A confirm dialog taxes the 95% who meant
   it to protect the 5% who did not, after which it protects nobody. The
   eligibility rule is mechanical: an action that routes through the undo
   history gets a snackbar; only a loss OUTSIDE the model earns a confirm.
   Anchored inside the grid viewport, so it never covers the sheet tabs.
   ========================================================================== */
.snackhost { position: absolute; left: 24px; bottom: 24px; z-index: 60;
             display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.snack { min-width: 288px; max-width: 568px; min-height: 48px;
         border-radius: var(--r-icon); background: var(--bg-inverse);
         color: var(--fg-inverse); box-shadow: var(--sh-overlay);
         display: flex; align-items: center; gap: 16px; padding: 0 8px 0 16px;
         font-size: var(--fs-menu); pointer-events: auto;
         animation: snack-in var(--dur-4) var(--ease-decel); }
@keyframes snack-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes snack-out { to { opacity: 0; transform: translateY(8px); } }
.snack[data-closing="1"] { animation: snack-out var(--dur-2) var(--ease-accel) forwards; }
.snack-msg { flex: 1 1 auto; }
.snack-act { height: 32px; padding: 0 12px; border-radius: var(--r-ctl);
             color: var(--accent-bright); font-weight: var(--fw-med);
             transition: background var(--dur-1) var(--ease-standard); }
.snack-act:hover { background: var(--tint-on-current); }

/* ==========================================================================
   14. DIALOGS — the short list this chrome keeps
   Share, Find and replace, Custom number format, Spreadsheet settings,
   Keyboard shortcuts. Everything the source chrome would have made a dialog —
   chart formatting, conditional formatting, validation, protection, named
   ranges, pivot fields — is a PANEL.
   ========================================================================== */
.dlg-scrim { position: fixed; inset: 0; z-index: 100; background: var(--scrim);
             display: flex; align-items: center; justify-content: center;
             animation: pop-out var(--dur-2) var(--ease-standard) reverse; }
.dlg { width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
       background: var(--bg-raised); border-radius: var(--r-pop);
       box-shadow: var(--sh-overlay); display: flex; flex-direction: column;
       animation: pop-in var(--dur-4) var(--ease-decel); transform-origin: center; }
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 18px 16px 8px 24px; }
.dlg-title { flex: 1 1 auto; font-size: 17px; font-weight: var(--fw-med); }
.dlg-x { width: var(--h-icon); height: var(--h-icon); border-radius: var(--r-pill);
         display: inline-flex; align-items: center; justify-content: center; color: var(--fg-2);
         transition: background var(--dur-1) var(--ease-standard); }
.dlg-x:hover { background: var(--fill-hover); color: var(--fg-1); }
.dlg-body { padding: 4px 24px 8px; overflow-y: auto; }
.dlg-foot { display: flex; align-items: center; gap: 8px; padding: 12px 24px 20px; }
.dlg-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.dlg-row .grow { flex: 1 1 auto; min-width: 0; }
.dlg-sub { font-size: var(--fs-ctl); color: var(--fg-3); }
.field { height: 36px; border-radius: var(--r-ctl); border: 1px solid var(--stroke-1);
         background: var(--bg-raised); padding: 0 10px; width: 100%; }
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.btn { height: 36px; padding: 0 18px; border-radius: var(--r-pill);
       font-size: var(--fs-menu); font-weight: var(--fw-med); color: var(--accent-on-soft);
       transition: background var(--dur-1) var(--ease-standard); }
.btn:hover { background: var(--accent-soft); }
.btn[data-primary="1"] { background: var(--accent); color: var(--on-accent); }
.btn[data-primary="1"]:hover { background: var(--accent-hover); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px;
                     box-shadow: 0 0 0 4px var(--accent-ring); }
.who { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.who .face { margin: 0; width: var(--h-icon); height: var(--h-icon); font-size: 12px;
             box-shadow: none; }
.who b { display: block; font-size: var(--fs-menu); font-weight: var(--fw-med); }
.who span { display: block; font-size: var(--fs-small); color: var(--fg-3); }
.access { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.access-mark { width: var(--h-icon); height: var(--h-icon); border-radius: var(--r-pill);
               background: var(--accent-soft); color: var(--accent-on-soft);
               display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }

/* ==========================================================================
   15. TOOLTIP — delayed, never the accessible name
   ========================================================================== */
.tip { position: fixed; z-index: 120; background: var(--bg-inverse);
       color: var(--fg-inverse); border-radius: var(--r-ctl);
       padding: 5px 9px; font-size: 12px; pointer-events: none; max-width: 260px;
       box-shadow: var(--sh-overlay); animation: pop-in var(--dur-1) var(--ease-standard); }
.tip b { font-weight: var(--fw-med); display: block; }
.tip span { display: block; opacity: .74; font-size: 11px; margin-top: 1px;
            font-variant-numeric: tabular-nums; }
.tip i { display: block; font-style: normal; color: var(--warning); font-size: 11px; margin-top: 3px; }

/* ==========================================================================
   16. RESPONSIVE
   Every breakpoint is authored. The shipped toolbar collapses when a measured
   loop says it must, which is how its first group ended up folding at 1461px
   on a 1440px laptop. Here the fold ORDER is declared per group and the
   trigger is measured, and nothing ever reorders: a control only ever falls
   into its own group's labelled chip.
   ========================================================================== */
@media (max-width: 1180px) { .lastedit span { display: none; } }
@media (max-width: 1040px) { .savestate { max-width: 30px; } }
@media (max-width: 900px)  { .pill span { display: none; } .pill { padding: 0 8px; } }
/* Below 1024 the panel stops taking width from the grid and becomes an
   overlay with a scrim, so the grid never drops under 480px of usable width. */
@media (max-width: 1023px) {
  .panel { position: absolute; right: 0; top: 0; bottom: 0; z-index: 40;
           width: min(400px, calc(100vw - 56px)); flex: none;
           box-shadow: var(--sh-overlay); }
  .panel-scrim { display: block; }
}
@media (max-width: 640px) { .panel { width: 100%; } }
.panel-scrim { display: none; position: absolute; inset: 0; z-index: 30; background: var(--scrim); }

/* Touch: the toolbar band grows 40 -> 48 and the formula bar 35 -> 40; the app
   bar and menu bar do not, because a menu label is a text target. */
@media (pointer: coarse) {
  :root { --h-toolbar: 48px; --h-ctl: 40px; --h-formula: 40px; --h-row: 44px; --bar-inset: 4px; }
  .toolbar { height: 40px; border-radius: 20px; }
  .icbtn, .docbtn { width: 40px; height: 40px; }
}

@media (prefers-contrast: more) {
  .toolbar { box-shadow: inset 0 0 0 1px var(--stroke-1), var(--sh-raised); }
  .cell, .colhead, .rowhead, .corner { border-color: var(--stroke-hover); }
}

/* The reduced-motion end state must be pixel-identical to the animated one.
   A reduced-motion path that also changes layout is a second design nobody
   reviewed. Only durations go. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
  .panel[data-sliding="1"], .rcursor, .face { transition: none !important; }
}
</style>
</head>
<body>

<div class="app">

<!-- ======================================================= APP BAR ====== -->
<header class="appbar" data-region="appbar" aria-label="Document">
  <!-- The mark is drawn for this file: a sheet with a rule and a column,
       filled from the ONE accent token. No wordmark: the strip names the
       DOCUMENT, never the product. -->
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.5 3.5h8.2L18.5 8.3V20a.9.9 0 0 1-.9.9H5.5a.9.9 0 0 1-.9-.9V4.4a.9.9 0 0 1 .9-.9z"/>
      <path d="M13.4 3.6v4.6h4.9"/>
      <path d="M7.6 12.4h8M7.6 15.6h8M11.2 12.4v6.4"/>
    </svg>
  </span>

  <div class="doctitle">
    <button class="docname" data-role="docname" data-tip="Rename|Click to rename the document"
            aria-label="Rename the document">Q3 Revenue Plan</button>
    <input class="docrename" data-role="docrename" hidden aria-label="Document name">
    <button class="docbtn" data-act="star" aria-pressed="false" aria-label="Star"
            data-tip="Star|Mark this file for quick access">
      <svg class="ic"><use href="#i-star"/></svg></button>
    <button class="docbtn" data-act="move" aria-label="Move to folder"
            data-tip="Move|Move this file to another folder">
      <svg class="ic"><use href="#i-folder"/></svg></button>
    <!-- THE ONE SAVE STATE. Event-driven, not a 4Hz poll, and the only claim
         in this chrome about whether the user's work is safe. -->
    <span class="savestate" data-role="savestate" role="status" aria-live="polite"
          data-tip="All changes saved|Saved to this device a moment ago">
      <svg class="ic"><use href="#i-cloud-ok"/></svg>
      <span><b data-role="save-a">All changes saved</b><b data-role="save-b" data-off="1"></b></span>
    </span>
    <!-- OURS, not the source chrome's: the compatibility report has no home in
         the shipped editor — it is appended to the 34px status strip. -->
    <button class="docbtn" data-act="import-report" data-gap="1"
            aria-label="Import report" data-tip="Import report|3 things this build could not keep from the opened file">
      <svg class="ic"><use href="#i-report"/></svg></button>
  </div>

  <span class="spacer"></span>

  <div class="appbar-right">
    <button class="lastedit" data-act="version-history" data-proxy="file.version-history"

            aria-label="Open comment history" data-tip="Comment history|Every thread on this spreadsheet">
      <svg class="ic"><use href="#i-comment"/></svg></button>

    <!-- Presence POPULATES rather than appears. In the shipped editor the
         roster is hidden until a session exists, which is a circular
         dependency that guarantees discovery never happens. -->
    <div class="presence" data-role="presence" aria-label="Collaborators"></div>

    <button class="pill" data-act="share" data-proxy="file.share"
            aria-label="Share this spreadsheet" data-tip="Share|Choose who can open, comment and edit">
      <svg class="ic"><use href="#i-share"/></svg><span>Share</span></button>

    <button class="icbtn" data-act="account" aria-label="Account: Sam Okonkwo"
            data-tip="Sam Okonkwo|sam@example.internal">
