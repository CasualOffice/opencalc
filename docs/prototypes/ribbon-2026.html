  const items = bodyControls();
  const i = items.indexOf(e.target);
  if (i < 0) return;
  let n = -1;
  /* a text field owns its own Left/Right — the font and size boxes need them */
  if (e.key === "ArrowRight" && !inText) n = Math.min(items.length - 1, i + 1);
  if (e.key === "ArrowLeft"  && !inText) n = Math.max(0, i - 1);
  if (e.key === "Home" && !inText) n = 0;
  if (e.key === "End"  && !inText) n = items.length - 1;
  if (e.key === "ArrowDown" && !inText) {
    const opener = e.target.closest("[data-pop]") || e.target;
    if (opener.dataset.pop) { e.preventDefault(); popup(opener, opener.dataset.pop); return; }
  }
  if (e.key === "Escape") {
    e.preventDefault();
    const t = tabList.find(x => x.getAttribute("aria-selected") === "true");
    if (t) t.focus();
    return;
  }
  if (n < 0) return;
  e.preventDefault();
  items.forEach(x => { x.tabIndex = -1; });
  items[n].tabIndex = 0;
  items[n].focus();
});

/* --- 21.24 grid objects: what makes the contextual tabs real -------------
   A floating chart and a floating PivotTable, drawn over the sheet and
   scrolling with it. Selecting one shows its tabs; clicking a cell inside the
   table range shows Table Design; clicking anywhere else takes them all away. */
function objChart() {
  const el = document.createElement("div");
  el.className = "obj";
  el.setAttribute("data-obj", "chart");
  el.setAttribute("role", "img");
  el.setAttribute("tabindex", "0");
  el.setAttribute("aria-label", "Chart: Plan versus Actual by region. Click to select.");
  el.setAttribute("data-tip", "Chart|Click to select it and reveal the Chart Design and Format tabs.");
  el.innerHTML = '<div class="obj-title">Plan vs Actual by region</div>' +
                 '<div class="obj-sub">Clustered column · 12 categories</div>' +
                 '<svg viewBox="0 0 300 120" style="width:100%;height:118px;display:block" aria-hidden="true"></svg>' +
                 '<span class="obj-handle" style="left:-4px;top:-4px"></span>' +
                 '<span class="obj-handle" style="right:-4px;top:-4px"></span>' +
                 '<span class="obj-handle" style="left:-4px;bottom:-4px"></span>' +
                 '<span class="obj-handle" style="right:-4px;bottom:-4px"></span>';
  const svg = el.querySelector("svg");
  for (let i = 0; i < 12; i++) {
    const h1 = 22 + ((i * 29) % 62), h2 = 18 + ((i * 41) % 74);
    svg.insertAdjacentHTML("beforeend",
      '<rect x="' + (10 + i * 24) + '" y="' + (104 - h1) + '" width="9" height="' + h1 +
      '" rx="1.5" fill="var(--viz-bar)"/>' +
      '<rect x="' + (20 + i * 24) + '" y="' + (104 - h2) + '" width="9" height="' + h2 +
      '" rx="1.5" fill="var(--accent)" opacity=".8"/>');
  }
  svg.insertAdjacentHTML("beforeend",
    '<line x1="6" y1="104.5" x2="294" y2="104.5" stroke="var(--stroke-1)" stroke-width="1"/>');
  return el;
}
function objPivot() {
  const el = document.createElement("div");
  el.className = "obj";
  el.setAttribute("data-obj", "pivot");
  el.setAttribute("tabindex", "0");
  el.setAttribute("aria-label", "PivotTable: Actual by region. Click to select.");
  el.setAttribute("data-tip", "PivotTable|Click to select it and reveal the PivotTable Analyze and Design tabs.");
  el.innerHTML = '<div class="obj-title">Actual by region</div>' +
                 '<div class="obj-sub">PivotTable1 · 3 fields</div>' +
                 '<table style="width:100%;border-collapse:collapse;font-size:11px"></table>' +
                 '<span class="obj-handle" style="left:-4px;top:-4px"></span>' +
                 '<span class="obj-handle" style="right:-4px;top:-4px"></span>' +
                 '<span class="obj-handle" style="left:-4px;bottom:-4px"></span>' +
                 '<span class="obj-handle" style="right:-4px;bottom:-4px"></span>';
  const t = el.querySelector("table");
  const rows = [["Row Labels", "Sum of Actual"], ["EMEA", "$2,914,000"], ["Americas", "$1,802,000"],
                ["APAC", "$1,451,000"], ["Grand Total", "$6,167,000"]];
  rows.forEach(([a, b], i) => {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td"), td2 = document.createElement("td");
    td1.textContent = a; td2.textContent = b;
    td1.style.cssText = "padding:3px 10px;border-top:1px solid var(--stroke-2)";
    td2.style.cssText = "padding:3px 10px;border-top:1px solid var(--stroke-2);text-align:right;font-variant-numeric:tabular-nums";
    if (i === 0 || i === rows.length - 1) { td1.style.fontWeight = "600"; td2.style.fontWeight = "600"; }
    tr.appendChild(td1); tr.appendChild(td2); t.appendChild(tr);
  });
  return el;
}
function selectObject(el) {
  $$(".obj").forEach(o => { if (o === el) o.setAttribute("data-selected", "1"); else o.removeAttribute("data-selected"); });
  setContext(el ? el.dataset.obj : null);
  if (el) say(el.dataset.obj === "chart" ? "Chart selected" : "PivotTable selected");
}
document.addEventListener("mousedown", e => {
  const o = e.target.closest(".obj");
  if (o) { closePop(false); selectObject(o); o.focus(); e.stopPropagation(); }
}, true);

/* --- 21.14 boot ---------------------------------------------------------- */
applySwatch("fill", ramp(40, 4));      /* a soft amber, Excel's default fill  */
applySwatch("font", ramp(0, 1));       /* a deep red, Excel's default text    */
sheets.boot();
setZoom(100);
$$("[data-gallery]").forEach(buildGallery);
syncProxies();
syncStops();
activateTab(tabList[0], false);
reflowRibbon();
syncTabScroll();
paintLoss($('[data-role="bs-formats"] .dlg-opt'));
requestAnimationFrame(() => moveUnderline(tabList[0]));
$('[data-role="mode"]').textContent = "Ready";

/* Escape unwinds one layer at a time: a dialog to the backstage, the backstage
   to the grid, full-screen back to the ribbon. Never two at once. */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (dlgEl) { e.stopPropagation(); closeDialog(true); return; }
  if (backstageOpen()) { e.stopPropagation(); closeBackstage(); return; }
}, true);
/* Layout changes have to re-run the ladder AND re-place the contextual header,
   because both are measured. */
const _setLayout = setLayout;
let layoutPref = root.getAttribute("data-ribbon-layout") || "classic";
const NARROW = 900;
function applyLayoutForWidth() {
  const w = $(".app").clientWidth || window.innerWidth;
  const want = w < NARROW ? "simplified" : layoutPref;
  if (root.getAttribute("data-ribbon-layout") !== want) {
    _setLayout(want);
    syncProxies(); syncStops();
    requestAnimationFrame(() => { moveUnderlineNow(); placeCtxHead(); grid.refit(); reflowRibbon(); });
  }
  /* the menu keeps showing what the USER chose, and says when it is overridden */
  $$('[data-act="layout"]').forEach(n => {
    n.setAttribute("aria-checked", String(n.dataset.value === layoutPref));
    n.setAttribute("aria-disabled", String(w < NARROW && n.dataset.value === "classic"));
  });
}
setLayout = function (v) {
  layoutPref = v;
  applyLayoutForWidth();
  if (root.getAttribute("data-ribbon-layout") !== v) {
    say("Classic needs 900px — this window is showing the Single Line Ribbon");
  } else {
    _setLayout(v);
    syncProxies(); syncStops();
    requestAnimationFrame(() => { moveUnderlineNow(); placeCtxHead(); grid.refit(); });
  }
};
window.addEventListener("resize", () => { applyLayoutForWidth(); placeCtxHead(); paintWidth(); });
new ResizeObserver(() => applyLayoutForWidth()).observe($(".app"));
buildVersions();   /* built at boot, so listCommands() cannot grow when the
                      History page is first visited */
seedTips();        /* after every panel, popup owner and backstage row exists */
$$(".ribbon .row").forEach(r => { if (!r.children.length) r.setAttribute("data-empty", "1"); });
new ResizeObserver(() => placeCtxHead()).observe($(".tabstrip"));

/* --- 21.15 the surface the next passes build on ------------------------- */
window.RIBBON = {
  popup, closePop, say, runCommand, listCommands, reflowRibbon,
  activateTab, setLayout: v => setLayout(v), setDisplay, setTheme,
  grid, sheets, setZoom,
  /* pass 2 surface */
  openBackstage, closeBackstage, bsPage, openDialog, closeDialog,
  setContext, selectObject, syncProxies, syncStops, buildGallery,
  foldReport: () => foldReport, simpleOverflow: SIMPLE_OVERFLOW,
  keytips: { show: ktShow, hide: ktHide },
  /* pass 2/3: fill a template, then call rebuildTab to re-clone it. */
  seedTips,
  rebuildTab(tabId) {
    const tpl = document.querySelector('template[data-tab="' + tabId + '"]');
    const panel = document.getElementById("panel-" + tabId);
    if (!tpl || !panel) return false;
    panel.textContent = "";
    panel.appendChild(tpl.content.cloneNode(true));
    seedTips(panel);
    return true;
  }
};
})();
</script>
