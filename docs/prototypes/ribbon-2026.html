.ribbon-panel[data-tight="1"] .simple-row .w-size   { width: 40px; }
.ribbon-panel[data-tight="1"] .simple-row .rc-sm    { width: 28px; }

/* ==========================================================================
   23. CONTEXTUAL TAB HEADER
   Excel's signature: selecting an object grows the tab strip and paints a
   tinted header over the tabs that object owns. The strip's height change is
   the only chrome reflow the selection is allowed to cause, and it is animated
   once rather than per frame.
   ========================================================================== */
.tabstrip { transition: height var(--dur-normal) var(--ease-emphasis); }
:root[data-contextual="1"] .tabstrip { height: calc(var(--h-tabs) + 15px); }
:root[data-contextual="1"] .tabs { padding-top: 15px; }
:root[data-contextual="1"] .tab-file,
:root[data-contextual="1"] .tabstrip-lead .tabscroll { margin-top: 15px; }
:root[data-contextual="1"] .tabstrip-tools { align-self: flex-end; padding-bottom: 3px; }
.ctx-head { position: absolute; top: 0; height: 15px; display: none;
  align-items: center; justify-content: center; pointer-events: none;
  font-size: 10.5px; font-weight: var(--fw-semi); letter-spacing: .04em;
  text-transform: uppercase; color: var(--accent-fg); white-space: nowrap;
  background: color-mix(in srgb, var(--accent) 12%, var(--bg-ribbon));
  border-radius: var(--r-sm) var(--r-sm) 0 0;
  border-top: 2px solid var(--accent-fg);
  animation: ctx-in var(--dur-normal) var(--ease-decelerate) both; }
@keyframes ctx-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
:root[data-contextual="1"] .ctx-head { display: flex; }
/* The contextual tab itself is tinted for the whole of its own column. */
.tab[data-contextual]:not([hidden]) { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.tab[data-contextual]:not([hidden]):hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* Selectable objects drawn over the grid. They are absolutely positioned in
   the scrolling wrapper, so they scroll with the sheet the way a floating
   chart does. */
.obj { position: absolute; z-index: var(--z-grid-overlay);
  background: var(--bg-raised); border: var(--hair) solid var(--stroke-1);
  border-radius: var(--r-lg); box-shadow: var(--sh-raised); overflow: hidden;
  cursor: default; text-align: left;
  transition: box-shadow var(--dur-fast) var(--ease-standard),
              border-color var(--dur-fast) var(--ease-standard); }
.obj:hover { border-color: var(--stroke-hover); }
.obj[data-selected="1"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--sh-overlay); }
.obj-title { font-size: var(--fs-caption); font-weight: var(--fw-semi); color: var(--fg-1);
  padding: 8px 10px 2px; }
.obj-sub { font-size: 10px; color: var(--fg-3); padding: 0 10px 6px; }
.obj-handle { position: absolute; width: 7px; height: 7px; border-radius: var(--r-pill);
  background: var(--bg-raised); border: 1.5px solid var(--accent); display: none; }
.obj[data-selected="1"] .obj-handle { display: block; }

/* ==========================================================================
   24. BACKSTAGE (the File surface)
   A full-window takeover, not an overlay on the chrome: everything from the
   title strip to the status bar goes, exactly as Excel's does. It is a sibling
   of .app in the same stacking context.
   ========================================================================== */
.backstage { position: fixed; inset: 0; z-index: var(--z-backstage);
  display: none; background: var(--bg-ribbon); }
.backstage[data-open="1"] { display: flex; }
.backstage[data-open="1"] .bs-rail  { animation: bs-rail-in var(--dur-backstage) var(--ease-decelerate) both; }
.backstage[data-open="1"] .bs-pane  { animation: bs-pane-in var(--dur-normal) var(--ease-decelerate) 40ms both; }
.backstage[data-closing="1"] { animation: bs-out var(--dur-normal) var(--ease-accelerate) both; }
@keyframes bs-rail-in { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bs-pane-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bs-out { to { opacity: 0; transform: translateX(-10px); } }

.bs-rail { flex: none; width: 232px; background: var(--accent); color: var(--on-accent);
  display: flex; flex-direction: column; padding: 10px 0 12px; overflow-y: auto; }
@media (max-width: 1200px) { .bs-rail { width: 200px; } }
.bs-back { width: 36px; height: 36px; border-radius: var(--r-pill); margin: 0 0 14px 12px;
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  color: var(--on-accent);
  transition: background var(--dur-fast) var(--ease-standard); }
.bs-back:hover { background: color-mix(in srgb, var(--on-accent) 16%, transparent); }
.bs-back:active { background: color-mix(in srgb, var(--on-accent) 26%, transparent); }
.bs-nav { display: flex; flex-direction: column; }
.bs-item { position: relative; height: 40px; padding: 0 16px; display: flex; align-items: center;
  gap: 10px; font-size: var(--fs-tab); font-weight: var(--fw-med); color: var(--on-accent);
  text-align: left; opacity: .92;
  transition: background var(--dur-fast) var(--ease-standard), opacity var(--dur-fast) var(--ease-standard); }
.bs-item:hover { background: color-mix(in srgb, var(--on-accent) 14%, transparent); opacity: 1; }
.bs-item:active { background: color-mix(in srgb, var(--on-accent) 24%, transparent); }
.bs-item[aria-current="page"] { background: color-mix(in srgb, var(--on-accent) 22%, transparent); opacity: 1; font-weight: var(--fw-semi); }
.bs-item[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; border-radius: 0 2px 2px 0; background: var(--on-accent); }
.bs-item .ic { opacity: .9; }
.bs-sep { height: var(--hair); background: color-mix(in srgb, var(--on-accent) 24%, transparent); margin: 8px 16px; }
.bs-spring { flex: 1 1 auto; min-height: 8px; }

.bs-pane { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 34px 40px 40px;
  background: var(--bg-ribbon); scrollbar-gutter: stable; }
.bs-page { display: none; max-width: 1040px; }
.bs-page[data-active="1"] { display: block; }
.bs-h1 { font-size: 28px; line-height: 34px; font-weight: var(--fw-semi); color: var(--fg-1);
  margin: 0 0 26px; letter-spacing: -.01em; }
.bs-h2 { font-size: 13px; font-weight: var(--fw-semi); color: var(--fg-1); margin: 0 0 10px;
  letter-spacing: .01em; }
.bs-note { font-size: var(--fs-body); color: var(--fg-3); margin: 0 0 18px; max-width: 62ch; line-height: 1.55; }
.bs-split { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
@media (max-width: 1024px) { .bs-split { grid-template-columns: 1fr; } }
.bs-card { border: var(--hair) solid var(--stroke-1); border-radius: var(--r-panel);
  background: var(--bg-raised); box-shadow: var(--sh-raised); padding: 16px 18px; margin-bottom: 18px; }
.bs-card h3 { margin: 0 0 4px; font-size: var(--fs-tab); font-weight: var(--fw-semi); }
.bs-card p { margin: 0; font-size: var(--fs-body); color: var(--fg-3); line-height: 1.5; }
.bs-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px;
  padding: 8px 10px; border-radius: var(--r-md); text-align: left; color: var(--fg-1);
  transition: background var(--dur-fast) var(--ease-standard); }
.bs-row:hover { background: var(--fill-hover); }        /* rows tint, controls lift */
.bs-row:active { background: var(--fill-press); }
.bs-row .ic { color: var(--fg-2); flex: none; }
.bs-row-main { flex: 1 1 auto; min-width: 0; }
.bs-row-t { display: block; font-size: var(--fs-body); font-weight: var(--fw-med);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bs-row-s { display: block; font-size: var(--fs-caption); color: var(--fg-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bs-row-k { flex: none; font-size: var(--fs-caption); color: var(--fg-3);
  font-variant-numeric: tabular-nums; }
.bs-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 14px; }
.bs-tile { border: var(--hair) solid var(--stroke-1); border-radius: var(--r-lg); overflow: hidden;
  background: var(--bg-raised); text-align: left;
  transition: box-shadow var(--dur-fast) var(--ease-standard),
              border-color var(--dur-fast) var(--ease-standard),
              transform var(--dur-fast) var(--ease-standard); }
.bs-tile:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--sh-raised); }
.bs-tile:active { transform: scale(.99); transition-duration: var(--dur-instant); }
.bs-tile-face { height: 82px; display: block; background: var(--bg-sunken); position: relative; }
.bs-tile-name { display: block; padding: 8px 10px; font-size: var(--fs-body); font-weight: var(--fw-med); }
.bs-field { display: flex; align-items: baseline; gap: 10px; padding: 7px 0;
  border-bottom: var(--hair) solid var(--stroke-2); font-size: var(--fs-body); }
.bs-field:last-child { border-bottom: 0; }
.bs-field dt { flex: none; width: 132px; color: var(--fg-3); margin: 0; }
.bs-field dd { flex: 1 1 auto; margin: 0; color: var(--fg-1); }
.bs-input { width: 100%; height: 28px; padding: 0 8px; border-radius: var(--r-sm);
  border: var(--hair) solid var(--stroke-1); background: var(--bg-raised); color: var(--fg-1);
  font-size: var(--fs-input); outline: none;
  transition: border-color var(--dur-fast) var(--ease-standard); }
.bs-input:hover { border-color: var(--stroke-hover); }
.bs-input:focus { border-color: var(--accent); }
.bs-label { display: block; font-size: var(--fs-caption); color: var(--fg-3); margin: 12px 0 4px; }
.bs-btn { height: 32px; padding: 0 16px; border-radius: var(--r-md); background: var(--accent);
  color: var(--on-accent); font-size: var(--fs-body); font-weight: var(--fw-semi);
  display: inline-flex; align-items: center; gap: 8px;
  transition: background var(--dur-fast) var(--ease-standard); }
.bs-btn:hover { background: var(--accent-hover); }
.bs-btn:active { background: var(--accent-pressed); }
.bs-btn.ghost { background: transparent; color: var(--fg-1);
  box-shadow: inset 0 0 0 var(--hair) var(--stroke-1); }
.bs-btn.ghost:hover { background: var(--fill-hover); }
.bs-warn { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r-md);
  background: color-mix(in srgb, var(--warning) 12%, transparent);
  box-shadow: inset 0 0 0 var(--hair) var(--warning);
  font-size: var(--fs-body); color: var(--fg-1); line-height: 1.5; margin: 12px 0; }
.bs-warn .ic { color: var(--warning); flex: none; margin-top: 1px; }
.bs-empty { padding: 16px 0; font-size: var(--fs-body); color: var(--fg-3); }
/* Print preview: a real page proportion (ISO A4 is 1:1.414), drawn from tokens. */
.bs-preview { background: var(--bg-sunken); border-radius: var(--r-panel); padding: 22px;
  display: flex; flex-direction: column; align-items: center; gap: 12px; }
.bs-sheetpage { width: 100%; max-width: 320px; aspect-ratio: 1 / 1.414; background: var(--bg-raised);
  box-shadow: var(--sh-overlay); border-radius: 2px; padding: 20px 18px;
  display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
.bs-pp-title { font-size: 9px; font-weight: var(--fw-semi); color: var(--fg-1); }
.bs-pp-line { height: 5px; border-radius: 1px; background: var(--fill-hover); }
.bs-pp-line[data-h="1"] { background: color-mix(in srgb, var(--accent) 34%, transparent); }
.bs-pp-foot { margin-top: auto; font-size: 8px; color: var(--fg-3); text-align: center;
  font-variant-numeric: tabular-nums; }
.bs-pagenav { display: flex; align-items: center; gap: 10px; font-size: var(--fs-caption);
  color: var(--fg-3); font-variant-numeric: tabular-nums; }

/* ==========================================================================
   25. MODAL DIALOGS — the corner launchers open real ones.
   ========================================================================== */
.dlg-scrim { position: fixed; inset: 0; z-index: var(--z-scrim);
  background: var(--scrim);
  animation: fade-in var(--dur-fast) var(--ease-standard) both; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.dlg { position: fixed; z-index: var(--z-backstage); left: 50%; top: 50%;
  transform: translate(-50%, -50%); width: min(620px, calc(100vw - 40px));
  max-height: min(640px, calc(100vh - 60px)); display: flex; flex-direction: column;
  background: var(--bg-raised); border: var(--hair) solid var(--stroke-1);
  border-radius: 10px; box-shadow: var(--sh-flyout); overflow: hidden;
  animation: dlg-in var(--dur-normal) var(--ease-decelerate) both; }
@keyframes dlg-in { from { opacity: 0; transform: translate(-50%, -46%) scale(.985); }
                    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.dlg-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.dlg-title { flex: 1 1 auto; font-size: 15px; font-weight: var(--fw-semi); }
.dlg-x { width: 28px; height: 28px; border-radius: var(--r-sm); color: var(--fg-2);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.dlg-x:hover { background: var(--fill-hover); color: var(--fg-1); }
.dlg-x:active { background: var(--fill-press); }
.dlg-tabs { flex: none; display: flex; gap: 2px; padding: 0 12px;
  border-bottom: var(--hair) solid var(--stroke-2); }
.dlg-tab { height: 30px; padding: 0 12px; font-size: var(--fs-body); color: var(--fg-3);
  border-radius: var(--r-sm) var(--r-sm) 0 0; position: relative;
  transition: color var(--dur-fast) var(--ease-standard), background var(--dur-fast) var(--ease-standard); }
.dlg-tab:hover { background: var(--fill-hover); color: var(--fg-1); }
.dlg-tab[aria-selected="true"] { color: var(--fg-1); font-weight: var(--fw-semi); }
.dlg-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0;
  height: 2px; background: var(--accent-fg); border-radius: 1px 1px 0 0; }
.dlg-body { flex: 1 1 auto; overflow-y: auto; padding: 16px; scrollbar-gutter: stable; }
.dlg-panel { display: none; }
.dlg-panel[data-active="1"] { display: block;
  animation: bs-pane-in var(--dur-fast) var(--ease-decelerate) both; }
.dlg-foot { flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px;
  border-top: var(--hair) solid var(--stroke-2); background: var(--bg-window); }
.dlg-grid { display: grid; grid-template-columns: 160px 1fr; gap: 10px 14px; align-items: center; }
.dlg-grid > span { font-size: var(--fs-body); color: var(--fg-3); }
.dlg-list { border: var(--hair) solid var(--stroke-1); border-radius: var(--r-md);
  max-height: 210px; overflow-y: auto; background: var(--bg-raised); }
.dlg-opt { width: 100%; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px;
  font-size: var(--fs-body); text-align: left; color: var(--fg-1);
  transition: background var(--dur-fast) var(--ease-standard); }
.dlg-opt:hover { background: var(--fill-hover); }
.dlg-opt[aria-selected="true"] { background: var(--fill-selected); font-weight: var(--fw-med); }
.dlg-sample { border: var(--hair) solid var(--stroke-1); border-radius: var(--r-md);
  background: var(--bg-canvas); padding: 12px; font-size: 14px; color: var(--fg-1);
  font-variant-numeric: tabular-nums; min-height: 44px; display: flex; align-items: center; }
.dlg-kb { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; }
.dlg-kb div { display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-body);
  padding: 4px 0; border-bottom: var(--hair) solid var(--stroke-2); }
.dlg-kb b { font-weight: var(--fw-reg); color: var(--fg-3); }
.dlg-kb kbd { font: var(--fw-med) 11px/1 var(--font-mono); color: var(--fg-1);
  border: var(--hair) solid var(--stroke-1); border-radius: var(--r-xs); padding: 3px 5px; }

/* ==========================================================================
   26. KEYTIPS — Alt paints a badge on every reachable control.
   ========================================================================== */
.kt { position: fixed; z-index: var(--z-tooltip); pointer-events: none;
  min-width: 16px; height: 16px; padding: 0 3px; border-radius: var(--r-xs);
  background: var(--fg-1); color: var(--bg-ribbon);
  font: var(--fw-semi) 10px/16px var(--font-ui); text-align: center;
  letter-spacing: .04em; box-shadow: var(--sh-raised);
  animation: pop-in var(--dur-fast) var(--ease-decelerate) both; }
.kt[data-dim="1"] { opacity: .34; }

/* The width readout makes the authored fold ladder observable. */
.st-width { font-variant-numeric: tabular-nums; color: var(--fg-3); white-space: nowrap; }
.st-width b { font-weight: var(--fw-med); color: var(--fg-2); }

</style>
</head>

<div class="app">

  <!-- ================================================== 12. TITLE / QAT ===
       The strip names the DOCUMENT, never the product. The Quick Access
       Toolbar sits above the ribbon, which is where Excel puts it and where a
       user reaches for Save and Undo without leaving the tab they are on. -->
  <header class="titlebar band">
    <div class="tb-left">
      <button class="autosave" role="switch" aria-checked="true" data-act="autosave"
              data-tip="AutoSave|Changes are saved as you work.">
        <span class="autosave-track" aria-hidden="true"></span>
        <span class="autosave-label">AutoSave</span>
      </button>
      <span class="qat-sep" aria-hidden="true"></span>
      <div class="qat-group" role="toolbar" aria-label="Quick Access Toolbar" style="display:flex;align-items:center;gap:2px">
        <button class="qat" data-cmd="file.save" data-keytip="1" aria-label="Save"
                data-tip="Save|Ctrl+S"><svg class="ic"><use href="#i-save"/></svg></button>
        <span class="qat-split">
          <button class="qat qat-main" data-cmd="edit.undo" data-keytip="2" aria-label="Undo"
                  data-tip="Undo|Ctrl+Z"><svg class="ic"><use href="#i-undo"/></svg></button>
          <button class="qat qat-caret" data-cmd="edit.undo.history" data-pop="pop-undo"
                  aria-haspopup="menu" aria-expanded="false" aria-label="Undo history"
                  ><svg class="ic ic-tiny"><use href="#i-caret"/></svg></button>
        </span>
        <button class="qat" data-cmd="edit.redo" data-keytip="3" aria-label="Redo" disabled
                data-tip="Redo|Ctrl+Y"><svg class="ic"><use href="#i-redo"/></svg></button>
        <button class="qat" data-cmd="qat.customize" data-pop="pop-qat" aria-haspopup="menu"
                aria-expanded="false" aria-label="Customize Quick Access Toolbar"
                data-tip="Customize Quick Access Toolbar"><svg class="ic ic-tiny"><use href="#i-caret"/></svg></button>
      </div>
    </div>

    <div class="tb-centre">
      <span class="doc">
        <button class="doc-name" data-act="rename" data-tip="Rename|Click to rename this workbook.">Regional Sales FY26</button>
        <span class="doc-dot" data-modified="1" title="Unsaved changes" aria-hidden="true"></span>
        <span class="doc-state" data-role="docstate">Saved to this device</span>
      </span>
      <label class="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" placeholder="Search commands" aria-label="Search commands" data-role="search">
        <kbd>Alt Q</kbd>
      </label>
    </div>

    <div class="tb-right">
      <button class="qat" data-act="gaps" aria-pressed="false" aria-label="Show Excel coverage gaps"
              data-tip="Coverage legend|Outline every control Excel has that this build does not."><svg class="ic"><use href="#i-tag"/></svg></button>
      <button class="qat" data-act="theme" aria-label="Switch theme"
              data-tip="Theme|Light, dark or system."><svg class="ic" data-role="themeicon"><use href="#i-moon"/></svg></button>
      <button class="qat" data-cmd="ribbon.display" data-pop="pop-display" aria-haspopup="menu"
              aria-expanded="false" aria-label="Ribbon Display Options"
              data-tip="Ribbon Display Options|Ctrl+F1"><svg class="ic"><use href="#i-display"/></svg></button>
      <span class="qat-sep" aria-hidden="true"></span>
      <button class="account" data-cmd="file.account.user" data-gap="1" data-tip="Account|This build has no signed-in account.">
        <svg class="ic" style="display:none"><use href="#i-person"/></svg>
        <span class="avatar" aria-hidden="true">SS</span>
        <span class="account-name">Sachin S.</span>
      </button>
    </div>
  </header>

  <!-- ============================================= 13. RIBBON TAB STRIP ===
       File is a button, not a tab: it opens the backstage, which replaces the
       window rather than selecting a panel, so aria-selected would lie.
       Contextual tabs stay in the DOM at every moment and are hidden, never
       removed — otherwise the published command surface changes size with the
       selection. -->
  <div class="tabstrip band">
    <div class="tabstrip-lead">
      <button class="tab-file" data-act="backstage" aria-haspopup="dialog" aria-expanded="false"
              data-keytip="F" data-tip="File|Open the backstage.">File</button>
      <button class="tabscroll" data-act="tabs-left" aria-label="Scroll tabs left"><svg class="ic"><use href="#i-chev-left"/></svg></button>
    </div>
    <div class="tabstrip-scroll" data-role="tabscroll">
      <div class="tabs" role="tablist" aria-label="Ribbon" data-role="tabs">
        <button class="tab" role="tab" id="tab-home" data-tab="home" aria-controls="panel-home" aria-selected="true" tabindex="0" data-keytip="H">Home</button>
        <button class="tab" role="tab" id="tab-insert" data-tab="insert" aria-controls="panel-insert" aria-selected="false" tabindex="-1" data-keytip="N">Insert</button>
        <button class="tab" role="tab" id="tab-page-layout" data-tab="page-layout" aria-controls="panel-page-layout" aria-selected="false" tabindex="-1" data-keytip="P">Page Layout</button>
        <button class="tab" role="tab" id="tab-formulas" data-tab="formulas" aria-controls="panel-formulas" aria-selected="false" tabindex="-1" data-keytip="M">Formulas</button>
        <button class="tab" role="tab" id="tab-data" data-tab="data" aria-controls="panel-data" aria-selected="false" tabindex="-1" data-keytip="A">Data</button>
        <button class="tab" role="tab" id="tab-review" data-tab="review" aria-controls="panel-review" aria-selected="false" tabindex="-1" data-keytip="R">Review</button>
        <button class="tab" role="tab" id="tab-view" data-tab="view" aria-controls="panel-view" aria-selected="false" tabindex="-1" data-keytip="W">View</button>
        <button class="tab" role="tab" id="tab-help" data-tab="help" aria-controls="panel-help" aria-selected="false" tabindex="-1" data-keytip="Y">Help</button>
        <button class="tab" role="tab" id="tab-table-design" data-tab="table-design" data-contextual="table" aria-controls="panel-table-design" aria-selected="false" tabindex="-1" data-keytip="JT" hidden>Table Design</button>
        <button class="tab" role="tab" id="tab-chart-design" data-tab="chart-design" data-contextual="chart" aria-controls="panel-chart-design" aria-selected="false" tabindex="-1" data-keytip="JC" hidden>Chart Design</button>
        <button class="tab" role="tab" id="tab-format" data-tab="format" data-contextual="chart" aria-controls="panel-format" aria-selected="false" tabindex="-1" data-keytip="O" hidden>Format</button>
        <button class="tab" role="tab" id="tab-pivottable-analyze" data-tab="pivottable-analyze" data-contextual="pivot" aria-controls="panel-pivottable-analyze" aria-selected="false" tabindex="-1" data-keytip="JA" hidden>PivotTable Analyze</button>
        <button class="tab" role="tab" id="tab-pivottable-design" data-tab="pivottable-design" data-contextual="pivot" aria-controls="panel-pivottable-design" aria-selected="false" tabindex="-1" data-keytip="JD" hidden>PivotTable Design</button>
        <span class="ctx-head" data-role="ctxhead" aria-hidden="true"></span>
        <span class="tab-underline" data-role="underline" aria-hidden="true"></span>
      </div>
    </div>
    <div class="tabstrip-tools">
      <button class="tabscroll" data-act="tabs-right" aria-label="Scroll tabs right"><svg class="ic"><use href="#i-chev-right"/></svg></button>
      <button class="qat" data-act="collapse" aria-label="Collapse the ribbon"
              data-tip="Collapse the Ribbon|Ctrl+F1"><svg class="ic" data-role="collapseicon"><use href="#i-chev-up"/></svg></button>
    </div>
  </div>

  <!-- ==================================================== 14. RIBBON BODY ==
       Every tab renders into the DOM; inactive panels are hidden with CSS.
       Lazy rendering would make the published command list shrink and grow as
       the user switches tabs. -->
  <div class="ribbon band" role="region" aria-label="Ribbon commands">
    <div class="ribbon-scroll" data-role="ribbonscroll"></div>
  </div>

  <!-- ==================================================== 15. FORMULA BAR == -->
  <div class="formulabar band" role="group" aria-label="Formula bar">
    <span class="namebox">
      <input data-role="namebox" aria-label="Name Box" value="A1" spellcheck="false">
      <button class="fb-btn" data-cmd="formulas.name-box-list" data-pop="pop-names"

<!-- =========================================================== 19. TABS =====
     One template per tab. A template is filled by the tab controller on first
     activation and then stays in the DOM, so the command surface never changes
     size with the active tab.

     Controls the assignment marks status:"gap" carry data-gap="1": they render
     exactly like a live control (hover, press, focus, tooltip) and the coverage
     legend in the title strip outlines them.

     Where Excel puts a verb inside a split or menu, it lives in that control's
     popup template rather than inline — that is Excel's own layout, and it
     keeps every command one pointer step from its tab.
     ========================================================================= -->

              aria-label="Office Clipboard" data-tip="Clipboard pane|Not in this build."><svg class="ic ic-tiny"><use href="#i-launcher"/></svg></button>

<!-- ===================================================== 27. BACKSTAGE =====

     role="dialog" aria-modal="true", with the rail in the ACCENT token rather
     than a hard-coded green: a host that rebrands gets its own colour here,
     which is both the right behaviour and the reason this cannot read as
     another product's chrome.

     Every rail row names the command that backs it. Rows whose destination is
     a gap say so in the pane rather than being hidden — a rail entry that
     appears and disappears with content is worse than one with an honest
     empty state.

<!-- ========================================================= 20. POPUPS =====
     One controller drives every popup: it clones the template, positions it
     from the trigger's MEASURED rect while shown, traps Escape and closes on an
     outside click — except a click inside the panel, because a panel can hold a
     live input (a hex field, a font box) and a naive outside-click dismissal
     closes it out from under the control being typed into.
     data-build="…" defers the body to JS where the content is data (colour
     ramps, font lists, style faces) rather than markup.
     ========================================================================= -->

<!-- ================================== 29. SIMPLIFIED ROWS ============
     One authored row per tab. Every control is a PROXY: it carries
     data-proxy, never data-cmd, so switching layout cannot change the
     size of the published command surface. The trailing ellipsis takes
     whatever the row could not fit, WITH ITS LABEL and in group order —
     a floating box of unlabelled 16px glyphs is unreadable, and the
     overflow menu inherits that rule.
     ================================================================= -->

  </div>

    <div class="dlg-panel" data-dlgpanel="number" data-active="1">
      <div class="dlg-grid" style="grid-template-columns:180px 1fr">

<script>
/* ===========================================================================
   21. JS FOUNDATION
   Vanilla, no dependency. Everything a later pass needs is exposed on
   window.RIBBON so pass 2 and pass 3 add tabs without re-deriving any of this.
   =========================================================================== */
(function () {
"use strict";

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const root = document.documentElement;

/* --- 21.1 a transient echo line, so no control is silently dead ---------- */
const echo = document.createElement("span");
echo.setAttribute("data-role", "echo");
echo.style.color = "var(--accent-fg)";
$(".statusbar").insertBefore(echo, $('[data-role="selinfo"]').nextSibling);
let echoTimer = 0;
function say(msg) {
  echo.textContent = msg;
  clearTimeout(echoTimer);
  echoTimer = setTimeout(() => { echo.textContent = ""; }, 2600);
}

/* --- 21.2 command dispatch ----------------------------------------------
   A command IS its control: dispatch is a click on the node carrying the id,
   which is why every command in this prototype has exactly one such node. */
const commands = Object.create(null);
function runCommand(id) {
  const node = document.querySelector('[data-cmd="' + CSS.escape(id) + '"]');
  if (!node) throw new Error("unknown command: " + id);
  node.click();
}
function listCommands() {
  const seen = new Set();
  $$("[data-cmd]").forEach(n => seen.add(n.dataset.cmd));
  return Array.from(seen).sort();
}

/* --- 21.3 theme ---------------------------------------------------------- */
const themeIcon = $('[data-role="themeicon"] use');
function systemDark() { return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function resolvedDark() {
  const t = root.getAttribute("data-theme");
  return t ? t === "dark" : systemDark();
}
function syncThemeIcon() { themeIcon.setAttribute("href", resolvedDark() ? "#i-sun" : "#i-moon"); }
function setTheme(t) {
  if (t === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  syncThemeIcon();
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeIcon);
syncThemeIcon();

/* --- 21.4 tooltips: delayed, measured while shown, never a11y naming ----- */
let tipEl = null, tipTimer = 0;
function hideTip() { clearTimeout(tipTimer); if (tipEl) { tipEl.remove(); tipEl = null; } }
function showTip(host) {
  const raw = host.getAttribute("data-tip"); if (!raw) return;
  const parts = raw.split("|");
  tipEl = document.createElement("div");
  tipEl.className = "tip";
  const b = document.createElement("b"); b.textContent = parts[0]; tipEl.appendChild(b);
  if (parts[1]) { const s = document.createElement("span"); s.textContent = parts[1]; tipEl.appendChild(s); }
  if (host.hasAttribute("data-gap")) {
    const g = document.createElement("span");
    g.textContent = " Excel has this; this build does not.";
    g.style.color = "var(--warning)";
    tipEl.appendChild(g);
  }
  document.body.appendChild(tipEl);
  const r = host.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  let x = Math.min(Math.max(6, r.left), window.innerWidth - t.width - 6);
  let y = r.bottom + 6;
  if (y + t.height > window.innerHeight - 6) y = r.top - t.height - 6;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
/* EVERY icon-only control gets a tooltip, and it is derived rather than
   hand-authored where the markup already carries the name. 47 controls — every
   split-button caret half, every "… options" opener — had an aria-label and no
   data-tip, so a screen reader named them and a pointer got nothing. The
   accessible name stays the source of truth; the tooltip is a view of it. */
function seedTips(scope) {
  (scope || document).querySelectorAll(
    "[data-cmd],[data-proxy],[data-act]").forEach(n => {
    if (n.hasAttribute("data-tip")) return;
    const lbl = n.querySelector(".rc-label");
    if (lbl && lbl.textContent.trim() && !n.hasAttribute("aria-label")) return;
    const name = n.getAttribute("aria-label") ||
                 (lbl && lbl.textContent.trim()) || "";
    if (!name) return;
    const key = n.getAttribute("data-key") || n.getAttribute("aria-keyshortcuts") || "";
    n.setAttribute("data-tip", key ? name + "|" + key : name);
  });
}
let tipHost = null;
document.addEventListener("mouseover", e => {
  const host = e.target.closest("[data-tip]");
  if (host === tipHost) return;             /* moving icon -> label inside one
                                               control used to cancel and
                                               restart the timer, so a tooltip
                                               flickered instead of appearing */
  hideTip(); tipHost = host;
  if (!host) return;
  tipTimer = setTimeout(() => showTip(host), 380);
});
document.addEventListener("mouseout", e => {
  const host = e.target.closest("[data-tip]");
  if (!host) return;
  if (e.relatedTarget && host.contains(e.relatedTarget)) return;
  tipHost = null; hideTip();
});
document.addEventListener("mousedown", hideTip, true);
/* Keyboard arrivals get the tooltip too, immediately — a keyboard user roving
   the ribbon has no other way to read an icon-only control. */
document.addEventListener("focusin", e => {
  const host = e.target.closest && e.target.closest("[data-tip]");
  hideTip(); tipHost = host || null;
  if (host && host.matches(":focus-visible")) showTip(host);
});
document.addEventListener("focusout", () => { tipHost = null; hideTip(); });
window.addEventListener("scroll", hideTip, true);
window.addEventListener("blur", hideTip);

/* --- 21.5 popup controller ----------------------------------------------
   Clone the template, show it, THEN measure and place. Measuring a hidden
   panel yields 0x0 and makes every flip and clamp dead code. */
let openPop = null, openTrigger = null, scrim = null, moved = null;
function closePop(restoreFocus) {
  if (!openPop) return;
  const p = openPop, t = openTrigger;
  if (moved) {                       /* put the group's own controls back */
    moved.parent.insertBefore(moved.node, moved.before);
    moved = null;

    put("F" + row, { v: actual - plan, t: "n", fmt: "money", bar: 1, formula: "=E" + row + "-D" + row });
    put("G" + row, { v: (actual - plan) / plan, t: "n", fmt: "pct", scale: 1, formula: "=F" + row + "/D" + row });
  });

  put("D" + tr, { v: tp, t: "n", fmt: "money", total: 1, formula: "=SUM(D5:D" + (tr - 1) + ")" });
  put("E" + tr, { v: ta, t: "n", fmt: "money", total: 1, formula: "=SUM(E5:E" + (tr - 1) + ")" });
  put("F" + tr, { v: ta - tp, t: "n", fmt: "money", total: 1, formula: "=E" + tr + "-D" + tr });

  put("B" + (tr + 2), { v: "Notes", t: "s", b: 1 });

}

    const b = bounds();
    $$(".cell[data-sel]", sheetEl).forEach(n => n.removeAttribute("data-sel"));
    for (let r = b.r0; r <= b.r1; r++)
      for (let c = b.c0; c <= b.c1; c++) cellEls[r][c].dataset.sel = "1";
    colEls.forEach((h, c) => { if (h) h.dataset.hot = (c >= b.c0 && c <= b.c1) ? "1" : "0"; });
    rowEls.forEach((h, r) => { if (h) h.dataset.hot = (r >= b.r0 && r <= b.r1) ? "1" : "0"; });

    const a = cellEls[b.r0][b.c0].getBoundingClientRect();
    const z = cellEls[b.r1][b.c1].getBoundingClientRect();
    const host = sheetEl.getBoundingClientRect();
    selbox.hidden = false;
    selbox.style.left = (a.left - host.left) + "px";
    selbox.style.top = (a.top - host.top) + "px";
    selbox.style.width = (z.right - a.left) + "px";
    selbox.style.height = (z.bottom - a.top) + "px";

    nameBox.value = ref(anchor);
    const rec = data[ref(anchor)];
    fx.value = rec ? (rec.formula || (rec.t === "n" ? String(rec.v) : rec.v)) : "";
    const rows = b.r1 - b.r0 + 1, cols = b.c1 - b.c0 + 1;
    $('[data-role="selinfo"]').textContent = (rows * cols > 1) ? rows + "R × " + cols + "C" : "";
    stats(b);
    $$('[data-act="fx-cancel"], [data-act="fx-accept"]').forEach(n => { n.disabled = true; });
  }
  function stats(b) {
    let n = 0, sum = 0, count = 0;
    for (let r = b.r0; r <= b.r1; r++) for (let c = b.c0; c <= b.c1; c++) {
      const rec = data[colName(c) + r];
      if (!rec) continue;
      count++;
      if (rec.t === "n") { n++; sum += rec.v; }
    }
    const money0 = v => Math.abs(v) >= 1000 ? money.format(Math.round(v)) : (Math.round(v * 100) / 100).toLocaleString("en-US");
    $('[data-role="stat-count"]').textContent = String(count);
    $('[data-role="stat-sum"]').textContent = n ? money0(sum) : "—";
    $('[data-role="stat-avg"]').textContent = n ? money0(sum / n) : "—";
  }

  /* ======================================================================
     21.10b  DIRECT MANIPULATION
     Resize, autofit, reorder and freeze — the four gestures the real editor
     has and a mockup without them quietly denies. Every constant, every
     scope rule and every ordering decision below is taken from the product
     (`webapp/editor.geometry.js:423`, `webapp/editor.core.js:3550` and
     `:7488`, `webapp/editor.selection.js:685`) rather than re-derived, so
     what a reviewer tries here is what the editor already does.
     ====================================================================== */

  /* --- 1. measuring ------------------------------------------------------
     Everything is in client coordinates, because that is the one space the
     pointer, the sticky-frozen lines and the overlay all agree on. A FROZEN
     line ignores the scroll offset — it is pinned to the scrollport — which
     is the same correction `updateResize` makes with `index < f.fc ? 0 :
     state.scrollX`. Getting that wrong makes every gesture wrong by exactly
     the scroll distance, and only once the sheet has been scrolled, which is
     why it would not show up in a screenshot of the top-left corner. */
  function metrics() {
    const s = sheetEl.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    const f = fxHost.getBoundingClientRect();
    return { sx: s.left, sy: s.top, wx: w.left, wy: w.top, ww: w.width, wh: w.height,
             fx: f.left, fy: f.top, fw: f.width, fh: f.height };
  }
  function colStart(m, c) { return (c <= freeze.fc ? m.wx : m.sx) + colLeft(c); }
  function rowStart(m, r) { return (r <= freeze.fr ? m.wy : m.sy) + rowTop(r); }
  function colEdge(m, c)  { return colStart(m, c) + widthOf(c); }
  function rowEdge(m, r)  { return rowStart(m, r) + heightOf(r); }

  /* Which boundary the pointer is on, or 0. Returns the line whose TRAILING
     edge was grabbed, so grabbing the left edge of C resizes B — Excel's
     rule, and `boundaryAt`'s. */
  function colBoundaryAt(m, x) {
    for (let c = 1; c <= COLS; c++) {
      if (hiddenCols.has(c)) continue;
      if (Math.abs(x - colEdge(m, c)) <= RESIZE_GRAB) return c;
    }
    return 0;
  }
  function rowBoundaryAt(m, y) {
    for (let r = 1; r <= ROWS; r++) {
      if (hiddenRows.has(r)) continue;
      if (Math.abs(y - rowEdge(m, r)) <= RESIZE_GRAB) return r;
    }
    return 0;
  }
  function colAtX(m, x) {
    for (let c = 1; c <= COLS; c++) { if (!hiddenCols.has(c) && x < colEdge(m, c)) return c; }
    return COLS;
  }
  function rowAtY(m, y) {
    for (let r = 1; r <= ROWS; r++) { if (!hiddenRows.has(r) && y < rowEdge(m, r)) return r; }
    return ROWS;
  }
  /* Where a dragged band would land: the boundary nearest the band's LEADING
     edge, not the nearest to the pointer. Those differ whenever the band was
     grabbed anywhere but its left edge, and the leading edge is the one that
     tells the truth about the result. */
  function dropBeforeCol(m, lead) {
    let best = 1, bd = Infinity;
    for (let c = 1; c <= COLS + 1; c++) {
      const bx = c > COLS ? colEdge(m, COLS) : colStart(m, c);
      const d = Math.abs(lead - bx);
      if (d < bd) { bd = d; best = c; }
    }
    return best;
  }
  function dropBeforeRow(m, lead) {
    let best = 1, bd = Infinity;
    for (let r = 1; r <= ROWS + 1; r++) {
      const by = r > ROWS ? rowEdge(m, ROWS) : rowStart(m, r);
      const d = Math.abs(lead - by);
      if (d < bd) { bd = d; best = r; }
    }
    return best;
  }

  /* --- 2. the overlay ---------------------------------------------------- */
  let guideEl = null, dropEl = null, ghostEl = null, tipEl = null;
  let fzGrabC = null, fzGrabR = null;
  function fxNode(cls, axis) {

    guideEl = dropEl = ghostEl = tipEl = null;

    tipEl.style.left = Math.max(2, Math.min(m.fw - w - 2, x - m.fx + 12)) + "px";
    tipEl.style.top  = Math.max(2, Math.min(m.fh - h - 2, y - m.fy + 16)) + "px";
  }

  /* --- 3. resize ---------------------------------------------------------
     Scope mirrors `editor.geometry.js:429`: the whole sheet if select-all is
     live, the selected band if the grabbed line is inside it, otherwise the
     one line. Dragging one of six selected columns sizes all six. */
  function beginResize(axis, index, e) {
    const b = bounds();

    if (selKind === "all") { scope = "all"; b0 = 1; b1 = axis === "col" ? COLS : ROWS; }

    else if (axis === "row" && selKind === "rows" && index >= b.r0 && index <= b.r1) { scope = "band"; b0 = b.r0; b1 = b.r1; }

  function updateResize(x, y) {

    const start = g.axis === "col" ? colStart(m, g.index) : rowStart(m, g.index);
    const raw = ((g.axis === "col" ? x : y) - start) / zoom;
    g.preview = Math.max(MIN_LINE, Math.min(MAX_LINE, Math.round(raw)));
    const at = start + Math.round(g.preview * zoom);
    if (g.axis === "col") guideEl.style.left = (at - m.fx) + "px";
    else guideEl.style.top = (at - m.fy) + "px";
    const n = g.b1 - g.b0 + 1;

    const g = gdrag, list = [];

    if (g.axis === "col") list.forEach(c => { colW[c] = g.preview; hiddenCols.delete(c); });
    else list.forEach(r => { rowH[r] = g.preview; hiddenRows.delete(r); });
    applySizes(); syncHidden(); syncFreeze(); flash(g.axis, list);
    say((g.axis === "col" ? "Column width " : "Row height ") + g.preview + " px"
        + (list.length > 1 ? " — " + list.length + " lines" : ""));

  }

  /* --- 4. autofit --------------------------------------------------------
     A real measurement, not an estimate: the track is set to `max-content`
     (columns) or `min-content` (rows) for one frame and the browser is asked
     what it came to. Reimplementing the text metric is how the product's
     autofit ended up sizing rotated text as though it were flat. */
  function measureCol(c) {
    const parts = templateCols();
    parts[c] = "max-content";

  function measureRow(r) {

      else { hiddenRows.delete(i); rowH[i] = measureRow(i); }
    });
    applySizes(); syncHidden(); syncFreeze(); flash(axis, list);
    const one = list.length === 1;
    say("AutoFit " + (axis === "col"
      ? (one ? "column " + colName(list[0]) + " — " + colW[list[0]] + " px"
             : list.length + " columns")
      : (one ? "row " + list[0] + " — " + rowH[list[0]] + " px"
             : list.length + " rows")));
    render();
  }

  /* --- 5. reorder --------------------------------------------------------
     `grab` is `px0`/`py0` from editor.core.js:7503: where the band was taken
     hold of. The ghost follows the pointer by THAT offset rather than
     centring on it, so a wide band grabbed near its right edge does not jump
     left the instant the pointer moves. */

    let size = 0;
    for (let i = at; i < at + count; i++) size += axis === "col" ? widthOf(i) : heightOf(i);
    const start = axis === "col" ? colStart(m, at) : rowStart(m, at);
    gdrag = { kind: "move", axis, at, count, size, before: at,

    document.body.dataset.gdrag = "move";
    ghostEl = fxNode("gfx-ghost");
    dropEl  = fxNode("gfx-drop", axis === "col" ? "v" : "h");
    if (axis === "col") { ghostEl.style.top = "0"; ghostEl.style.bottom = "0"; ghostEl.style.width = size + "px"; }
    else { ghostEl.style.left = "0"; ghostEl.style.right = "0"; ghostEl.style.height = size + "px"; }
    setMode(axis === "col" ? "Move columns" : "Move rows");
    updateMove(e.clientX, e.clientY);
    e.preventDefault();
  }
  function updateMove(x, y) {
    const m = metrics(), g = gdrag;
    const lead = (g.axis === "col" ? x : y) - g.grab;
    if (g.axis === "col") ghostEl.style.left = (lead - m.fx) + "px";
    else ghostEl.style.top = (lead - m.fy) + "px";
    let before = g.axis === "col" ? dropBeforeCol(m, lead) : dropBeforeRow(m, lead);
    /* Dropping inside the band itself is a no-op; the indicator says so by
       sitting on the band's own leading edge rather than vanishing. */
    if (before > g.at && before <= g.at + g.count) before = g.at;
    g.before = before;
    const N = g.axis === "col" ? COLS : ROWS;
    const at = g.axis === "col"
      ? (before > N ? colEdge(m, N) : colStart(m, before))
      : (before > N ? rowEdge(m, N) : rowStart(m, before));
    if (g.axis === "col") { dropEl.style.left = (at - m.fx) + "px"; dropEl.style.top = "0"; dropEl.style.bottom = "0"; }
    else { dropEl.style.top = (at - m.fy) + "px"; dropEl.style.left = "0"; dropEl.style.right = "0"; }
    const moved = !(before > g.at && before <= g.at + g.count) && before !== g.at;
    setTip(m, g.axis === "col"
      ? (moved ? "Move to before column " + (before > COLS ? "end" : colName(before)) : "Back where it started")

  }
  function commitMove() {
    const g = gdrag;
    if (g.before === g.at || (g.before > g.at && g.before <= g.at + g.count)) {

    }

  function moveBand(axis, at, count, before) {
    const N = axis === "col" ? COLS : ROWS;

    for (let i = 1; i <= N; i++) order.push(i);
    const band = order.splice(at - 1, count);
    let ins = before - 1;
    if (before > at) ins -= count;
    order.splice.apply(order, [ins, 0].concat(band));
    reindex(axis, order);
    const newAt = ins + 1;
    selKind = axis === "col" ? "cols" : "rows";
    if (axis === "col") selectRange({ r: 1, c: newAt }, { r: ROWS, c: newAt + count - 1 });
    else selectRange({ r: newAt, c: 1 }, { r: newAt + count - 1, c: COLS });
    const list = []; for (let i = newAt; i < newAt + count; i++) list.push(i);
    flash(axis, list);
    say(axis === "col"
      ? "Moved " + count + " column" + (count > 1 ? "s" : "") + " to " + colName(newAt)
      : "Moved " + count + " row" + (count > 1 ? "s" : "") + " to " + newAt);
  }

  /* --- 6. insert / delete / hide -----------------------------------------
     All four are the same operation: a permutation of the line indices, where
     0 means "a line that did not exist before". One code path, so a bug in
     the remap cannot be fixed in three places and missed in the fourth. */
  function insertLines(axis, at, count) {
    const N = axis === "col" ? COLS : ROWS;
    const order = [];
    for (let i = 1; i < at; i++) order.push(i);
    for (let k = 0; k < count; k++) order.push(0);
    for (let i = at; order.length < N; i++) order.push(i);
    reindex(axis, order);
    const list = []; for (let i = at; i < at + count; i++) list.push(i);
    flash(axis, list);
  }
  function removeLines(axis, at, count) {
    const N = axis === "col" ? COLS : ROWS;

    for (let k = 0; k < count; k++) order.push(0);

  /* `order[k]` is the line that is about to become line k+1, or 0 for a fresh
     blank one. Data, sizes, hidden flags and formula references all move
     together — a formula left pointing at the letter it used to sit beside is
     the single most visible way a reorder can look broken. */
  function reindex(axis, order) {
    const map = {};
    order.forEach((o, k) => { if (o) map[o] = k + 1; });
    const nd = {};
    Object.keys(data).forEach(key => {
      const mm = /^([A-Z]+)(\d+)$/.exec(key);
      if (!mm) return;
      const c = colNum(mm[1]), r = +mm[2];
      const nc = axis === "col" ? map[c] : c;
      const nr = axis === "row" ? map[r] : r;
      if (!nc || !nr) return;                       /* the line went away */
      nd[colName(nc) + nr] = data[key];
    });
    Object.keys(nd).forEach(k => {
      const rec = nd[k];
      if (rec && rec.formula) rec.formula = remapRefs(rec.formula, axis, map);
    });
    data = nd;
    if (axis === "col") {
      const nw = [0], nh = [];
      order.forEach((o, k) => { nw[k + 1] = o ? colW[o] : 78; if (o && hiddenCols.has(o)) nh.push(k + 1); });
      colW = nw; hiddenCols.clear(); nh.forEach(v => hiddenCols.add(v));
    } else {
      const nr = [0], nh = [];
      order.forEach((o, k) => { nr[k + 1] = o ? rowH[o] : ROWH; if (o && hiddenRows.has(o)) nh.push(k + 1); });
      rowH = nr; hiddenRows.clear(); nh.forEach(v => hiddenRows.add(v));

  function colNum(s) { let n = 0; for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
  function remapRefs(f, axis, map) {
    return String(f).replace(/(\$?)([A-Z]{1,2})(\$?)(\d{1,3})/g, (s, d1, L, d2, D) => {
      const c = colNum(L), r = +D;

      return d1 + colName(nc) + d2 + nr;

  /* --- 7. freeze ---------------------------------------------------------
     Sticky positioning, one scroller. The frozen lines keep their natural
     offsets and pin at them, which is why `colStart` only has to drop the
     scroll term for a frozen line rather than maintain a second coordinate
     space for the frozen quadrant. */
  let lastFreeze = { fc: 0, fr: 0 };
  function syncFreeze() {
    const fc = freeze.fc, fr = freeze.fr;
    if (corner) { corner.dataset.fc = fc ? "1" : "0"; corner.dataset.fr = fr ? "1" : "0"; }
    const touch = fc || fr || lastFreeze.fc || lastFreeze.fr;
    if (touch) {
      for (let c = 1; c <= COLS; c++) {
        const h = colEls[c]; if (!h) continue;
        if (c <= fc) { h.dataset.frzc = "1"; h.style.position = "sticky"; h.style.left = colLeft(c) + "px"; }
        else { delete h.dataset.frzc; h.style.left = ""; h.style.position = ""; }
        flag(h, "fzv", c === fc);

        const rh = rowEls[r]; if (!rh) continue;
        if (r <= fr) { rh.dataset.frzr = "1"; rh.style.top = rowTop(r) + "px"; }
        else { delete rh.dataset.frzr; rh.style.top = ""; }
        flag(rh, "fzh", r === fr);
        const row = cellEls[r];
        for (let c = 1; c <= COLS; c++) {
          const el = row[c]; if (!el) continue;
          if (c <= fc) { el.dataset.frzc = "1"; el.style.left = colLeft(c) + "px"; }
          else { delete el.dataset.frzc; el.style.left = ""; }
          if (r <= fr) { el.dataset.frzr = "1"; el.style.top = rowTop(r) + "px"; }

  function placeFreezeGrabs() {
    const m = metrics();

      if (!fzGrabC) {
        fzGrabC = fxNode("gfx-fzgrab", "v");
        fzGrabC.setAttribute("data-tip", "Freeze divider|Drag to move it, or into the header to remove it.");
        fzGrabC.addEventListener("mousedown", e => { if (e.button === 0) beginFreezeDrag("col", e); });
      }
      fzGrabC.style.left = (colEdge(m, freeze.fc) - m.fx) + "px";
      fzGrabC.style.top = "0"; fzGrabC.style.bottom = "0";
    } else if (fzGrabC) { fzGrabC.remove(); fzGrabC = null; }
    if (freeze.fr > 0) {
      if (!fzGrabR) {
        fzGrabR = fxNode("gfx-fzgrab", "h");
        fzGrabR.setAttribute("data-tip", "Freeze divider|Drag to move it, or into the header to remove it.");
        fzGrabR.addEventListener("mousedown", e => { if (e.button === 0) beginFreezeDrag("row", e); });
      }
      fzGrabR.style.top = (rowEdge(m, freeze.fr) - m.fy) + "px";

    document.body.dataset.gdrag = axis === "col" ? "col" : "row";
    guideEl = fxNode("gfx-guide", axis === "col" ? "v" : "h");
    setMode("Freeze panes");

  function updateFreezeDrag(x, y) {

      guideEl.style.left = (at - m.fx) + "px";
      guideEl.style.top = "0"; guideEl.style.bottom = "0";

      n = y <= m.wy + hdrH() + 2 ? 0 : Math.max(0, rowAtY(m, y) - 1);
      at = n > 0 ? rowEdge(m, n) : m.wy + hdrH();
      guideEl.style.top = (at - m.fy) + "px";
      guideEl.style.left = "0"; guideEl.style.right = "0";

  function commitFreezeDrag() {
    const g = gdrag;
    if (g.axis === "col") freeze.fc = g.n; else freeze.fr = g.n;
    syncFreeze();
    say(freeze.fc || freeze.fr
      ? "Frozen — " + freeze.fr + " row" + (freeze.fr === 1 ? "" : "s")
        + ", " + freeze.fc + " column" + (freeze.fc === 1 ? "" : "s")
      : "Panes unfrozen");
    render();
  }
  function setFreeze(fr, fc) {
    freeze = { fr, fc }; syncFreeze();
    say(fr || fc ? "Frozen — " + fr + " row" + (fr === 1 ? "" : "s") + ", "
                   + fc + " column" + (fc === 1 ? "" : "s") : "Panes unfrozen");
    render();
  }

  /* --- 8. hidden lines, repaint, flash ----------------------------------- */
  function flag(el, name, on) { if (on) el.dataset[name] = "1"; else delete el.dataset[name]; }
  function syncHidden() {
    for (let c = 1; c <= COLS; c++) {
      const hid = hiddenCols.has(c), h = colEls[c]; if (!h) continue;
      flag(h, "hid", hid);
      flag(h, "hidprev", !hid && c > 1 && hiddenCols.has(c - 1));
    }
    for (let r = 1; r <= ROWS; r++) {
      const hidR = hiddenRows.has(r), rh = rowEls[r]; if (!rh) continue;
      flag(rh, "hid", hidR);
      flag(rh, "hidprev", !hidR && r > 1 && hiddenRows.has(r - 1));
      const row = cellEls[r];
      for (let c = 1; c <= COLS; c++) if (row[c]) flag(row[c], "hid", hidR || hiddenCols.has(c));
    }
  }
  function repaintAll() {
    const maxBar = Math.max.apply(null, Object.keys(data)
      .filter(k => data[k].bar).map(k => Math.abs(data[k].v)).concat([1]));
    const wipe = ["num", "b", "muted", "total", "title", "hdr", "spill", "scale", "sel", "active", "just"];
    for (let r = 1; r <= ROWS; r++) {
      const row = cellEls[r];
      for (let c = 1; c <= COLS; c++) {
        const el = row[c]; if (!el) continue;
        el.textContent = "";
        wipe.forEach(k => { delete el.dataset[k]; });
        const rec = data[colName(c) + r];
        if (rec) {
          rec.spill = rec.t === "s" && !data[colName(c + 1) + r] && !data[colName(c + 2) + r];
          paint(el, rec, maxBar);
        }
      }
    }
  }
  let flashTimer = 0, flashEls = [];
  function flash(axis, list) {
    /* Clear the PREVIOUS flash's elements as well as this one's. One shared
       timer means a second gesture inside 500 ms cancels the first cleanup,
       and `animation-fill-mode: both` then leaves `data-just` stuck on those
       cells — where it holds a `box-shadow` that would silently eat the
       hidden-line mark on a header. */
    flashEls.forEach(el => { delete el.dataset.just; });
    const els = [];
    list.forEach(i => {
      if (axis === "col") { if (colEls[i]) els.push(colEls[i]); for (let r = 1; r <= ROWS; r++) if (cellEls[r] && cellEls[r][i]) els.push(cellEls[r][i]); }
      else { if (rowEls[i]) els.push(rowEls[i]); const row = cellEls[i] || []; for (let c = 1; c <= COLS; c++) if (row[c]) els.push(row[c]); }
    });
    els.forEach(el => { delete el.dataset.just; });
    requestAnimationFrame(() => els.forEach(el => { el.dataset.just = "1"; }));
    flashEls = els;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { els.forEach(el => { delete el.dataset.just; }); flashEls = []; }, 500);
  }
  function setMode(text) { const n = $('[data-role="mode"]'); if (n) n.textContent = text; }

  /* --- 9. the header gestures -------------------------------------------- */
  function bandList(axis) {
    const b = bounds(), out = [];
    if (axis === "col") for (let c = b.c0; c <= b.c1; c++) out.push(c);
    else for (let r = b.r0; r <= b.r1; r++) out.push(r);
    return out;
  }
  function headerDown(axis, index, e) {
    /* The right button does not move the selection — `mousedown` fires before
       `contextmenu`, and a right-click that collapses the selection first is
       how "Ctrl+A then right-click" lost the whole sheet in the product. */
    if (e.button !== 0) return;
    if (e.target.closest(".fzh")) return;
    const m = metrics();
    const b = axis === "col" ? colBoundaryAt(m, e.clientX) : rowBoundaryAt(m, e.clientY);
    if (b) { beginResize(axis, b, e); return; }
    const s = bounds();
    const inBand = axis === "col"
      ? (selKind === "cols" && index >= s.c0 && index <= s.c1)
      : (selKind === "rows" && index >= s.r0 && index <= s.r1);
    if (inBand && !e.shiftKey && !e.metaKey && !e.ctrlKey) { beginMove(axis, e); return; }
    selKind = axis === "col" ? "cols" : "rows";
    if (axis === "col") selectRange(e.shiftKey ? { r: 1, c: anchor.c } : { r: 1, c: index }, { r: ROWS, c: index });
    else selectRange(e.shiftKey ? { r: anchor.r, c: 1 } : { r: index, c: 1 }, { r: index, c: COLS });
    dragging = true; headerDrag = axis;
    selectObject(null);
    sheetEl.focus(); e.preventDefault();
  }
  function headerDouble(axis, index, e) {
    const m = metrics();
    const b = axis === "col" ? colBoundaryAt(m, e.clientX) : rowBoundaryAt(m, e.clientY);
    if (!b) return;
    e.preventDefault();
    const s = bounds();
    const inBand = axis === "col"
      ? (selKind === "cols" && b >= s.c0 && b <= s.c1)
      : (selKind === "rows" && b >= s.r0 && b <= s.r1);
    autofit(axis, inBand ? bandList(axis) : [b]);
  }
  let headerDrag = null, hoverGrab = null;
  function setGrab(el, kind) {
    if (hoverGrab && hoverGrab !== el) delete hoverGrab.dataset.grab;
    hoverGrab = el;
    if (!el) return;
    if (kind) el.dataset.grab = kind; else delete el.dataset.grab;
  }
  sheetEl.addEventListener("mousemove", e => {
    if (gdrag) return;
    const ch = e.target.closest(".colhead"), rh = e.target.closest(".rowhead");
    if (!ch && !rh) { setGrab(null); return; }
    const m = metrics(), s = bounds();
    if (ch) {
      const c = +ch.dataset.c;
      setGrab(ch, colBoundaryAt(m, e.clientX) ? "edge"
        : (selKind === "cols" && c >= s.c0 && c <= s.c1) ? "move" : "");
    } else {
      const r = +rh.dataset.r;
      setGrab(rh, rowBoundaryAt(m, e.clientY) ? "edge"
        : (selKind === "rows" && r >= s.r0 && r <= s.r1) ? "move" : "");
    }
  });
  sheetEl.addEventListener("mouseleave", () => { if (!gdrag) setGrab(null); });

  sheetEl.addEventListener("mousedown", e => {
    const cell = e.target.closest(".cell"); if (!cell) return;
    if (e.button !== 0) return;
    const p = { r: +cell.dataset.r, c: +cell.dataset.c };
    selKind = "cells";
    if (e.shiftKey) selectRange(anchor, p); else selectRange(p, p);
    dragging = true; e.preventDefault(); sheetEl.focus();
    selectObject(null);
    setContext(inTable(p) ? "table" : null);
  });
  sheetEl.addEventListener("mouseover", e => {
    if (!dragging || gdrag) return;
    if (headerDrag === "col") {
      const h = e.target.closest(".colhead");
      if (h) { selectRange({ r: 1, c: anchor.c }, { r: ROWS, c: +h.dataset.c }); return; }
    }
    if (headerDrag === "row") {
      const h = e.target.closest(".rowhead");
      if (h) { selectRange({ r: anchor.r, c: 1 }, { r: +h.dataset.r, c: COLS }); return; }
    }
    const cell = e.target.closest(".cell"); if (!cell) return;
    selectRange(anchor, { r: +cell.dataset.r, c: +cell.dataset.c });
  });
  window.addEventListener("mousemove", e => {
    if (!gdrag) return;
    if (gdrag.kind === "resize") updateResize(e.clientX, e.clientY);
    else if (gdrag.kind === "move") updateMove(e.clientX, e.clientY);
    else if (gdrag.kind === "freeze") updateFreezeDrag(e.clientX, e.clientY);
  });
  window.addEventListener("mouseup", () => {
    dragging = false; headerDrag = null;
    if (!gdrag) return;
    const kind = gdrag.kind;
    if (kind === "resize") commitResize();
    else if (kind === "move") commitMove();
    else if (kind === "freeze") commitFreezeDrag();
    gdrag = null;
    clearFx();
    delete document.body.dataset.gdrag;
    setMode("Ready");
  });
  window.addEventListener("resize", () => { if (!gdrag) placeFreezeGrabs(); });

  /* --- 10. the header context menu --------------------------------------- */
  let menuAnchor = null;
  function openHeaderMenu(name, e, label) {
    if (menuAnchor) menuAnchor.remove();
    menuAnchor = document.createElement("div");
    menuAnchor.tabIndex = -1;
    menuAnchor.setAttribute("aria-label", label);
    menuAnchor.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"
      + "left:" + e.clientX + "px;top:" + e.clientY + "px";
    document.body.appendChild(menuAnchor);
    const pop = popup(menuAnchor, name);
    if (!pop) return;
    /* A verb that cannot bite is drawn disabled rather than left to fail
       silently — Unhide with nothing hidden, Unfreeze with nothing frozen. */
    const off = (cmd, when) => {
      const n = pop.querySelector('[data-gridcmd="' + cmd + '"]');
      if (n && when) { n.disabled = true; n.setAttribute("aria-disabled", "true"); }
    };
    off("col-unhide", hiddenCols.size === 0);
    off("row-unhide", hiddenRows.size === 0);
    off("unhide-all", hiddenCols.size === 0 && hiddenRows.size === 0);
    off("unfreeze", !freeze.fc && !freeze.fr);
  }
  sheetEl.addEventListener("contextmenu", e => {
    const ch = e.target.closest(".colhead");
    const rh = e.target.closest(".rowhead");
    const cn = e.target.closest(".corner");
    if (!ch && !rh && !cn) return;
    e.preventDefault();
    const s = bounds();
    if (ch) {
      const c = +ch.dataset.c;
      if (!(selKind === "cols" && c >= s.c0 && c <= s.c1)) { selKind = "cols"; selectRange({ r: 1, c }, { r: ROWS, c }); }
      openHeaderMenu("hdr-col", e, "Column " + colName(c) + " menu");
    } else if (rh) {
      const r = +rh.dataset.r;
      if (!(selKind === "rows" && r >= s.r0 && r <= s.r1)) { selKind = "rows"; selectRange({ r, c: 1 }, { r, c: COLS }); }
      openHeaderMenu("hdr-row", e, "Row " + r + " menu");
    } else {
      openHeaderMenu("hdr-corner", e, "Sheet corner menu");
    }
  });

  /* --- 11. the Resize modal ----------------------------------------------
     A real modal, not `window.prompt` — the product removed its last native
     prompt for this exact dialog (UX-DLG-02). The selection is captured when
     the dialog OPENS, because a modal's answer can arrive a minute later and
     the size has to apply to the lines the menu was opened on. */
  function openSizeDialog(axis) {
    const isCol = axis === "col";
    const b = bounds();
    const b0 = isCol ? b.c0 : b.r0, b1 = isCol ? b.c1 : b.r1;
    const n = b1 - b0 + 1;
    const span = isCol
      ? (n === 1 ? "column " + colName(b0) : "columns " + colName(b0) + "–" + colName(b1))
      : (n === 1 ? "row " + b0 : "rows " + b0 + "–" + b1);
    openDialog("resize");
    const dlg = document.querySelector(".dlg");
    if (!dlg) return;
    dlg.querySelector(".dlg-title").textContent = "Resize " + span;
    dlg.querySelector('[data-role="resize-label"]').textContent = isCol ? "Width" : "Height";
    const note = dlg.querySelector('[data-role="resize-note"]');
    note.textContent = n === 1
      ? "Between " + MIN_LINE + " and " + MAX_LINE + " px."
      : "Applies to all " + n + " selected " + (isCol ? "columns" : "rows") + ". Between "
        + MIN_LINE + " and " + MAX_LINE + " px.";
    const input = dlg.querySelector('[data-role="resize-px"]');
    const err = dlg.querySelector('[data-role="resize-err"]');
    input.value = String(isCol ? colW[b0] : rowH[b0]);
    const apply = () => {
      const raw = input.value.trim();
      const v = /^\d{1,4}$/.test(raw) ? +raw : NaN;
      if (!Number.isFinite(v) || v < MIN_LINE || v > MAX_LINE) {
        err.hidden = false;
        err.textContent = "Enter a whole number of pixels between " + MIN_LINE + " and " + MAX_LINE + ".";
        input.setAttribute("aria-invalid", "true");
        input.focus(); input.select();
        return;
      }
      const list = [];
      for (let i = b0; i <= b1; i++) {
        list.push(i);
        if (isCol) { colW[i] = v; hiddenCols.delete(i); } else { rowH[i] = v; hiddenRows.delete(i); }
      }
      applySizes(); syncHidden(); syncFreeze(); flash(axis, list);
      say((isCol ? "Width " : "Height ") + v + " px — " + span);
      closeDialog(true); render();
    };
    /* The generic footer OK says "<title> applied" and closes. Replacing the
       node rather than adding a listener is what drops that handler. */
    const ok = dlg.querySelector(".dlg-foot .bs-btn:not(.ghost)");
    if (ok) { const fresh = ok.cloneNode(true); ok.replaceWith(fresh); fresh.addEventListener("click", apply); }
    input.addEventListener("input", () => { err.hidden = true; input.removeAttribute("aria-invalid"); });
    input.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); apply(); } });
    input.focus(); input.select();
  }

  /* --- 12. what the context menu runs ------------------------------------ */
  function headerCommand(id) {
    const b = bounds();
    const cn = b.c1 - b.c0 + 1, rn = b.r1 - b.r0 + 1;
    switch (id) {
      case "col-insert": insertLines("col", b.c0, cn); say("Inserted " + cn + " column" + (cn > 1 ? "s" : "")); break;
      case "row-insert": insertLines("row", b.r0, rn); say("Inserted " + rn + " row" + (rn > 1 ? "s" : "")); break;
      case "col-delete": removeLines("col", b.c0, cn); say("Deleted " + cn + " column" + (cn > 1 ? "s" : "")); break;
      case "row-delete": removeLines("row", b.r0, rn); say("Deleted " + rn + " row" + (rn > 1 ? "s" : "")); break;
      case "col-clear": case "row-clear": {
        for (let r = b.r0; r <= b.r1; r++) for (let c = b.c0; c <= b.c1; c++) delete data[colName(c) + r];
        repaintAll(); say("Contents cleared"); break;
      }
      case "col-hide": for (let c = b.c0; c <= b.c1; c++) hiddenCols.add(c);
        applySizes(); syncHidden(); syncFreeze(); say("Hid " + cn + " column" + (cn > 1 ? "s" : "")); break;
      case "row-hide": for (let r = b.r0; r <= b.r1; r++) hiddenRows.add(r);
        applySizes(); syncHidden(); syncFreeze(); say("Hid " + rn + " row" + (rn > 1 ? "s" : "")); break;
      case "col-unhide": {
        /* Excel unhides what is inside the selection AND what is pinched
           between its edges — the only way to reach a column whose neighbours
           are the only thing you can still select. */
        let n = 0;
        for (let c = Math.max(1, b.c0 - 1); c <= Math.min(COLS, b.c1 + 1); c++)
          if (hiddenCols.delete(c)) n++;
        applySizes(); syncHidden(); syncFreeze();
        say(n ? "Unhid " + n + " column" + (n > 1 ? "s" : "") : "Nothing hidden here"); break;
      }
      case "row-unhide": {
        let n = 0;
        for (let r = Math.max(1, b.r0 - 1); r <= Math.min(ROWS, b.r1 + 1); r++)
          if (hiddenRows.delete(r)) n++;
        applySizes(); syncHidden(); syncFreeze();
        say(n ? "Unhid " + n + " row" + (n > 1 ? "s" : "") : "Nothing hidden here"); break;
      }
      case "unhide-all": {
        const n = hiddenCols.size + hiddenRows.size;
        hiddenCols.clear(); hiddenRows.clear();
        applySizes(); syncHidden(); syncFreeze(); say(n ? "Unhid " + n + " lines" : "Nothing hidden"); break;
      }
      case "col-width": openSizeDialog("col"); break;
      case "row-height": openSizeDialog("row"); break;
      case "col-autofit": autofit("col", bandList("col")); break;
      case "row-autofit": autofit("row", bandList("row")); break;
      case "freeze-col": setFreeze(freeze.fr, b.c1); break;
      case "freeze-row": setFreeze(b.r1, freeze.fc); break;
      case "freeze-top-row": setFreeze(1, 0); break;
      case "freeze-first-col": setFreeze(0, 1); break;
      case "freeze-at-sel": setFreeze(Math.max(0, b.r0 - 1), Math.max(0, b.c0 - 1)); break;
      case "unfreeze": setFreeze(0, 0); break;
      case "cut": say("Cut"); break;
      case "copy": say("Copy"); break;
      default: say(id);
    }
    if (id !== "col-width" && id !== "row-height") render();
  }

  sheetEl.addEventListener("keydown", e => {
    const step = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!step) return;
    e.preventDefault();
    const p = e.shiftKey ? focusCell : anchor;
    const n = { r: Math.min(ROWS, Math.max(1, p.r + step[0])), c: Math.min(COLS, Math.max(1, p.c + step[1])) };
    if (e.shiftKey) selectRange(anchor, n); else selectRange(n, n);
    cellEls[n.r][n.c].scrollIntoView({ block: "nearest", inline: "nearest" });
  });
  fx.addEventListener("input", () => {
    $$('[data-act="fx-cancel"], [data-act="fx-accept"]').forEach(n => { n.disabled = false; });
    $('[data-role="mode"]').textContent = "Edit";
  });
  nameBox.addEventListener("change", () => gotoRef(nameBox.value));
  function gotoRef(text) {
    const m = /^([A-Za-z]{1,2})(\d{1,3})$/.exec(String(text).trim());
    if (!m) { render(); return; }
    let c = 0; for (const ch of m[1].toUpperCase()) c = c * 26 + (ch.charCodeAt(0) - 64);
    const r = Math.min(ROWS, Math.max(1, +m[2]));
    c = Math.min(COLS, Math.max(1, c));
    selectRange({ r, c }, { r, c });
    cellEls[r][c].scrollIntoView({ block: "center", inline: "center" });
    sheetEl.focus();
  }
  function setZoom(z) {
    zoom = z;
    applySizes();
    sheetEl.style.setProperty("--gz", String(zoom));
    /* Zoom moves every frozen offset and therefore the dividers too. */
    syncFreeze();
    requestAnimationFrame(render);
  }
  /* Arrow-key movement changes the context too, or the tabs would only follow
     the pointer. */
  sheetEl.addEventListener("keyup", e => {
    if (e.key.indexOf("Arrow") === 0) setContext(inTable(anchor) ? "table" : null);
  });
  return { build, gotoRef, setZoom, headerCommand, setFreeze, autofit, moveBand,
    /* Read-only views, for the smoke checks and for anything that needs to
       know the shape of the grid without being able to corrupt it. */
    sizes() { return { colW: colW.slice(), rowH: rowH.slice(),
                       freeze: { fc: freeze.fc, fr: freeze.fr },
                       hiddenCols: Array.from(hiddenCols), hiddenRows: Array.from(hiddenRows),
                       selKind }; },
    cellText(r, c) { return cellEls[r] && cellEls[r][c] ? cellEls[r][c].textContent : null; },
    /* Called once when a full-window surface hands the viewport back. Never on
       the way in, when the work area has no box to measure. */
    refit() { requestAnimationFrame(() => { render(); placeFreezeGrabs(); }); },
    cancelEdit() { render(); $('[data-role="mode"]').textContent = "Ready"; },
    commitEditQuiet() { $('[data-role="mode"]').textContent = "Ready"; },
    commitEdit() { render(); $('[data-role="mode"]').textContent = "Ready"; say("Entry committed"); } };
})();

/* --- 21.11 sheet tabs ---------------------------------------------------- */
const sheets = (function () {
  const host = $('[data-role="stabs"]');
  const defs = [
    { name: "Summary",     seed: 1, colour: 3 },
    { name: "Q1",          seed: 2, colour: 6 },
    { name: "Q2",          seed: 3, colour: 6 },
    { name: "Q3",          seed: 4, colour: 6 },
    { name: "Q4",          seed: 5, colour: 6 },
    { name: "Assumptions", seed: 6, colour: 1 },
    { name: "Raw Data",    seed: 7, colour: null }
  ];
  let active = 0;
  defs.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "stab"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(i === 0));
    b.tabIndex = i === 0 ? 0 : -1;
    const dot = document.createElement("span");
    dot.className = "stab-dot";
    if (d.colour !== null) dot.style.setProperty("--sc", ramp(HUES[d.colour], 2));
    b.appendChild(dot);
    const label = document.createElement("span");
    label.textContent = d.name;
    b.appendChild(label);
    b.addEventListener("click", () => select(i));
    host.appendChild(b);
  });
  function select(i) {
    active = i;
    $$(".stab", host).forEach((b, n) => {
      b.setAttribute("aria-selected", String(n === i));
      b.tabIndex = n === i ? 0 : -1;
    });
    grid.build(makeSheet(defs[i].name, defs[i].seed));
    $$(".stab", host)[i].scrollIntoView({ block: "nearest", inline: "nearest" });
    /* The four navigation arrows had no disabled state, so the strip offered
       "first sheet" while already on the first one. */
    const ends = { "sheet-first": i === 0, "sheet-prev": i === 0,
                   "sheet-next": i === defs.length - 1, "sheet-last": i === defs.length - 1 };
    Object.keys(ends).forEach(k => {
      const b = $('[data-act="' + k + '"]');
      if (b) b.disabled = ends[k];
    });
    say("Sheet: " + defs[i].name);
  }
  return {
    select,
    name() { return defs[active].name; },
    boot() { select(0); },
    step(a) {
      if (a === "sheet-first") return select(0);
      if (a === "sheet-prev")  return select(Math.max(0, active - 1));
      if (a === "sheet-next")  return select(Math.min(defs.length - 1, active + 1));
      if (a === "sheet-last")  return select(defs.length - 1);
    }
  };
})();

/* --- 21.12 zoom ---------------------------------------------------------- */
const zoomInput = $('[data-role="zoom"]');
const zoomRead  = $('[data-role="zoomread"]');
function zoomValue() { return +zoomInput.value; }
function setZoom(v) {
  const z = Math.min(200, Math.max(50, Math.round(v / 10) * 10));
  zoomInput.value = String(z);
  zoomRead.textContent = z + "%";
  grid.setZoom(z / 100);
}
zoomInput.addEventListener("input", () => setZoom(zoomValue()));

/* --- 21.13 keyboard: F6 landmark cycling, Ctrl+F1, Escape ---------------
   F6 exists to get out of the grid and to the commands, so it starts at the
   ribbon. Each landmark takes the element last focused inside it. */
const LANDMARKS = [
  ['[data-role="tabs"] .tab[aria-selected="true"]', "Ribbon"],
  ['[data-role="namebox"]',                          "Formula bar"],
  ['[data-role="sheet"]',                            "Grid"],
  ['[data-role="stabs"] .stab[aria-selected="true"]',"Sheet tabs"],
  ['[data-act="view"][aria-pressed="true"]',         "Status bar"],
  ['.titlebar [data-cmd="file.save"]',               "Quick Access Toolbar"]
];
let landmark = 0;
document.addEventListener("keydown", e => {
  if (e.key === "F6") {
    e.preventDefault();
    landmark = (landmark + (e.shiftKey ? -1 : 1) + LANDMARKS.length) % LANDMARKS.length;
    const [sel, name] = LANDMARKS[landmark];
    const el = $(sel);
    if (el) { el.focus(); say(name); }
    return;
  }
  if (e.key === "F1" && e.ctrlKey) {
    e.preventDefault();

/* --- 21.21 contextual tabs ----------------------------------------------

/* --- 21.22 KeyTips ------------------------------------------------------

   focus to the cell that had it. That last part is the piece that is usually

  ktOrigin = null;

    let L = (want || "").toUpperCase();

      L = "";

    add($(".tab-file"), "F");
    tabList.filter(t => !t.hidden).forEach(t => add(t, t.dataset.keytip));
