<!doctype html>
<html lang="en" data-ribbon-layout="classic" data-ribbon-display="always">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCalc — Ribbon 2026 prototype</title>
<!--
  ============================================================================
  OpenCalc editor chrome — Excel-parity ribbon prototype
  ============================================================================
  Standalone, single file, no build step, no network requests. Open it by
  double-clicking from disk.

  PASS 1 of 3 delivers: the token layer, the window shell, the control system,
  the complete Home tab, the formula bar, a working grid, the sheet-tab strip,
  the status bar, and the JS foundation (tab switching, popup controller,
  display options, theme, gap legend, grid selection model).

  Seams the later passes extend are marked with
      SEAM: ...
  comments. Each tab's ribbon content lives in its own
      &lt;template data-tab="..."&gt;
  so a pass can fill one tab without touching another.

  CONVENTIONS THIS FILE ENFORCES (a later pass must keep them):
    * Every command control carries data-cmd="<id>" and its FIRST child is its
      glyph <svg>. That invariant is what the coverage checks key on.
    * Controls the assignment marks status:"gap" carry data-gap="1". The gap
      legend in the title strip outlines them so Excel coverage reads at a
      glance.
    * No colour literal outside the token blocks. No literal duration or
      easing outside the token block either.
    * One icon system: a 16-unit viewBox for small/medium glyphs, a 20-unit
      viewBox for the large icon-over-label glyphs, one stroke weight in each
      so both render at 1.5 device pixels.
-->
<style>
/* ==========================================================================
   1. TOKENS
   Everything downstream reads these. The dark theme redefines TOKENS ONLY —
   there is not one selector below this block that changes between themes.
   ========================================================================== */
:root {
  /* --- brand ------------------------------------------------------------ */
  --accent:            #107c41;   /* Excel green: File tab, selection, marks   */
  --accent-hover:      #0e6c39;
  --accent-pressed:    #0b5730;
  --accent-deep:       #185c37;   /* the darker end of the logo ramp          */
  --accent-fg:         #0e6c39;   /* accent used as a foreground / underline  */
  --on-accent:         #ffffff;

  /* --- neutral surfaces (Fluent 2 grey ramp) ---------------------------- */
  --bg-window:         #f5f5f5;   /* title + QAT strip                        */
  --bg-ribbon:         #ffffff;   /* tab strip + ribbon body                  */
  --bg-canvas:         #ffffff;   /* the grid                                 */
  --bg-subtle:         #fafafa;   /* status bar, sheet strip                  */
  --bg-raised:         #ffffff;   /* menus, flyouts, galleries                */
  --bg-sunken:         #f0f0f0;   /* inputs, search pill                      */

  /* --- interaction fills ------------------------------------------------ */
  --fill-hover:        #f0f0f0;
  --fill-press:        #e0e0e0;
  --fill-checked:      color-mix(in srgb, var(--accent) 13%, var(--bg-ribbon));
  --fill-checked-hov:  color-mix(in srgb, var(--accent) 20%, var(--bg-ribbon));
  --fill-selected:     color-mix(in srgb, var(--accent) 10%, var(--bg-raised));

  /* --- strokes ---------------------------------------------------------- */
  --stroke-1:          #d1d1d1;   /* control borders, group rules             */
  --stroke-2:          #e4e4e4;   /* soft dividers                            */
  --stroke-strong:     #b3b3b3;
  --stroke-hover:      #a3a3a3;

  /* --- foregrounds ------------------------------------------------------ */
  --fg-1:              #242424;   /* primary text and icon strokes            */
  --fg-2:              #424242;   /* icon rest colour                         */
  --fg-3:              #616161;   /* group captions, status text              */
  --fg-disabled:       #a4a4a4;   /* 2.9:1 on white — dim, still legible */

  /* --- focus (Fluent double stroke: reads on any ground) ---------------- */
  --focus-inner:       #ffffff;
  --focus-outer:       #0b0b0b;

  /* --- semantic --------------------------------------------------------- */
  --danger:            #c4314b;
  --warning:           #b26b00;
  --gap-stroke:        #b26b00;   /* the coverage legend outline              */
  --gap-tint:          color-mix(in srgb, #b26b00 9%, transparent);

  /* --- grid ------------------------------------------------------------- */
  --grid-line:         #d8d8d8;
  --grid-header-bg:    #f5f5f5;
  --grid-header-hot:   #e4ece8;
  --grid-header-fg:    #545454;
  --grid-sel-fill:     color-mix(in srgb, var(--accent) 9%, transparent);
  --grid-sel-edge:     var(--accent);
  --grid-total-bg:     #f7f7f7;
  /* Direct manipulation. `--grid-guide` is the line that follows the pointer
     during a resize or a reorder; it is deliberately the accent rather than a
     neutral, because it is the only thing on screen saying "this is where it
     lands" and a grey rule reads as another gridline. */
  --grid-guide:        var(--accent);
  --grid-freeze-line:  #6f7b76;   /* Excel draws the frozen edge as a darker rule */
  --grid-freeze-grip:  #9aa5a0;
  --grid-ghost-fill:   color-mix(in srgb, var(--accent) 12%, var(--bg-canvas));
  --grid-ghost-edge:   color-mix(in srgb, var(--accent) 55%, transparent);
  --grid-tip-bg:       #2b2b2b;
  --grid-tip-fg:       #ffffff;
  --grid-hidden-mark:  #8a8a8a;   /* the doubled rule that says a line is hidden */
  --viz-bar:           color-mix(in srgb, var(--accent) 34%, transparent);
  --viz-bar-neg:       color-mix(in srgb, #c4314b 30%, transparent);
  --viz-scale-hi:      color-mix(in srgb, var(--accent) 26%, transparent);
  --viz-scale-mid:     color-mix(in srgb, #f0a53a 24%, transparent);
  --viz-scale-lo:      color-mix(in srgb, #c4314b 22%, transparent);

  /* --- elevation -------------------------------------------------------- */
  --sh-raised:  0 1px 1px rgba(11,13,18,.07), 0 0 1px rgba(11,13,18,.10);
  --sh-overlay: 0 2px 4px rgba(11,13,18,.10), 0 8px 20px rgba(11,13,18,.14);
  --sh-flyout:  0 4px 8px rgba(11,13,18,.10), 0 16px 40px rgba(11,13,18,.18);
  --scrim:      rgba(11,13,18,.34);   /* the backstage / dialog ground     */

  /* --- typography ------------------------------------------------------- */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-caption:  11px;   /* group captions, status bar                        */
  --fs-body:     12px;   /* control labels                                    */
  --fs-tab:      13px;   /* ribbon tab captions, menu rows                    */
  --fs-input:  12.5px;
  --lh-tight:    1.15;
  --fw-reg: 400; --fw-med: 500; --fw-semi: 600;

  /* --- geometry --------------------------------------------------------- */
  --r-xs: 2px; --r-sm: 3px; --r-md: 4px; --r-lg: 6px; --r-panel: 8px; --r-pill: 999px;
  --hair: 1px;

  --h-title:      40px;
  --h-tabs:       32px;
  --h-ribbon:     94px;  /* classic body: 6 pad + 3x24 rows + 14 caption + 2  */
  --h-ribbon-simple: 40px;
  --h-formula:    30px;
  --h-sheets:     28px;
  --h-status:     24px;

  --ctl-row:      24px;  /* one classic control row                           */
  --ctl-lg-h:     70px;  /* large icon-over-label button                      */
  --ctl-lg-w:     46px;
  --ctl-lg-wmax:  84px;  /* the CAP; min-content raises it per button below */
  --icon-sm:      16px;
  --icon-lg:      24px;
  --caret-w:      13px;

  --gap-ctl:      2px;   /* between adjacent controls in a group              */
  --gap-group:    6px;   /* rule inset: 6px | 1px rule | 6px                  */
  --pad-group:    6px;

  /* --- motion ----------------------------------------------------------- */
  --dur-instant:  0ms;
  --dur-fast:     100ms;   /* hover, press-out                                */
  --dur-quick:    140ms;   /* caret rotation, underline travel                */
  --dur-normal:   150ms;   /* menu / gallery open                             */
  --dur-slow:     250ms;   /* ribbon height, layout swap                      */
  --dur-backstage:300ms;
  --ease-standard:   cubic-bezier(.33, 0, .67, 1);
  --ease-decelerate: cubic-bezier(0, 0, .4, 1);
  --ease-accelerate: cubic-bezier(.4, 0, 1, 1);
  --ease-emphasis:   cubic-bezier(.2, 0, 0, 1);

  --z-grid-overlay: 20;
  --z-sticky:       30;
  --z-menu:         60;
  --z-scrim:        70;
  --z-backstage:    80;
  --z-tooltip:      90;
}

/* Dark theme — TOKENS ONLY. Applied by the explicit toggle, and by the OS
   preference when the user has not forced light. The two blocks are duplicated
   because CSS cannot share a declaration block across an attribute selector and
   a media query; keep them in sync. */
:root[data-theme="dark"] {
  --accent:            #107c41;
  --accent-hover:      #14904c;
  --accent-pressed:    #0d6a37;
  --accent-deep:       #0d5c31;
  --accent-fg:         #4cc38a;   /* light enough to read as a mark on #292929 */
  --on-accent:         #ffffff;

  --bg-window:         #1f1f1f;
  --bg-ribbon:         #292929;
  --bg-canvas:         #1b1b1b;
  --bg-subtle:         #232323;
  --bg-raised:         #2d2d2d;
  --bg-sunken:         #383838;

  --fill-hover:        #383838;
  --fill-press:        #454545;
  --fill-checked:      color-mix(in srgb, var(--accent-fg) 22%, var(--bg-ribbon));
  --fill-checked-hov:  color-mix(in srgb, var(--accent-fg) 30%, var(--bg-ribbon));
  --fill-selected:     color-mix(in srgb, var(--accent-fg) 18%, var(--bg-raised));

  --stroke-1:          #4a4a4a;
  --stroke-2:          #3a3a3a;
  --stroke-strong:     #6b6b6b;
  --stroke-hover:      #7a7a7a;

  --fg-1:              #ffffff;
  --fg-2:              #d6d6d6;
  --fg-3:              #a6a6a6;
  --fg-disabled:       #7d7d7d;   /* 3.0:1 on #292929 */

  --focus-inner:       #0b0b0b;
  --focus-outer:       #ffffff;

  --danger:            #ff8b98;
  --warning:           #e8a33d;
  --gap-stroke:        #e8a33d;
  --gap-tint:          color-mix(in srgb, #e8a33d 12%, transparent);

  --grid-line:         #3a3a3a;
  --grid-header-bg:    #232323;
  --grid-header-hot:   #2c3a33;
  --grid-header-fg:    #a6a6a6;
  --grid-sel-fill:     color-mix(in srgb, var(--accent-fg) 14%, transparent);
  --grid-sel-edge:     var(--accent-fg);
  --grid-total-bg:     #242424;
  --grid-guide:        var(--accent-fg);
  --grid-freeze-line:  #9fb0aa;
  --grid-freeze-grip:  #6d7a75;
  --grid-ghost-fill:   color-mix(in srgb, var(--accent-fg) 16%, var(--bg-canvas));
  --grid-ghost-edge:   color-mix(in srgb, var(--accent-fg) 60%, transparent);
  --grid-tip-bg:       #efefef;
  --grid-tip-fg:       #1a1a1a;
  --grid-hidden-mark:  #8f8f8f;
  --viz-bar:           color-mix(in srgb, var(--accent-fg) 30%, transparent);
  --viz-bar-neg:       color-mix(in srgb, #ff8b98 26%, transparent);
  --viz-scale-hi:      color-mix(in srgb, var(--accent-fg) 24%, transparent);
  --viz-scale-mid:     color-mix(in srgb, #e8a33d 22%, transparent);
  --viz-scale-lo:      color-mix(in srgb, #ff8b98 20%, transparent);

  --sh-raised:  0 1px 1px rgba(0,0,0,.45), 0 0 1px rgba(0,0,0,.6);
  --sh-overlay: 0 2px 4px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.55);
  --sh-flyout:  0 4px 8px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.6);
  --scrim:      rgba(0,0,0,.52);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent:            #107c41;
    --accent-hover:      #14904c;
    --accent-pressed:    #0d6a37;
    --accent-deep:       #0d5c31;
    --accent-fg:         #4cc38a;
    --on-accent:         #ffffff;

    --bg-window:         #1f1f1f;
    --bg-ribbon:         #292929;
    --bg-canvas:         #1b1b1b;
    --bg-subtle:         #232323;
    --bg-raised:         #2d2d2d;
    --bg-sunken:         #383838;

    --fill-hover:        #383838;
    --fill-press:        #454545;
    --fill-checked:      color-mix(in srgb, var(--accent-fg) 22%, var(--bg-ribbon));
    --fill-checked-hov:  color-mix(in srgb, var(--accent-fg) 30%, var(--bg-ribbon));
    --fill-selected:     color-mix(in srgb, var(--accent-fg) 18%, var(--bg-raised));

    --stroke-1:          #4a4a4a;
    --stroke-2:          #3a3a3a;
    --stroke-strong:     #6b6b6b;
    --stroke-hover:      #7a7a7a;

    --fg-1:              #ffffff;
    --fg-2:              #d6d6d6;
    --fg-3:              #a6a6a6;
    --fg-disabled:       #7d7d7d;   /* 3.0:1 on #292929 */

    --focus-inner:       #0b0b0b;
    --focus-outer:       #ffffff;

    --danger:            #ff8b98;
    --warning:           #e8a33d;
    --gap-stroke:        #e8a33d;
    --gap-tint:          color-mix(in srgb, #e8a33d 12%, transparent);

    --grid-line:         #3a3a3a;
    --grid-header-bg:    #232323;
    --grid-header-hot:   #2c3a33;
    --grid-header-fg:    #a6a6a6;
    --grid-sel-fill:     color-mix(in srgb, var(--accent-fg) 14%, transparent);
    --grid-sel-edge:     var(--accent-fg);
    --grid-total-bg:     #242424;
    --grid-guide:        var(--accent-fg);
    --grid-freeze-line:  #9fb0aa;
    --grid-freeze-grip:  #6d7a75;
    --grid-ghost-fill:   color-mix(in srgb, var(--accent-fg) 16%, var(--bg-canvas));
    --grid-ghost-edge:   color-mix(in srgb, var(--accent-fg) 60%, transparent);
    --grid-tip-bg:       #efefef;
    --grid-tip-fg:       #1a1a1a;
    --grid-hidden-mark:  #8f8f8f;
    --viz-bar:           color-mix(in srgb, var(--accent-fg) 30%, transparent);
    --viz-bar-neg:       color-mix(in srgb, #ff8b98 26%, transparent);
    --viz-scale-hi:      color-mix(in srgb, var(--accent-fg) 24%, transparent);
    --viz-scale-mid:     color-mix(in srgb, #e8a33d 22%, transparent);
    --viz-scale-lo:      color-mix(in srgb, #ff8b98 20%, transparent);

    --sh-raised:  0 1px 1px rgba(0,0,0,.45), 0 0 1px rgba(0,0,0,.6);
    --sh-overlay: 0 2px 4px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.55);
    --sh-flyout:  0 4px 8px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.6);
  --scrim:      rgba(0,0,0,.52);
  }
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: var(--fw-reg) var(--fs-body)/1.4 var(--font-ui);
  color: var(--fg-1);
  background: var(--bg-window);
  overflow: hidden;                 /* the app owns its own scrolling         */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }   /* the attribute must beat any author display rule */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums lining-nums; }

/* Selection. Without this the OS paints its own blue over an accent-green
   product, which is the single most common way a careful theme leaks. */
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--fg-1); }
::-moz-selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--fg-1); }
input, textarea { caret-color: var(--accent-fg); }

/* Scrollbars are chrome too, and a default light scrollbar on a dark pane is
   the loudest thing on the screen. Firefox takes the two-colour form; Chrome
   takes the box model, which is the only one that can be made to sit inside a
   rounded panel without touching its edge. */
.gridwrap, .pop, .bs-pane, .bs-rail, .dlg-body, .dlg-list, .st-scroll,
.tabstrip-scroll, .stabs, .ribbon-scroll { scrollbar-color: var(--stroke-strong) transparent; }
.gridwrap::-webkit-scrollbar, .pop::-webkit-scrollbar, .bs-pane::-webkit-scrollbar,
.bs-rail::-webkit-scrollbar, .dlg-body::-webkit-scrollbar, .dlg-list::-webkit-scrollbar {
  width: 12px; height: 12px; background: transparent; }
.gridwrap::-webkit-scrollbar-thumb, .pop::-webkit-scrollbar-thumb,
.bs-pane::-webkit-scrollbar-thumb, .bs-rail::-webkit-scrollbar-thumb,
.dlg-body::-webkit-scrollbar-thumb, .dlg-list::-webkit-scrollbar-thumb {
  background: var(--stroke-strong); border-radius: var(--r-pill);
  border: 3px solid transparent; background-clip: content-box; }
.gridwrap::-webkit-scrollbar-thumb:hover, .pop::-webkit-scrollbar-thumb:hover,
.bs-pane::-webkit-scrollbar-thumb:hover, .bs-rail::-webkit-scrollbar-thumb:hover,
.dlg-body::-webkit-scrollbar-thumb:hover, .dlg-list::-webkit-scrollbar-thumb:hover {
  background: var(--fg-3); background-clip: content-box; }
.gridwrap::-webkit-scrollbar-corner, .pop::-webkit-scrollbar-corner { background: transparent; }
/* The rail's own scrollbar sits on the accent fill, so it takes the accent's
   foreground rather than the neutral ramp. */
.bs-rail { scrollbar-color: color-mix(in srgb, var(--on-accent) 45%, transparent) transparent; }
.bs-rail::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--on-accent) 45%, transparent); background-clip: content-box; }

/* One focus treatment, everywhere, and only for keyboard. Fluent's double
   stroke: an inner ring the colour of the ground and an outer ring its
   opposite, so it reads on a white ribbon, a green File tab and a dark menu
   without a per-surface variant. */
:focus { outline: none; }
:focus-visible {
  /* TWO layers on purpose. The box-shadow draws Fluent's double stroke — an
     inner ring the colour of the ground and an outer ring its opposite. The
     OUTLINE draws the same outer ring again, in exactly the same 1-3px band,
     so the two coincide and never read as doubled. The outline is what makes
     the ring unconditional: `box-shadow` is a single property, so any control
     that declares its own later in the sheet silently ate the ring — .obj,
     .stab[aria-selected], .gal-item:hover, .sw[aria-selected], .bs-tile:hover
     and .bs-btn.ghost all did, and a floating chart could be focused with no
     mark at all. Nothing else in this file uses `outline`, so it cannot be
     overwritten by accident. */
  outline: 2px solid var(--focus-outer);
  outline-offset: 1px;
  box-shadow: 0 0 0 1px var(--focus-inner), 0 0 0 3px var(--focus-outer);
  z-index: 2;
  position: relative;
}
/* Inside a scroller whose cross axis is clipped, an outset ring would be cut in
   half; those controls take the ring INSIDE their own box instead. */
.ribbon-scroll :focus-visible, .tabstrip-scroll :focus-visible,
.stabs :focus-visible { outline-offset: -2px; }
/* The ring is never animated: a ring that fades in is absent for the first
   frame after a keypress, and keyboard users arrive at speed. */

/* Icons. Two viewBoxes, two stroke weights, one rendered weight of 1.5 device
   pixels: 16-unit box at 16px with stroke 1.5; 20-unit box at 24px (1.2x) with
   stroke 1.25. */
.ic { width: var(--icon-sm); height: var(--icon-sm); display: block; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round; }
.ic-lg { width: var(--icon-lg); height: var(--icon-lg); stroke-width: 1.25; }
.ic-tiny { width: 12px; height: 12px; }
.ic-fill { fill: currentColor; stroke: none; }

/* ==========================================================================
   3. WINDOW SHELL — one flex column; every band is fixed, the work area is
   the only thing that flexes. Every pixel of chrome comes out of the grid.
   ========================================================================== */
.app { height: 100vh; display: flex; flex-direction: column; overflow: hidden;
       background: var(--bg-canvas); }
.band { flex: 0 0 auto; }

/* --- 3.1 title / quick access strip ------------------------------------- */
.titlebar {
  height: var(--h-title); display: flex; align-items: center; gap: 8px;
  padding: 0 8px; background: var(--bg-window);
  border-bottom: var(--hair) solid var(--stroke-2);
}
.tb-left, .tb-right { display: flex; align-items: center; gap: 2px; flex: none; }
.tb-centre { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
             gap: 12px; min-width: 0; }

/* AutoSave — a real switch, not a button that looks like one. */
.autosave { display: inline-flex; align-items: center; gap: 6px; height: 26px;
            padding: 0 8px 0 6px; border-radius: var(--r-pill); color: var(--fg-2);
            transition: background var(--dur-fast) var(--ease-standard); }
.autosave:hover { background: var(--fill-hover); }
.autosave:active { background: var(--fill-press); }
.autosave-track { width: 28px; height: 15px; border-radius: var(--r-pill);
  background: var(--bg-sunken); border: var(--hair) solid var(--stroke-strong);
  position: relative; flex: none;
  transition: background var(--dur-quick) var(--ease-standard),
              border-color var(--dur-quick) var(--ease-standard); }
.autosave-track::after { content: ""; position: absolute; top: 2px; left: 2px;
  width: 9px; height: 9px; border-radius: var(--r-pill); background: var(--fg-2);
  transition: transform var(--dur-quick) var(--ease-emphasis),
              background var(--dur-quick) var(--ease-standard); }
.autosave[aria-checked="true"] .autosave-track { background: var(--accent); border-color: var(--accent); }
.autosave[aria-checked="true"] .autosave-track::after { transform: translateX(13px); background: var(--on-accent); }
.autosave-label { font-size: var(--fs-caption); font-weight: var(--fw-med); letter-spacing: .01em; }

/* QAT buttons — 28px, the pointer-target floor this project already asserts. */
.qat { width: 28px; height: 28px; border-radius: var(--r-sm); color: var(--fg-2);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background var(--dur-fast) var(--ease-standard),
              color var(--dur-fast) var(--ease-standard),
              box-shadow var(--dur-fast) var(--ease-standard); }
.qat:hover { background: var(--fill-hover); color: var(--fg-1); }
.qat:active { background: var(--fill-press); }
.qat[disabled] { color: var(--fg-disabled); background: none; cursor: default; }
.qat[aria-expanded="true"] { background: var(--fill-press); color: var(--fg-1); }
.qat-split { display: inline-flex; align-items: center; border-radius: var(--r-sm); }
.qat-split .qat-main { width: 26px; border-radius: var(--r-sm) 0 0 var(--r-sm); }
.qat-split .qat-caret { width: 15px; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.qat-sep { width: var(--hair); height: 16px; background: var(--stroke-1); margin: 0 4px; flex: none; }

/* Document identity — the DOCUMENT, never the product. */
.doc { display: inline-flex; align-items: baseline; gap: 6px; max-width: 42vw; min-width: 0; }
.doc-name { font-size: var(--fs-tab); font-weight: var(--fw-semi); color: var(--fg-1);
  padding: 3px 6px; border-radius: var(--r-sm); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; transition: background var(--dur-fast) var(--ease-standard); }
.doc-name:hover { background: var(--fill-hover); }
.doc-name:active { background: var(--fill-press); }
.doc-dot { width: 5px; height: 5px; border-radius: var(--r-pill); background: var(--accent-fg);
  flex: none; align-self: center; transition: opacity var(--dur-normal) var(--ease-standard); }
.doc-state { font-size: var(--fs-caption); color: var(--fg-3); white-space: nowrap; }

/* Search pill — Excel's Alt+Q box. */
.search { display: flex; align-items: center; gap: 6px; height: 26px; width: min(360px, 34vw);
  padding: 0 10px; border-radius: var(--r-md); background: var(--bg-sunken);
  border: var(--hair) solid transparent; color: var(--fg-3); min-width: 120px;
  transition: background var(--dur-fast) var(--ease-standard),
              border-color var(--dur-fast) var(--ease-standard); }
.search:hover { border-color: var(--stroke-1); }
.search:focus-within { background: var(--bg-raised); border-color: var(--accent); }
.search input { flex: 1 1 auto; min-width: 0; border: 0; background: none; outline: none;
  font-size: var(--fs-input); color: var(--fg-1); }
.search input::placeholder { color: var(--fg-3); }
.search kbd { font: var(--fw-med) 10px/1 var(--font-ui); color: var(--fg-3);
  border: var(--hair) solid var(--stroke-1); border-radius: var(--r-xs); padding: 2px 4px;
  white-space: nowrap; flex: none; }
.search input { text-overflow: ellipsis; }

/* Account chip */
.account { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 3px;
  border-radius: var(--r-pill); color: var(--fg-2);
  transition: background var(--dur-fast) var(--ease-standard); }
.account:hover { background: var(--fill-hover); }
.account:active { background: var(--fill-press); }
.avatar { width: 22px; height: 22px; border-radius: var(--r-pill); background: var(--accent);
  color: var(--on-accent); font: var(--fw-semi) 10px/22px var(--font-ui); text-align: center;
  flex: none; letter-spacing: .02em; }
.account-name { font-size: var(--fs-caption); font-weight: var(--fw-med); }

/* --- 3.2 ribbon tab strip ----------------------------------------------- */
.tabstrip {
  height: var(--h-tabs); display: flex; align-items: stretch; gap: 0;
  background: var(--bg-ribbon); position: relative; padding: 0 4px 0 0;
}
.tabstrip-scroll { flex: 1 1 auto; display: flex; align-items: stretch; overflow-x: auto;
  overflow-y: hidden; scrollbar-width: none; position: relative; }
.tabstrip-scroll::-webkit-scrollbar { display: none; }
.tabs { display: flex; align-items: stretch; gap: 0; position: relative; padding-right: 8px; }

/* File is not a tab. It opens the backstage, so it is a button with an accent
   fill rather than an underlined tab — a different kind of thing, drawn as one.
   The fill is the accent TOKEN, so a host that rebrands gets its own colour
   here rather than Microsoft's green. */
.tab-file { flex: none; align-self: center; height: 26px; margin: 0 6px 0 6px; padding: 0 14px;
  border-radius: var(--r-md); background: var(--accent); color: var(--on-accent);
  font-size: var(--fs-tab); font-weight: var(--fw-semi); letter-spacing: .01em;
  display: inline-flex; align-items: center;
  transition: background var(--dur-fast) var(--ease-standard); }
.tab-file:hover { background: var(--accent-hover); }
.tab-file:active { background: var(--accent-pressed); }

.tab { flex: none; height: 100%; padding: 0 11px; color: var(--fg-3); font-size: var(--fs-tab);
  font-weight: var(--fw-med); white-space: nowrap; position: relative;
  display: inline-flex; align-items: center; border-radius: var(--r-sm) var(--r-sm) 0 0;
  transition: color var(--dur-fast) var(--ease-standard),
              background var(--dur-fast) var(--ease-standard); }
.tab:hover { color: var(--fg-1); background: var(--fill-hover); }
.tab:active { background: var(--fill-press); }
.tab[aria-selected="true"] { color: var(--fg-1); font-weight: var(--fw-semi); }
.tab[data-contextual] { color: var(--accent-fg); }
.tab[data-contextual][aria-selected="true"] { color: var(--accent-fg); }
/* Contextual tabs stay in the DOM at all times so the command surface does not
   change size with the selection; they are hidden, never removed. */
.tab[data-contextual][hidden] { display: none; }

/* ONE underline element that travels. Two underlines cross-fading do not tell
   you which way you moved. */
.tab-underline { position: absolute; bottom: 0; left: 0; height: 2px; width: 0;
  background: var(--accent-fg); border-radius: 1px 1px 0 0; pointer-events: none;
  transform: translateX(0); transform-origin: left center;
  transition: transform var(--dur-quick) var(--ease-emphasis),
              width var(--dur-quick) var(--ease-emphasis),
              opacity var(--dur-fast) var(--ease-standard); }

.tabstrip-tools { flex: none; display: flex; align-items: center; gap: 2px; padding-left: 4px; }
.tabscroll { width: 22px; height: 22px; border-radius: var(--r-sm); color: var(--fg-3);
  display: none; align-items: center; justify-content: center;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.tabscroll:hover { background: var(--fill-hover); color: var(--fg-1); }
.tabscroll[data-visible="1"] { display: inline-flex; }
.tabstrip-lead { flex: none; display: flex; align-items: center; }

/* ==========================================================================
   4. RIBBON BODY AND GROUPS
   The body is a fixed, declared height that the flex column sees. It never
   wraps to a second row on its own: a band that reflows changes the editor's
   height without anybody deciding to.
   ========================================================================== */
.ribbon {
  background: var(--bg-ribbon); border-bottom: var(--hair) solid var(--stroke-2);
  height: var(--h-ribbon); overflow: hidden; position: relative;
  transition: height var(--dur-slow) var(--ease-emphasis);
}
:root[data-ribbon-layout="simplified"] .ribbon { height: var(--h-ribbon-simple); }
:root[data-ribbon-display="collapsed"] .ribbon,
:root[data-ribbon-display="fullscreen"] .ribbon { height: 0; border-bottom-width: 0; }
:root[data-ribbon-display="fullscreen"] .tabstrip { display: none; }
:root[data-ribbon-display="fullscreen"] .titlebar { display: none; }

.ribbon-scroll { height: 100%; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; }
.ribbon-scroll::-webkit-scrollbar { height: 0; }
.ribbon-panel { height: 100%; display: none; align-items: stretch; padding: 0 4px;
  min-width: min-content; }
.ribbon-panel[data-active="1"] { display: flex; }
/* The incoming panel rises 4px and fades; the outgoing one only fades, and
   faster, so the ribbon is never blank between them. Compositor-only. */
@keyframes panel-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.ribbon-panel[data-active="1"] { animation: panel-in var(--dur-normal) var(--ease-decelerate) both; }

/* --- 4.1 a group is a caption and a rule, never a capsule ---------------- */
.grp { flex: none; display: flex; flex-direction: column; padding: var(--pad-group) 0 0;
  position: relative; }
.grp + .grp { margin-left: calc(var(--gap-group) * 2 + var(--hair)); }
.grp + .grp::before { content: ""; position: absolute; left: calc(-1 * var(--gap-group) - var(--hair));
  top: var(--gap-group); bottom: var(--gap-group); width: var(--hair);
  background: var(--stroke-2); }
.grp-body { flex: 1 1 auto; display: flex; align-items: flex-start; gap: var(--gap-ctl);
  padding: 0 8px; }
.grp-cap { height: 14px; display: flex; align-items: center; justify-content: center;
  gap: 4px; padding: 0 8px; font-size: var(--fs-caption); color: var(--fg-3);
  line-height: 14px; white-space: nowrap; }
/* Three stacked control rows, or one large button spanning them. */
/* A stack is always the full three rows tall, and its POPULATED rows are
   centred in it. Without this a group whose stack held one control — the
   Protect group's dropdown caret, the Comments group's Select-commented button
   — hung that control from the first row with two empty rows beneath it, and
   it read as a rendering fault rather than a control. Excel centres a partial
   stack against the large buttons beside it; so do we. */
.stack { display: flex; flex-direction: column; gap: 0;
  height: calc(var(--ctl-row) * 3); justify-content: center; }
.row[data-empty="1"] { display: none; }
.row { display: flex; align-items: center; gap: var(--gap-ctl); height: var(--ctl-row); }
.vsep { width: var(--hair); align-self: stretch; background: var(--stroke-2); margin: 3px 3px; flex: none; }

/* THE STAGE BEFORE A CHIP. Home authors nine in-place levels; every other tab
   had none, so it stepped straight from "fully drawn" to "seven groups are
   chips" — at 1333px the Data tab folded seven of its eight groups away when
   dropping their medium captions would have saved 350px in one group alone.
   This is the same degradation Home's levels 3, 6 and 8 apply, generalised, and
   it fires in each tab's own authored fold order. The captions are recoverable:
   every control carries a tooltip and an accessible name. */
.grp[data-tight="1"] .rc-md .rc-label { display: none; }
.grp[data-tight="1"] .rc-md { width: var(--ctl-row); max-width: none; padding: 0;
  gap: 0; justify-content: center; }
.grp[data-tight="1"] .rc-md.rc-check { width: auto; padding: 0 4px; gap: 6px; }
.grp[data-tight="1"] .rc-md.rc-check .rc-label { display: inline; }

/* A collapsed group is a labelled chip that opens the group's own inline
   layout in a popup — Excel's popup chunk. The controls are MOVED into the
   panel and moved back on close; they are never cloned and never destroyed,
   so every command keeps exactly one node at every width. */
.grp-chip { display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; height: var(--ctl-lg-h); min-width: 60px; padding: 4px 8px 0;
  border-radius: var(--r-sm); color: var(--fg-2); font-size: var(--fs-body);
  transition: background var(--dur-fast) var(--ease-standard),
              color var(--dur-fast) var(--ease-standard); }
.grp-chip .chip-label, .grp-chip > span { white-space: nowrap; }
/* A chip is a group, not a command: it gets the group's own caption weight and
   a caret band at the foot, the same shape a large split button uses, so the
   two are told apart without reading the label. */
.grp-chip::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 4px;
  height: var(--hair); background: var(--stroke-2); opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-standard); }
.grp-chip { position: relative; }
.grp-chip:hover::after, .grp-chip[aria-expanded="true"]::after { opacity: 1; }
.grp-chip:hover { background: var(--fill-hover); color: var(--fg-1); }
.grp-chip:active { background: var(--fill-press); transition-duration: var(--dur-instant); }
.grp-chip[aria-expanded="true"] { background: var(--fill-press); color: var(--fg-1); }
.grp-chip .ic-tiny { width: 9px; height: 9px; }
.grp[data-collapsed="1"] > .grp-body, .grp[data-collapsed="1"] > .grp-cap { display: none; }
.grp[data-collapsed="1"] > .grp-chip { display: flex; }
.grp[data-collapsed="1"] { padding-top: var(--pad-group); }
.pop:has(> .grp-body) { min-width: 0; }
.pop > .grp-body { padding: 4px 2px; }
.pop > .grp-body .stack { gap: 0; }

/* Dialog launcher — 14px glyph at the caption's trailing edge. */
.launcher { width: 14px; height: 14px; border-radius: var(--r-xs); color: var(--fg-3);
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.launcher:hover { background: var(--fill-hover); color: var(--fg-1); }
.launcher:active { background: var(--fill-press); }

/* ==========================================================================
   5. THE CONTROL SYSTEM
   One state model for everything: rest is transparent, hover fills, press
   recesses (fill deepens AND the shadow drops, so press is felt not just
   seen), checked takes the accent glyph plus a tinted fill, disabled loses
   colour and pointer, focus-visible is the double ring, and every popup owner
   carries aria-expanded.
   ========================================================================== */
.rc { position: relative; display: inline-flex; align-items: center; flex: none;
  border-radius: var(--r-sm); color: var(--fg-2); font-size: var(--fs-body);
  white-space: nowrap; background: transparent;
  transition: background var(--dur-fast) var(--ease-standard),
              color var(--dur-fast) var(--ease-standard),
              box-shadow var(--dur-fast) var(--ease-standard); }
.rc:hover { background: var(--fill-hover); color: var(--fg-1); }
.rc:active { background: var(--fill-press); box-shadow: none;
  transition-duration: var(--dur-instant); }     /* press-in is instant, press-out eases */
.rc[aria-expanded="true"] { background: var(--fill-press); color: var(--fg-1); }
.rc[aria-pressed="true"], .rc[aria-checked="true"], .rc[data-on="1"] {
  background: var(--fill-checked); color: var(--accent-fg); }
.rc[aria-pressed="true"]:hover, .rc[aria-checked="true"]:hover, .rc[data-on="1"]:hover {
  background: var(--fill-checked-hov); }
.rc[disabled], .rc[aria-disabled="true"] { color: var(--fg-disabled); background: none;
  box-shadow: none; cursor: default; pointer-events: none; }
.rc[data-loading="1"] { color: transparent; }
.rc[data-loading="1"]::after { content: ""; position: absolute; inset: 4px;
  border-radius: var(--r-xs); background: var(--fill-hover); }

/* small: icon only, one control row tall */
.rc-sm { width: var(--ctl-row); height: var(--ctl-row); justify-content: center; }
/* medium: icon + label in a row */
/* 156px = the widest medium caption in the whole ribbon ("Existing
   Connections", 153px including its 16px icon and 12px of padding). At 130px
   nine captions in five groups were ellipsised at full window width, which is
   a truncation nobody chose. */
.rc-md { height: var(--ctl-row); padding: 0 6px; gap: 6px; max-width: 156px; }
.rc-md .rc-label { overflow: hidden; text-overflow: ellipsis; }
/* large: icon over a label, spanning the three control rows */
/* min-content, not a fixed floor. A large button is capped at 84px — Excel's
   own proportion, and the width Home's budget was authored against — EXCEPT
   where a single word does not fit in 84px, and then min-width beats max-width
   and that ONE button grows to hold it. Widening every large button to 98px so
   that "Recommended" would fit cost Home 37px and two extra rungs of the fold
   ladder, which took the Styles and Cells captions off a 1563px window to
   solve a problem four buttons had. */
.rc-lg { flex-direction: column; justify-content: flex-start; gap: 2px;
  width: auto; min-width: min-content; max-width: var(--ctl-lg-wmax);
  height: var(--ctl-lg-h); padding: 3px 6px 0; text-align: center; }
.rc-lg { overflow: hidden; }
.rc-lg .rc-label { display: block; flex: none; white-space: normal; line-height: 13px;
  font-size: var(--fs-body); max-height: 39px; overflow: hidden;
  /* the label is the width of the button, never of its longest word: a
     shrink-to-fit span let "Recommended" escape the box and collide with the
     next control. Seen at 1:1, invisible in the markup. */
  width: 100%;
  /* NO break-word. It is what let "Recommended" render as "Recommend|ed", and
     it also makes the label's min-content one character wide, which would
     defeat the min-width above. A word that cannot fit now widens its button
     instead of being cut in half. The 34px floor is what keeps a short caption
     from collapsing the button narrower than its own icon needs. */
  overflow-wrap: normal; hyphens: manual; min-width: calc(var(--ctl-lg-w) - 12px); }
.rc-lg > .ic-lg { flex: none; }
.rc-lg > .ic-tiny { flex: none; width: 9px; height: 9px; margin-top: -1px; }
/* a text glyph where a drawn one would be worse ($ % .00) */
.rc-glyph { font: var(--fw-semi) 12px/1 var(--font-ui); }

/* --- 5.1 split buttons: two real buttons in a group, two names, two ids --- */
.rc-split { display: inline-flex; align-items: stretch; border-radius: var(--r-sm);
  background: transparent; }
.rc-split > .rc { border-radius: 0; }
.rc-split > .rc:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.rc-split > .rc:last-child  { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
/* the hairline between the halves appears only while the split is engaged */
.rc-split > .rc + .rc::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: var(--hair); background: var(--stroke-1); opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-standard); }
.rc-split:hover > .rc + .rc::before,
.rc-split:focus-within > .rc + .rc::before { opacity: 1; }
.rc-caret { width: var(--caret-w); justify-content: center; color: inherit; }
.rc-caret .ic { width: 12px; height: 12px;
  transition: transform var(--dur-quick) var(--ease-standard); }
.rc-caret[aria-expanded="true"] .ic { transform: rotate(180deg); }
/* a large split stacks: glyph and label on top, a full-width caret band below */
.rc-split-lg { flex-direction: column; height: var(--ctl-lg-h);
  min-width: min-content; max-width: var(--ctl-lg-wmax); }
.rc-split-lg > .rc:first-child { flex: 1 1 auto; border-radius: var(--r-sm) var(--r-sm) 0 0;
  height: auto; padding-bottom: 1px; }
.rc-split-lg .rc-label { max-height: 26px; }   /* the caret band takes line three */
.rc-split-lg > .rc:last-child { flex: none; width: 100%; height: 14px;
  border-radius: 0 0 var(--r-sm) var(--r-sm); }
.rc-split-lg > .rc + .rc::before { left: 5px; right: 5px; top: 0; bottom: auto;
  width: auto; height: var(--hair); }

/* --- 5.2 colour split: the swatch under the glyph shows the last colour --- */
.rc-colour .ic { margin-bottom: -3px; }
.rc-swatch { display: block; width: 14px; height: 3px; border-radius: 1px;
  background: var(--swatch, var(--accent));
  box-shadow: 0 0 0 var(--hair) var(--stroke-2) inset;
  transition: background var(--dur-fast) var(--ease-standard); }
.rc-colour { flex-direction: column; gap: 1px; padding-top: 2px; }

/* --- 5.3 combo boxes ---------------------------------------------------- */
.rc-combo { display: inline-flex; align-items: stretch; height: var(--ctl-row);
  border: var(--hair) solid var(--stroke-1); border-radius: var(--r-sm);
  background: var(--bg-raised); overflow: hidden; flex: none;
  transition: border-color var(--dur-fast) var(--ease-standard); }
.rc-combo:hover { border-color: var(--stroke-hover); }
.rc-combo:focus-within { border-color: var(--accent); }
.rc-combo[data-invalid="1"] { border-color: var(--danger); }
.rc-combo input { width: 100%; min-width: 0; border: 0; background: none; outline: none;
  padding: 0 4px 0 6px; font-size: var(--fs-input); color: var(--fg-1); }
.rc-combo .rc-caret { border-radius: 0; width: 16px; }
.rc-combo[data-disabled="1"] { border-color: var(--stroke-2); }
.rc-combo[data-disabled="1"] input { color: var(--fg-disabled); }
.w-font { width: 140px; }
.w-size { width: 56px; }
/* Scale to Fit and Shape Size reuse the font-size combo's class but hold words
   ("Automatic") and percentages ("100%"), not two digits: at 52px they read
   "Autc" and "100'". */
.grp[data-group="Scale to Fit"] .w-size,
.grp[data-group="Size"] .w-size { width: 78px; }
.w-numfmt { width: 108px; }
.w-name  { width: 116px; }

/* --- 5.4 checkbox (Sheet Options, Table Style Options) ------------------- */
.rc-check { height: 20px; padding: 0 4px; gap: 6px; font-size: var(--fs-body); color: var(--fg-1); }
.rc-check .rc-box { width: 14px; height: 14px; border-radius: var(--r-xs); flex: none;
  border: var(--hair) solid var(--stroke-strong); background: var(--bg-raised);
  display: inline-flex; align-items: center; justify-content: center; color: transparent;
  transition: background var(--dur-fast) var(--ease-standard),
              border-color var(--dur-fast) var(--ease-standard),
              color var(--dur-fast) var(--ease-standard); }
.rc-check[aria-checked="true"] { background: transparent; color: var(--fg-1); }
.rc-check[aria-checked="true"] .rc-box { background: var(--accent); border-color: var(--accent);
  color: var(--on-accent); }
.rc-check:hover .rc-box { border-color: var(--stroke-hover); }

/* --- 5.5 in-ribbon gallery ---------------------------------------------- */
.rc-gallery { display: flex; align-items: center; gap: 3px; height: var(--ctl-lg-h);
  padding: 4px 3px 4px 4px; }
.gal-items { display: flex; gap: 3px; }
.gal-item { width: 52px; height: 34px; border-radius: var(--r-md); flex: none;
  border: var(--hair) solid var(--stroke-1); background: var(--bg-raised);
  overflow: hidden; position: relative;
  transition: box-shadow var(--dur-fast) var(--ease-standard),
              border-color var(--dur-fast) var(--ease-standard),
              transform var(--dur-fast) var(--ease-standard); }
.gal-item:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.gal-item:active { transform: scale(.97); transition-duration: var(--dur-instant); }
.gal-item[aria-selected="true"] { border-color: var(--fg-1); box-shadow: 0 0 0 1px var(--fg-1); }
.gal-rail { display: flex; flex-direction: column; gap: 1px; }
.gal-rail button { width: 15px; height: 20px; border-radius: var(--r-xs); color: var(--fg-2);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background var(--dur-fast) var(--ease-standard); }
.gal-rail button:hover { background: var(--fill-hover); color: var(--fg-1); }
.gal-rail button:active { background: var(--fill-press); }
/* Cell-style swatch faces, drawn from tokens so they theme correctly. */
.face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: var(--fw-semi) 10px/1 var(--font-ui); letter-spacing: .02em; }
.face-good { background: color-mix(in srgb, var(--accent) 18%, var(--bg-raised)); color: var(--accent-fg); }
.face-bad  { background: color-mix(in srgb, var(--danger) 20%, var(--bg-raised)); color: var(--danger); }
.face-neu  { background: color-mix(in srgb, var(--warning) 20%, var(--bg-raised)); color: var(--warning); }
.face-ttl  { background: var(--bg-raised); color: var(--fg-1); border-bottom: 2px solid var(--accent); }
.face-note { background: var(--bg-sunken); color: var(--fg-3); }
/* Table-style faces: a header band and two body bands. */
.tface { position: absolute; inset: 0; display: flex; flex-direction: column; }
.tface i { display: block; flex: 1 1 0; }
.tface i:first-child { background: var(--tf, var(--accent)); flex: 0 0 9px; }
.tface i:nth-child(2) { background: color-mix(in srgb, var(--tf, var(--accent)) 16%, var(--bg-raised)); }
.tface i:nth-child(3) { background: var(--bg-raised); }
.tface i:nth-child(4) { background: color-mix(in srgb, var(--tf, var(--accent)) 16%, var(--bg-raised)); }

/* --- 5.6 the coverage legend -------------------------------------------- */
:root[data-gaps="1"] [data-gap="1"] {
  box-shadow: inset 0 0 0 var(--hair) var(--gap-stroke);
  background-image: linear-gradient(var(--gap-tint), var(--gap-tint));
  border-radius: var(--r-sm);
}
:root[data-gaps="1"] .rc-split[data-gap="1"] > .rc { box-shadow: none; }

/* ==========================================================================
   6. POPUPS — menus, galleries, colour pickers, combo lists
   One controller drives them all (see the JS). They are positioned from their
   trigger's measured rect WHILE SHOWN: measuring a hidden panel yields 0x0 and
   makes every flip and clamp dead code.
   ========================================================================== */
.pop { position: fixed; z-index: var(--z-menu); min-width: 168px; max-width: 380px;
  padding: 4px; border-radius: var(--r-panel); background: var(--bg-raised);
  border: var(--hair) solid var(--stroke-1); box-shadow: var(--sh-flyout);
  max-height: 70vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
  transform-origin: var(--pop-origin, top left);
  animation: pop-in var(--dur-normal) var(--ease-decelerate) both; }
@keyframes pop-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.pop[data-closing="1"] { animation: pop-out var(--dur-fast) var(--ease-accelerate) both; }
@keyframes pop-out { to { opacity: 0; } }   /* leaving does not shrink: it reads slower */

.mi { width: 100%; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px 0 6px;
  border-radius: var(--r-md); color: var(--fg-1); font-size: var(--fs-tab); text-align: left;
  transition: background var(--dur-fast) var(--ease-standard); }
.mi:hover { background: var(--fill-hover); }         /* rows tint, controls lift */
.mi:active { background: var(--fill-press); }
.mi[aria-checked="true"] { background: var(--fill-selected); }
.mi[disabled], .mi[aria-disabled="true"] { color: var(--fg-disabled); pointer-events: none; }
.mi-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.mi-key { flex: none; font-size: var(--fs-caption); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.mi-check { width: 14px; flex: none; color: var(--accent-fg); display: inline-flex;
  align-items: center; justify-content: center; }
.mi[aria-checked="false"] .mi-check { visibility: hidden; }
.mi-sub { flex: none; color: var(--fg-3); }
.mi-sep { height: var(--hair); background: var(--stroke-2); margin: 4px 6px; }
.mi-head { padding: 6px 8px 4px; font-size: var(--fs-caption); font-weight: var(--fw-semi);
  color: var(--fg-3); letter-spacing: .03em; text-transform: uppercase; }
.mi-empty { padding: 10px 8px; font-size: var(--fs-body); color: var(--fg-3); }
.pop-grid { display: grid; grid-template-columns: repeat(10, 18px); gap: 3px; padding: 4px 6px 6px; }
.sw { width: 18px; height: 18px; border-radius: var(--r-xs); background: var(--c);
  box-shadow: inset 0 0 0 var(--hair) var(--stroke-2);
  transition: transform var(--dur-fast) var(--ease-standard),
              box-shadow var(--dur-fast) var(--ease-standard); }
.sw:hover { transform: scale(1.14); box-shadow: 0 0 0 2px var(--accent); }
.sw:active { transform: scale(1); }
.sw[aria-selected="true"] { box-shadow: 0 0 0 2px var(--fg-1); }
.pop-gal { display: grid; grid-template-columns: repeat(4, 60px); gap: 5px; padding: 4px; }
.pop-gal .gal-item { width: 60px; height: 38px; }
/* Staggered entrance, capped: past ~100ms a stagger stops reading as
   choreography and starts reading as lag. */
.pop-gal .gal-item, .pop-grid .sw { animation: pop-item var(--dur-fast) var(--ease-decelerate) both;
  animation-delay: calc(min(var(--i, 0), 8) * 12ms); }
@keyframes pop-item { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.tip { position: fixed; z-index: var(--z-tooltip); pointer-events: none;
  max-width: 260px; padding: 6px 8px; border-radius: var(--r-md);
  background: var(--bg-raised); border: var(--hair) solid var(--stroke-1);
  box-shadow: var(--sh-overlay); font-size: var(--fs-body); color: var(--fg-1);
  animation: pop-in var(--dur-fast) var(--ease-decelerate) both; }
.tip b { display: block; font-weight: var(--fw-semi); margin-bottom: 2px; }
.tip span { color: var(--fg-3); }

/* The dismiss surface behind an open popup. It has to sit UNDER the popup:
   with `--z-scrim` (70) against `--z-menu` (60) it covered every menu it was
   opened with, and `elementFromPoint` on any menu row returned the scrim — so
   no menu item in this file could be clicked with a real pointer, only with a
   scripted `.click()`. Found by driving the header context menu with the
   mouse; invisible to reading, and invisible to a screenshot, because the
   menu draws perfectly. `--z-scrim` itself is unchanged: `.dlg-scrim` is a
   MODAL scrim and does belong above the menus. */
.scrim { position: fixed; inset: 0; z-index: calc(var(--z-menu) - 1); background: transparent; }

/* ==========================================================================
   7. FORMULA BAR
   ========================================================================== */
.formulabar { height: var(--h-formula); display: flex; align-items: stretch; gap: 0;
  background: var(--bg-canvas); border-bottom: var(--hair) solid var(--stroke-2);
  padding: 0 0 0 2px; }
.namebox { display: flex; align-items: stretch; width: 124px; flex: none; }
.namebox input { width: 100%; min-width: 0; border: 0; background: none; outline: none;
  font: var(--fw-semi) var(--fs-input)/1 var(--font-mono); color: var(--fg-1);
  text-align: center; font-variant-numeric: tabular-nums; padding: 0 2px; border-radius: var(--r-sm); }
.namebox input:focus { background: var(--fill-hover); }
.fb-btn { width: 26px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg-2); border-radius: var(--r-sm);
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.fb-btn:hover { background: var(--fill-hover); color: var(--fg-1); }
.fb-btn:active { background: var(--fill-press); }
.fb-btn[disabled] { color: var(--fg-disabled); cursor: default; }
.fb-btn.ok:hover { color: var(--accent-fg); }
.fb-btn.no:hover { color: var(--danger); }
.fb-seam { width: var(--hair); background: var(--stroke-2); flex: none; margin: 5px 3px; }
.fb-input { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; padding: 0 6px; }
.fb-input input { width: 100%; border: 0; background: none; outline: none;
  font: var(--fw-reg) var(--fs-input)/1 var(--font-mono); color: var(--fg-1); }
.formulabar[data-expanded="1"] { height: 84px; align-items: flex-start; }
.formulabar[data-expanded="1"] .fb-input { align-items: flex-start; padding-top: 6px; }

/* ==========================================================================
   8. GRID
   ========================================================================== */
.work { flex: 1 1 auto; display: flex; min-height: 0; background: var(--bg-canvas);
  position: relative; }   /* the direct-manipulation overlay hangs off this */
.gridwrap { flex: 1 1 auto; min-width: 0; position: relative; overflow: auto;
  scrollbar-gutter: stable; background: var(--bg-canvas); }
.sheet { display: grid; position: relative; width: max-content;
  font-size: var(--fs-input); }
.sheet { --gz: 1; font-size: calc(var(--fs-input) * var(--gz)); }
/* The row height used to live here as a fixed `height`. It cannot any more:
   rows are individually resizable, so the *track* owns the height and the item
   fills it. `height: 100%` resolves against the grid area, which is a definite
   px track in every case because `templateRows()` always writes one. */
.cell, .colhead, .rowhead, .corner {
  border-right: var(--hair) solid var(--grid-line);
  border-bottom: var(--hair) solid var(--grid-line);
  height: 100%; min-height: 0; display: flex; align-items: center; padding: 0 5px;
  overflow: hidden; white-space: nowrap; position: relative;
  font-variant-numeric: tabular-nums lining-nums; }
/* Autofit measures for real: the row track goes to `min-content` for one frame
   and the cell is allowed to be as tall as its text. */
.sheet[data-measuring="1"] .cell { height: auto; }
.colhead, .rowhead, .corner {
  background: var(--grid-header-bg); color: var(--grid-header-fg);
  font-size: .86em; font-weight: var(--fw-med);
  justify-content: center; padding: 0 2px; user-select: none;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.colhead { position: sticky; top: 0; z-index: var(--z-sticky); }
.rowhead { position: sticky; left: 0; z-index: var(--z-sticky); }
.corner  { position: sticky; top: 0; left: 0; z-index: calc(var(--z-sticky) + 1); }
.colhead[data-hot="1"], .rowhead[data-hot="1"] {
  background: var(--grid-header-hot); color: var(--accent-fg); font-weight: var(--fw-semi); }
.cell { background: var(--bg-canvas); color: var(--fg-1); cursor: cell; }
.cell[data-num="1"] { justify-content: flex-end; }
.cell[data-b="1"] { font-weight: var(--fw-semi); }
.cell[data-muted="1"] { color: var(--fg-3); }
.cell[data-total="1"] { background: var(--grid-total-bg); font-weight: var(--fw-semi);
  border-top: 2px solid var(--fg-1); }
.cell[data-title="1"] { font-size: 14px; font-weight: var(--fw-semi); }
.cell[data-hdr="1"] { background: color-mix(in srgb, var(--accent) 15%, var(--bg-canvas));
  color: var(--accent-fg); font-weight: var(--fw-semi); }
.cell[data-spill="1"] { overflow: visible; z-index: 1; }
.cell[data-sel="1"] { background: var(--grid-sel-fill); }
.cell[data-active="1"] { background: var(--bg-canvas); }
/* Conditional formats, drawn from tokens. */
.bar { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--viz-bar);
  border-radius: 0 var(--r-xs) var(--r-xs) 0; pointer-events: none; }
.bar[data-neg="1"] { background: var(--viz-bar-neg); }
.cell[data-scale="hi"] { background: var(--viz-scale-hi); }
.cell[data-scale="mid"] { background: var(--viz-scale-mid); }
.cell[data-scale="lo"] { background: var(--viz-scale-lo); }
/* The selection rectangle is one absolutely-positioned box over the sheet, so
   moving it never repaints a cell. */
.selbox { position: absolute; pointer-events: none; z-index: var(--z-grid-overlay);
  border: 2px solid var(--grid-sel-edge); border-radius: 1px;
  transition: left var(--dur-fast) var(--ease-standard), top var(--dur-fast) var(--ease-standard),
              width var(--dur-fast) var(--ease-standard), height var(--dur-fast) var(--ease-standard); }
.selbox::after { content: ""; position: absolute; right: -4px; bottom: -4px;
  width: 6px; height: 6px; background: var(--grid-sel-edge);
  border: var(--hair) solid var(--bg-canvas); border-radius: 1px; }

/* ==========================================================================
   8b. DIRECT MANIPULATION — resize, autofit, reorder, freeze
   The gestures the real editor already has (webapp/editor.geometry.js:423,
   webapp/editor.core.js:3550 and :7488). Nothing here is decorative: each rule
   exists because one of those gestures needs a state drawn.
   ========================================================================== */

/* --- the cursor is the affordance ---------------------------------------
   A grab zone with no cursor change is a gesture nobody discovers. The zone is
   hit-tested in JS (RESIZE_GRAB = 5 px either side of the boundary, as
   webapp/editor.core.js:1885 declares) and the result lands here. */
.colhead[data-grab="edge"] { cursor: col-resize; }
.rowhead[data-grab="edge"] { cursor: row-resize; }
.colhead[data-grab="move"], .rowhead[data-grab="move"] { cursor: grab; }
/* The whole drag reads as the drag it is. This was a real bug in the product
   (editor.core.js:7488): the move branch returned before the hover block that
   sets the cursor, so a reorder in progress still showed a cell cursor and
   nothing on screen said a drag was happening. */
body[data-gdrag="move"], body[data-gdrag="move"] * { cursor: grabbing !important; }
body[data-gdrag="col"],  body[data-gdrag="col"]  * { cursor: col-resize !important; }
body[data-gdrag="row"],  body[data-gdrag="row"]  * { cursor: row-resize !important; }
body[data-gdrag] { user-select: none; }

/* --- frozen panes --------------------------------------------------------
   Freeze is sticky positioning, not a second scroller: the frozen lines keep
   their own offsets and pin at them, so one scroll container still owns the
   whole sheet and the selection box needs no second coordinate space. */
.cell[data-frzc="1"], .cell[data-frzr="1"] { position: sticky; z-index: 12; }
.cell[data-frzc="1"][data-frzr="1"] { z-index: 14; }
.colhead[data-frzc="1"] { z-index: calc(var(--z-sticky) + 2); }
.rowhead[data-frzr="1"] { z-index: calc(var(--z-sticky) + 2); }
/* Excel draws the frozen edge as a darker rule, not as a gridline. Two
   pseudo-elements rather than a border, so the quadrant corner can carry both
   and neither costs a pixel of layout. */
.cell[data-fzv="1"]::before, .colhead[data-fzv="1"]::before, .corner[data-fzv="1"]::before {
  content: ""; position: absolute; top: 0; bottom: 0; right: -1px; width: 2px;
  background: var(--grid-freeze-line); pointer-events: none; z-index: 3; }
.cell[data-fzh="1"]::after, .rowhead[data-fzh="1"]::after, .corner[data-fzh="1"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--grid-freeze-line); pointer-events: none; z-index: 3; }
/* The two grab handles that *create* a freeze, in the corner box — the same
   place Sheets puts them, and for the reason editor.core.js:3568 gives: a grab
   zone on the body's leading edge sits exactly where column A's cells are and
   would swallow selection clicks forever after. */
.fzh { position: absolute; background: var(--grid-freeze-grip); border-radius: 1px; opacity: .62;
  transition: opacity var(--dur-fast) var(--ease-standard),
              background var(--dur-fast) var(--ease-standard); }
.fzh:hover { opacity: 1; background: var(--grid-freeze-line); }
.fzh[data-axis="c"] { right: 0; top: 16%; width: 5px; height: 50%; cursor: col-resize; }
.fzh[data-axis="r"] { left: 16%; bottom: 0; height: 5px; width: 50%; cursor: row-resize; }
.corner[data-fc="1"] .fzh[data-axis="c"] { display: none; }
.corner[data-fr="1"] .fzh[data-axis="r"] { display: none; }

/* --- hidden lines --------------------------------------------------------
   A hidden column that leaves no trace is a column the user cannot find again.
   The next visible header carries the doubled rule Excel draws. */
.cell[data-hid="1"], .colhead[data-hid="1"], .rowhead[data-hid="1"] {
  border-right-width: 0; border-bottom-width: 0; padding: 0; }
.colhead[data-hidprev="1"] { box-shadow: inset 3px 0 0 -1px var(--grid-hidden-mark); }
.rowhead[data-hidprev="1"] { box-shadow: inset 0 3px 0 -1px var(--grid-hidden-mark); }

/* --- the overlay the gestures draw into ----------------------------------
   One absolutely-positioned layer over the work area, outside the scroller, so
   a guide never scrolls away from the pointer it is tracking. */
.gridfx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 40; }
/* NO transition on any of these, on purpose. A guide that eases toward the
   pointer lags behind it, and a drag indicator that lags reads as broken. */
.gfx-guide, .gfx-drop { position: absolute; background: var(--grid-guide); }
.gfx-guide[data-axis="v"], .gfx-drop[data-axis="v"] { width: 2px; top: 0; bottom: 0; }
.gfx-guide[data-axis="h"], .gfx-drop[data-axis="h"] { height: 2px; left: 0; right: 0; }
.gfx-drop { box-shadow: 0 0 0 1px color-mix(in srgb, var(--bg-canvas) 70%, transparent); }
.gfx-drop::before, .gfx-drop::after { content: ""; position: absolute;
  border: 4px solid transparent; }
.gfx-drop[data-axis="v"]::before { top: -1px; left: -3px; border-top-color: var(--grid-guide); }
.gfx-drop[data-axis="v"]::after  { bottom: -1px; left: -3px; border-bottom-color: var(--grid-guide); }
.gfx-drop[data-axis="h"]::before { left: -1px; top: -3px; border-left-color: var(--grid-guide); }
.gfx-drop[data-axis="h"]::after  { right: -1px; top: -3px; border-right-color: var(--grid-guide); }
.gfx-ghost { position: absolute; background: var(--grid-ghost-fill);
  border: var(--hair) solid var(--grid-ghost-edge); border-radius: var(--r-xs);
  box-shadow: var(--sh-flyout); opacity: .8; }
.gfx-tip { position: absolute; padding: 3px 7px; border-radius: var(--r-sm);
  background: var(--grid-tip-bg); color: var(--grid-tip-fg);
  font-size: var(--fs-caption); font-weight: var(--fw-med); white-space: nowrap;
  font-variant-numeric: tabular-nums lining-nums; box-shadow: var(--sh-flyout); }
/* The freeze divider stays grabbable once it exists (FREEZE_GRAB = 8, and the
   comment at editor.core.js:3550 records why 4 was not enough). */
.gfx-fzgrab { position: absolute; pointer-events: auto; }
.gfx-fzgrab[data-axis="v"] { width: 9px; margin-left: -4px; cursor: col-resize; }
.gfx-fzgrab[data-axis="h"] { height: 9px; margin-top: -4px; cursor: row-resize; }
.gfx-fzgrab:hover { background: color-mix(in srgb, var(--grid-freeze-line) 40%, transparent); }

/* Floating objects scroll with the body, so a frozen pane has to cover them.
   At `--z-grid-overlay` (20) the chart slid OVER the frozen columns instead of
   under them; 10 still keeps it above ordinary cells and the spill layer. */
.sheet .obj { z-index: 10; }   /* specificity, not order: §11 declares .obj later */

/* The commit animates, unlike the drag. A band that lands with no acknowledgement
   leaves the user checking whether the gesture took. */
.cell[data-just="1"], .colhead[data-just="1"], .rowhead[data-just="1"] {
  animation: gfx-settle var(--dur-slow) var(--ease-emphasis) both; }
@keyframes gfx-settle {
  from { box-shadow: inset 0 0 0 999px var(--grid-ghost-fill); }
  to   { box-shadow: inset 0 0 0 999px transparent; } }

/* The size dialog's one field. */
.dlg-num { display: flex; align-items: center; gap: 6px; }
.dlg-num input { width: 92px; height: 26px; padding: 0 7px; border-radius: var(--r-md);
  border: var(--hair) solid var(--stroke-1); background: var(--bg-raised); color: var(--fg-1);
  font: inherit; font-size: var(--fs-body); font-variant-numeric: tabular-nums;
  transition: border-color var(--dur-fast) var(--ease-standard); }
/* No :focus-visible override here — the global rule at §"focus" draws the
   double ring, and a box-shadow declared later would silently eat it. */
.dlg-num input[aria-invalid="true"] { border-color: var(--danger); }
.dlg-num span { font-size: var(--fs-body); color: var(--fg-3); }
.dlg-err { margin-top: 5px; font-size: var(--fs-caption); color: var(--danger); }

/* ==========================================================================
   9. SHEET TABS + STATUS BAR
   ========================================================================== */
.sheetbar { height: var(--h-sheets); display: flex; align-items: center; gap: 2px;
  padding: 0 6px; background: var(--bg-subtle);
  border-top: var(--hair) solid var(--stroke-2); }
.snav { width: 20px; height: 20px; border-radius: var(--r-sm); color: var(--fg-3); flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.snav:hover { background: var(--fill-hover); color: var(--fg-1); }
.snav:active { background: var(--fill-press); }
.snav[disabled] { color: var(--fg-disabled); cursor: default; }
.stabs { flex: 1 1 auto; min-width: 0; display: flex; align-items: stretch; gap: 1px;
  overflow-x: auto; scrollbar-width: none; }
.stabs::-webkit-scrollbar { display: none; }
.stab { flex: none; height: 22px; padding: 0 10px; border-radius: var(--r-sm) var(--r-sm) 0 0;
  font-size: var(--fs-body); color: var(--fg-3); display: inline-flex; align-items: center; gap: 6px;
  position: relative; align-self: flex-end;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.stab:hover { background: var(--fill-hover); color: var(--fg-1); }
.stab:active { background: var(--fill-press); }
.stab[aria-selected="true"] { background: var(--bg-canvas); color: var(--fg-1);
  font-weight: var(--fw-semi); box-shadow: var(--sh-raised); }
.stab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0;
  height: 2px; background: var(--accent-fg); border-radius: 1px 1px 0 0; }
.stab-dot { width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--sc, transparent); flex: none; }

.statusbar { height: var(--h-status); display: flex; align-items: center; gap: 10px;
  padding: 0 8px; background: var(--bg-subtle); border-top: var(--hair) solid var(--stroke-2);
  font-size: var(--fs-caption); color: var(--fg-3); }
.st-mode { font-weight: var(--fw-med); color: var(--fg-2); min-width: 40px; }
.st-spacer { margin-left: auto; }
/* The stats are three label/value pairs in a 24px band. Without nowrap they
   wrapped at 933px and pushed the band to 31px — the status bar grew and the
   grid lost two rows, silently. */
.st-stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums lining-nums;
  color: var(--fg-2); flex: none; white-space: nowrap; }
.st-stats > span { white-space: nowrap; }
.statusbar { overflow: hidden; }
.st-width { flex: none; }
.st-stats b { font-weight: var(--fw-reg); color: var(--fg-3); }
.st-views { display: flex; gap: 1px; }
.stv { width: 22px; height: 18px; border-radius: var(--r-sm); color: var(--fg-3);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.stv:hover { background: var(--fill-hover); color: var(--fg-1); }
.stv:active { background: var(--fill-press); }
.stv[aria-pressed="true"] { background: var(--fill-checked); color: var(--accent-fg); }
.zoom { display: flex; align-items: center; gap: 6px; }
.zoom input[type="range"] { width: 96px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.zoom-read { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums;
  border-radius: var(--r-sm); padding: 2px 4px; color: var(--fg-2);
  transition: background var(--dur-fast) var(--ease-standard); }
.zoom-read:hover { background: var(--fill-hover); color: var(--fg-1); }

/* --- 9.1 SIMPLIFIED (Single Line) layout ---------------------------------
   The same authored model, one row: captions and group rules go, the stacks
   become a row, and the large icon-over-label buttons become small icon-only
   ones. SEAM: pass 2 replaces this with the authored per-tab row and the
   trailing More Options ellipsis; nothing below needs to change for that. */
:root[data-ribbon-layout="simplified"] .ribbon-panel { align-items: center; padding: 0 6px; }
:root[data-ribbon-layout="simplified"] .grp-cap { display: none; }
:root[data-ribbon-layout="simplified"] .grp { padding-top: 0; justify-content: center; }
:root[data-ribbon-layout="simplified"] .grp + .grp { margin-left: 8px; }
:root[data-ribbon-layout="simplified"] .grp + .grp::before { display: none; }
:root[data-ribbon-layout="simplified"] .grp-body { padding: 0 2px; align-items: center; }
:root[data-ribbon-layout="simplified"] .stack { flex-direction: row; align-items: center; }
:root[data-ribbon-layout="simplified"] .row { height: 28px; }
:root[data-ribbon-layout="simplified"] .row:empty { display: none; }
:root[data-ribbon-layout="simplified"] .rc-lg { flex-direction: row; height: 28px; width: 28px;
  min-width: 28px; max-width: 28px; padding: 0; justify-content: center; }
:root[data-ribbon-layout="simplified"] .rc-lg .rc-label { display: none; }
:root[data-ribbon-layout="simplified"] .rc-lg .ic-lg { width: 18px; height: 18px; }
:root[data-ribbon-layout="simplified"] .rc-lg .ic-tiny { display: none; }
:root[data-ribbon-layout="simplified"] .rc-md .rc-label { display: none; }
:root[data-ribbon-layout="simplified"] .rc-md { width: 28px; padding: 0; justify-content: center; }
:root[data-ribbon-layout="simplified"] .rc-sm { width: 28px; height: 28px; }
:root[data-ribbon-layout="simplified"] .rc-split-lg { flex-direction: row; height: 28px;
  min-width: 0; max-width: none; }
:root[data-ribbon-layout="simplified"] .rc-split-lg > .rc:last-child { width: var(--caret-w);
  height: 28px; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
:root[data-ribbon-layout="simplified"] .rc-split-lg > .rc + .rc::before { left: 0; right: auto;
  top: 5px; bottom: 5px; width: var(--hair); height: auto; }
:root[data-ribbon-layout="simplified"] .rc-combo { height: 28px; }
:root[data-ribbon-layout="simplified"] .vsep { display: none; }

/* ==========================================================================
   10. RESPONSIVE — authored steps, not a measurement loop. A command never
   changes position between two widths; groups fold in a named order.
   SEAM: the Simplified single-row layout attaches here (pass 2).
   ========================================================================== */
/* The fold ORDER is authored per group, in the assignment's own sequence
   (Add-ins, Analysis, Editing, Cells, Styles, Clipboard, Editing's large
   buttons, Alignment, Font). Only the point at which each step fires is
   measured — that is the shipped toolbar's rule too, and it is why a command
   never changes position between two widths, it only ever degrades in place.
   :root carries a space-separated list of the levels currently applied.

   EVERY RULE IS SCOPED TO #panel-home, and the ladder only runs on that panel.
   It was not, and the leak was invisible: Home's level 2 hides the group named
   "Analysis", the Data tab has a group of the same name, and so at any width
   where Home had folded twice, switching to Data drew a ribbon with its
   Analysis group deleted — data.column-stats present in listCommands(),
   pointer-unreachable, and not even a chip to say so. */
:root[data-fold~="1"] #panel-home .grp[data-group="Add-ins"]  { display: none; }
:root[data-fold~="2"] #panel-home .grp[data-group="Analysis"] { display: none; }
:root[data-fold~="3"] #panel-home .grp[data-group="Editing"]   .rc-md .rc-label { display: none; }
:root[data-fold~="3"] #panel-home .grp[data-group="Editing"]   .rc-md { width: var(--ctl-row); padding: 0; justify-content: center; }
:root[data-fold~="4"] #panel-home .grp[data-group="Cells"]  .rc-lg .rc-label { display: none; }
:root[data-fold~="4"] #panel-home .grp[data-group="Cells"]  .rc-lg { min-width: 34px; max-width: 34px; justify-content: center; }
:root[data-fold~="5"] #panel-home .grp[data-group="Styles"] .rc-lg .rc-label { display: none; }
:root[data-fold~="5"] #panel-home .grp[data-group="Styles"] .rc-lg { min-width: 34px; max-width: 34px; justify-content: center; }
:root[data-fold~="6"] #panel-home .grp[data-group="Clipboard"] .rc-md .rc-label { display: none; }
:root[data-fold~="6"] #panel-home .grp[data-group="Clipboard"] .rc-md { width: var(--ctl-row); padding: 0; justify-content: center; }
:root[data-fold~="7"] #panel-home .grp[data-group="Editing"] .rc-lg .rc-label { display: none; }
:root[data-fold~="7"] #panel-home .grp[data-group="Editing"] .rc-lg { min-width: 34px; max-width: 34px; justify-content: center; }
:root[data-fold~="8"] #panel-home .grp[data-group="Alignment"] .rc-md .rc-label { display: none; }
:root[data-fold~="8"] #panel-home .grp[data-group="Alignment"] .rc-md { width: var(--ctl-row); padding: 0; justify-content: center; }
:root[data-fold~="9"]  #panel-home .grp[data-group="Font"] .w-font { width: 96px; }
:root[data-fold~="9"]  #panel-home .grp[data-group="Font"] .w-size { width: 42px; }
/* Below here a whole group folds into its chip, still in the authored order. */
:root[data-fold~="10"] #panel-home .grp[data-group="Editing"] > .grp-body,
:root[data-fold~="10"] #panel-home .grp[data-group="Editing"] > .grp-cap  { display: none; }
:root[data-fold~="10"] #panel-home .grp[data-group="Editing"] > .grp-chip { display: flex; }
:root[data-fold~="10"] #panel-home .grp[data-group="Editing"] { padding-top: var(--pad-group); }
:root[data-fold~="11"] #panel-home .grp[data-group="Cells"] > .grp-body,
:root[data-fold~="11"] #panel-home .grp[data-group="Cells"] > .grp-cap  { display: none; }
:root[data-fold~="11"] #panel-home .grp[data-group="Cells"] > .grp-chip { display: flex; }
:root[data-fold~="11"] #panel-home .grp[data-group="Cells"] { padding-top: var(--pad-group); }
:root[data-fold~="12"] #panel-home .grp[data-group="Styles"] > .grp-body,
:root[data-fold~="12"] #panel-home .grp[data-group="Styles"] > .grp-cap  { display: none; }
:root[data-fold~="12"] #panel-home .grp[data-group="Styles"] > .grp-chip { display: flex; }
:root[data-fold~="12"] #panel-home .grp[data-group="Styles"] { padding-top: var(--pad-group); }
:root[data-fold~="13"] #panel-home .grp[data-group="Clipboard"] > .grp-body,
:root[data-fold~="13"] #panel-home .grp[data-group="Clipboard"] > .grp-cap  { display: none; }
:root[data-fold~="13"] #panel-home .grp[data-group="Clipboard"] > .grp-chip { display: flex; }
:root[data-fold~="13"] #panel-home .grp[data-group="Clipboard"] { padding-top: var(--pad-group); }
:root[data-fold~="14"] #panel-home .grp[data-group="Number"] > .grp-body,
:root[data-fold~="14"] #panel-home .grp[data-group="Number"] > .grp-cap  { display: none; }
:root[data-fold~="14"] #panel-home .grp[data-group="Number"] > .grp-chip { display: flex; }
:root[data-fold~="14"] #panel-home .grp[data-group="Number"] { padding-top: var(--pad-group); }
:root[data-fold~="15"] #panel-home .grp[data-group="Alignment"] > .grp-body,
:root[data-fold~="15"] #panel-home .grp[data-group="Alignment"] > .grp-cap  { display: none; }
:root[data-fold~="15"] #panel-home .grp[data-group="Alignment"] > .grp-chip { display: flex; }
:root[data-fold~="15"] #panel-home .grp[data-group="Alignment"] { padding-top: var(--pad-group); }
:root[data-fold~="16"] #panel-home .grp[data-group="Font"] > .grp-body,
:root[data-fold~="16"] #panel-home .grp[data-group="Font"] > .grp-cap  { display: none; }
:root[data-fold~="16"] #panel-home .grp[data-group="Font"] > .grp-chip { display: flex; }
:root[data-fold~="16"] #panel-home .grp[data-group="Font"] { padding-top: var(--pad-group); }
/* Chrome outside the ribbon degrades on plain width, because it has no order
   to preserve. */
@media (max-width: 1280px) { .search { width: min(280px, 26vw); } }
@media (max-width: 1120px) { .account-name { display: none; } .autosave-label { display: none; } }
@media (max-width: 1024px) { .search { width: 170px; } .doc-state { display: none; } }

/* Reduced motion: everything collapses to instant and the END STATE IS
   IDENTICAL. A reduced-motion path that also changes layout is a second design
   nobody reviewed. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
  .tab-underline { transition: none !important; }   /* a 1ms transform still paints an intermediate */
}
@media (prefers-contrast: more) {
  :root { --stroke-1: var(--fg-3); --stroke-2: var(--fg-3); --grid-line: var(--fg-3); }
}
/* ==========================================================================
   22. SIMPLIFIED (Single Line) — the authored per-tab row (pass 2)
   The row is a rendering of the SAME authored model: every control here is a
   proxy onto the one node in the classic panel that owns the command id, so
   the published command surface does not change when the layout does.
   ========================================================================== */
.simple-row { display: flex; align-items: center; gap: 0; height: 100%;
  padding: 0 4px; min-width: 100%; }
.simple-row .rc-sm { width: 30px; height: 30px; }
.simple-row .rc-combo { height: 26px; margin: 0 3px; }
.simple-row .rc-split { margin: 0; }
.simple-row .rc-split > .rc-sm { width: 26px; }
.simple-spring { flex: 1 1 auto; min-width: 4px; }
.simple-more { flex: none; }
/* A cluster boundary in Simplified is whitespace, not a rule — Simplified has
   no group captions to separate, so a rule would divide nothing named. */
.simple-row > [data-cluster] { margin-left: 8px; }
/* Classic and Simplified are two renderings of one model, so exactly one of
   them is in flow at a time. Both stay in the DOM. */
:root[data-ribbon-layout="classic"]    .ribbon-panel[data-simple][data-active="1"] { display: none; }
:root[data-ribbon-layout="simplified"] .ribbon-panel:not([data-simple])[data-active="1"] { display: none; }
/* Below the last rung the row scrolls inside itself rather than clipping —
   a command that is drawn and unreachable is worse than one in the menu.
   The ellipsis is pinned so the route to the rest never scrolls away. */
:root[data-ribbon-layout="simplified"] .ribbon-scroll { overflow-x: auto; }
.simple-more { position: sticky; right: 0; background: var(--bg-ribbon); }
/* A control the authored overflow ladder has pushed into the trailing menu is
   MOVED there, never cloned; while it is out of the row this class holds its
   place in the DOM order so it returns to the same slot. */
.simple-row [data-overflowed="1"] { display: none; }
/* The last rung of the Simplified ladder narrows the value combos. It changes a
   size, never a position: a command still never moves between two widths. */
.ribbon-panel[data-tight="1"] .simple-row .w-font   { width: 92px; }
.ribbon-panel[data-tight="1"] .simple-row .w-numfmt { width: 76px; }
.ribbon-panel[data-tight="1"] .simple-row .w-name   { width: 84px; }
